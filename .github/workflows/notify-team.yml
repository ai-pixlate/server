name: Notify Team

# docs/ 가 develop 에 반영되면 팀 채널로 변경 알림을 보냅니다.
# 저장소 시크릿(DISCORD_WEBHOOK_URL / SLACK_WEBHOOK_URL)이 등록된 쪽으로만 전송됩니다.
on:
  push:
    branches: [develop]
    paths:
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    name: 팀 채널 알림
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      # 커밋 메시지는 셸 인젝션을 피하려고 반드시 환경변수로만 넘깁니다.
      - name: 메시지 재료 수집
        run: |
          {
            echo "SPEC_VERSION=$(grep -m1 '^  version:' docs/openapi.yaml | sed 's/.*version:[[:space:]]*//')"
            echo "OP_COUNT=$(grep -cE '^  /' docs/openapi.yaml)"
            echo "COMMIT_SUBJECT=$(git log -1 --pretty=%s | tr -d '\r\n')"
            echo "COMMIT_AUTHOR=$(git log -1 --pretty=%an | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Discord 전송
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          jq -n --arg title "$COMMIT_SUBJECT" --arg url "$COMMIT_URL" \
                --arg ver "$SPEC_VERSION" --arg cnt "$OP_COUNT" \
                --arg author "$COMMIT_AUTHOR" --arg pages "$PAGES_URL" \
            '{content: "📘 Pixate API 문서가 업데이트되었습니다 (develop)",
              embeds: [{title: $title, url: $url,
                        description: ("버전 `" + $ver + "` · 엔드포인트 " + $cnt + "개\n작성자: " + $author + "\n문서 보기: " + $pages)}]}' \
            > payload.json
          curl -sSf -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK_URL"

      - name: Slack 전송
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          jq -n --arg title "$COMMIT_SUBJECT" --arg url "$COMMIT_URL" \
                --arg ver "$SPEC_VERSION" --arg cnt "$OP_COUNT" \
                --arg author "$COMMIT_AUTHOR" --arg pages "$PAGES_URL" \
            '{text: ("*Pixate API 문서 업데이트* (develop)\n<" + $url + "|" + $title + ">\n버전 `" + $ver + "` · 엔드포인트 " + $cnt + "개 · " + $author + "\n문서 보기: " + $pages)}' \
            > payload.json
          curl -sSf -H "Content-Type: application/json" -d @payload.json "$SLACK_WEBHOOK_URL"
