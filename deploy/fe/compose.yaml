# EC2 FE 컨테이너(pixlate-fe) 하나만 선언한다. API·cpu 워커·복구·Redis 는 start-pixlate.sh 가 관리한다
# (같은 컨테이너를 Compose 와 배포 스크립트가 함께 관리하지 않는다). 직접 부르지 않고 pixlate-fe.sh 로 다룬다.
# 값은 /etc/pixlate/fe.env(fe.env.example) — 비밀 값 없음. 이미지는 digest 로만 지정한다.
name: pixlate-fe
services:
  fe:
    image: ${FE_IMAGE:?FE_IMAGE 없음(fe.env)}
    container_name: pixlate-fe
    # 재시작 주체는 systemd(pixlate-fe.service) 하나다. Docker 재시작 정책을 쓰면 데몬 재시작·재부팅 때
    # BE 모드 확인보다 먼저 FE 가 뜰 수 있다. 실행 중 종료는 pixlate-fe.sh run 이 감지해 서비스를 실패로 끝내고 systemd 가 다시 띄운다.
    restart: "no"
    init: true
    # pixlate-fe.sh 는 docker stop 을 쓰지 않는다(TERM 만 보내고 기다린다). 이 값은 Docker 가 스스로 멈출 때
    # (데몬 종료 등)의 유예다 — 그 경우 유예 뒤 Docker 가 SIGKILL 을 보낼 수 있다.
    stop_grace_period: 120s
    ports:
      - "${FE_PORT:-3000}:3000"
    mem_limit: ${FE_MEM_LIMIT:-384m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # 페이지 응답만 본다(API 없이도 통과). API 연결은 pixlate-fe.sh 가 기동 때 따로 확인한다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/jobs/new"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [pixlate-net]
networks:
  # BE 네트워크(start-pixlate.sh 소유). FE 이미지의 API 프록시 대상 pixlate-api:8000 을 이 네트워크에서 찾는다
  pixlate-net:
    external: true
