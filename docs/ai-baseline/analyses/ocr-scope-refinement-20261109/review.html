<!doctype html><html lang="ko"><meta charset="utf-8"><title>OCR v6 영역·연결 검토</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui;margin:0;color:#162337;background:#f3f6fa}header{padding:18px;background:#fff;border-bottom:1px solid #ccd5e0}h1{font-size:22px;margin:0 0 10px}button,select,input{font:inherit;padding:7px}main{display:grid;grid-template-columns:52% 48%;height:calc(100vh - 170px)}#picture,#records{overflow:auto;padding:16px}#records{background:white}svg{width:100%;height:auto;background:white}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}tr:hover{background:#eef4ff}tr.selected{background:#fff0bb}.include{color:#096b4e}.exclude{color:#b42318}.undetermined{color:#9a6200}.note{color:#506477;font-size:13px}#info{margin:8px 0}label{margin-right:12px}a{color:#1359a5}rect{vector-effect:non-scaling-stroke}rect.active{stroke:#006bff!important;stroke-width:5!important}#legend{font-size:13px} .pill{padding:3px 6px;background:#e5ebf5;border-radius:4px}
</style>
<header><h1>OCR v6 영역·GT·OCR 연결 검토</h1>
<select id="section" aria-label="섹션"></select> <button id="prev">이전</button> <button id="next">다음</button>
<label><input type="checkbox" id="onlyPending">보류 섹션만</label>
<label><input type="checkbox" id="scope" checked>범위 주석</label><label><input type="checkbox" id="boxes" checked>OCR 번호</label>
<label>확대 <select id="zoom"><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option></select></label>
<div id="info"></div><div id="legend">초록 포함 · 빨강 제외 · 주황 보류 · 파랑 선택. 읽기 전용 / GT·OCR 원문 보존 / 채점·승인·동결 기능 없음.</div></header>
<main><div id="picture"></div><div id="records"><button id="gtTab">GT 줄</button> <button id="ocrTab">OCR 영역</button> <label><input type="checkbox" id="pending">보류 항목만</label><p class="note" id="help"></p><table><thead id="head"></thead><tbody id="body"></tbody></table></div></main>
<script src="data.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let active=DATA[0],mode='ocr',selected=null;const colors={include:'#0a9b64',exclude:'#dd4433',undetermined:'#e5a000',empty_no_text:'#8b95a3'};
function options(){let list=DATA.filter(s=>!$('onlyPending').checked||s.status==='보류');$('section').innerHTML=list.map(s=>`<option value="${s.id}">${s.id} · ${s.status}</option>`).join('');if(!list.some(s=>s.id===active.id))active=list[0];$('section').value=active.id;render()}
function render(){selected=null;$('info').textContent=`${active.id} | GT ${active.gt.length}줄 · OCR ${active.ocr.length}개 | GT 보류 ${active.gt_pending} · OCR 보류 ${active.ocr_pending} | 공식 채점 차단: 범위·GT 승인 전`;
 const w=active.image.width,h=active.image.height;let content=`<image href="${esc('file:///'+active.image.path.replaceAll('\\','/'))}" width="${w}" height="${h}"/>`;
 if($('scope').checked)for(const r of active.regions){if(r.id==='I0')continue;const [x,y,xx,yy]=r.rect_percent;content+=`<rect data-scope="${r.id}" x="${x*w/100}" y="${y*h/100}" width="${(xx-x)*w/100}" height="${(yy-y)*h/100}" fill="${colors[r.kind]||colors.undetermined}" fill-opacity=".06" stroke="${colors[r.kind]||colors.undetermined}" stroke-width="2"><title>${esc(r.id+' '+r.meaning)}</title></rect>`}
 if($('boxes').checked)for(const r of active.ocr){if(!r.bbox)continue;const b=r.bbox;content+=`<g data-ocr="${r.output_index}" style="cursor:pointer"><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="transparent" stroke="${colors[r.scope]}" stroke-width="1"/><text x="${b.x}" y="${b.y}" font-size="16" fill="${colors[r.scope]}">${r.output_index+1}</text><title>${esc(r.region_key+' '+r.text+' '+r.scope)}</title></g>`}
 $('picture').innerHTML=`<svg id="canvas" viewBox="0 0 ${w} ${h}" style="width:${$('zoom').value}%">${content}</svg>`;
 document.querySelectorAll('[data-ocr]').forEach(e=>e.onclick=()=>{mode='ocr';$('pending').checked=false;rows();select(+e.dataset.ocr)});rows()}
function rows(){let list=mode==='ocr'?active.ocr:active.gt;if($('pending').checked)list=list.filter(r=>r.scope==='undetermined');$('head').innerHTML='<tr><th>ID</th><th>기존 원문</th><th>범위</th><th>근거·연결</th></tr>';
 $('help').textContent=mode==='gt'?'GT는 기존 줄 ID·순서 그대로입니다. 줄별 검증된 bbox가 없는 경우 범위 후보만 강조하며 OCR과 일대일 정답 대응을 주장하지 않습니다.':'OCR 행이나 이미지 번호를 클릭하면 해당 원본 위치를 강조합니다. 순서·텍스트를 변경하지 않았습니다.';
 $('body').innerHTML=list.map(r=>`<tr data-row="${mode==='ocr'?r.output_index:r.line_id}"><td>${mode==='ocr'?`${r.output_index+1} ${r.region_key}`:r.line_id}</td><td>${esc(r.text||'∅ 빈 텍스트')}</td><td class="${r.scope}">${r.scope}</td><td>${esc(r.reason)}<br><span class="note">${esc(mode==='ocr'?r.method:r.region_candidates.join(', '))}</span></td></tr>`).join('');
 document.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>{if(mode==='ocr')select(+el.dataset.row);else{document.querySelectorAll('.active,.selected').forEach(x=>x.classList.remove('active','selected'));el.classList.add('selected');let g=active.gt.find(r=>r.line_id===el.dataset.row);g.region_candidates.forEach(id=>document.querySelector(`[data-scope="${id}"]`)?.classList.add('active'))}})}
function select(n){document.querySelectorAll('.active,.selected').forEach(x=>x.classList.remove('active','selected'));let shape=document.querySelector(`[data-ocr="${n}"] rect`),row=document.querySelector(`[data-row="${n}"]`);shape?.classList.add('active');row?.classList.add('selected');shape?.scrollIntoView({block:'center'});row?.scrollIntoView({block:'nearest'})}
$('section').onchange=()=>{active=DATA.find(s=>s.id===$('section').value);render()};$('onlyPending').onchange=options;for(const key of ['scope','boxes','zoom'])$(key).onchange=render;$('pending').onchange=rows;
$('gtTab').onclick=()=>{mode='gt';rows()};$('ocrTab').onclick=()=>{mode='ocr';rows()};for(const [id,delta] of [['prev',-1],['next',1]])$(id).onclick=()=>{let sel=$('section');sel.selectedIndex=Math.max(0,Math.min(sel.options.length-1,sel.selectedIndex+delta));sel.onchange()};options();
</script></html>
