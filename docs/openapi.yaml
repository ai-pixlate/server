        **[PRD v3.5.10 · 계약 확정(FE 11-03 · PM) · 구현 완료·서버 배포 대기] 섹션 저장** — 요청 `{action, revision}` + 선택 `Idempotency-Key`.
        처리 순서·멱등·오류 구분은 blockPatch 「저장 공통」과 같다(오퍼레이션 = 섹션 PATCH, 같은 요청 = 작업·섹션 ID·`action`·`revision`).

        1. 형식(422) — `action` 누락·잘못된 값·정의되지 않은 키·`revision` 정수 아님, `Idempotency-Key`가 있는데 `revision` 없음.

        2. 작업 소유(404) → 작업 행 잠금(대기 한도 초과 503, retryable) → 작업 상태 — N3·N5 검토 중이 아니면 409 INVALID_STATE `details.reason: job_not_editable`.

        3. 멱등 기록 — 같은 키·같은 요청이면 최초 응답(`Idempotent-Replayed: true`), 다른 요청이면 409 DUPLICATE `idempotency_key_reused`.

        4. 섹션(404) → revision — 보낸 `revision`이 현재와 다르면 409 REVISION_CONFLICT(`details.current` = 최신 Section 전체). **같은 상태 요청이어도 revision 검사가 먼저다.**

        5. N5에서 N3 제외 섹션 복원 → 409 INVALID_STATE `details.reason: n3_excluded_section`(같은 상태 판정보다 먼저).

        6. 이미 같은 상태(제외인데 제외, 포함인데 복원) → 200 변경 없음 — revision·사유·단계 그대로. 이 응답도 멱등 기록 대상이다.

        7. 적용 — 포함 상태를 바꾸고 revision +1, 멱등 기록과 같은 트랜잭션. 응답은 전체 Section(목록·상세와 같은 모양).

        - **복원(restore)의 의미** — N3 [번역하기]·N5 [되돌리기]·N5 Undo 모두 같다.
          직접 제외(`user_manual`)의 복원 = **제외 전 상태로**: 최초 판정이 포함이면 `exclusionReason: null`(새로운 「되살린 섹션」 배지를 붙이지 않는다),
          N3에서 되살렸던 섹션(최초 판정이 제외)이면 `restored_by_user`. 자동 제외(`auto_*`)의 복원 = `restored_by_user`(F-SEC-06).
          제외·복원 어느 쪽도 판정(verdicts)·근거·최초 판정 기록·`warningBadge`를 바꾸지 않는다.
        - **최초 판정 기록이 없는 직접 제외 섹션의 복원**(PM-R8 — 조사·처리 방침 결정 전): 실제로 복원해야 하는 경우 409 INVALID_STATE `details.reason: restore_basis_missing`으로 거절하고
          아무것도 바꾸지 않는다(섹션·revision·멱등 기록 모두). 이미 포함된 섹션의 restore는 6에 따라 200 변경 없음이다. 처리 방침이 정해지면 바꾼다.
        - 제외는 진행 중인 미리보기·검사 시도를 취소하지 않는다.
        - **N5 복원 때 미리보기 시도 확보 — 구현 완료·서버 배포 대기**: 복원한 섹션의 현재 미리보기 시도가 지금 입력과 같은 지문이면(대기·실행 중·완료·최종 실패) 그대로 쓴다 —
          같은 입력의 최종 실패와 재시도 횟수를 보존한다. 지문이 다르거나, 현재 시도가 없거나 취소됐을 때만 새 시도 하나를 만든다(입력 변경 재렌더 — 재시도 한도를 쓰지 않는다).
          응답 필드는 늘지 않으며 FE는 /preview를 다시 조회한다. 거절(409)·같은 요청 재전송은 시도를 만들지 않는다.
          **선행 단계가 끝나지 않은 섹션 — 구현 완료·서버 배포 대기**: 인페인팅·스타일·번역 단계가 끝나지 않은 섹션(예: N5 번역 재시도 중)은 복원 시점에 시도를 만들지 않는다.
          그 단계가 끝나면 진행 규칙이 현재 미리보기 시도(완료·최종 실패)와 현재 입력의 지문이 다를 때 새 시도 하나를 등록한다(입력 변경 재렌더, 재시도 한도 미사용).
          같은 입력의 최종 실패는 그대로 둔다. 실행이 진행 중일 때만이며 취소·종료된 실행은 재개하지 않는다.
          **미확보 경로 — 서버 미완료(응답 표현은 FE 11-05 수용)**: 진행 중인 하류 실행이 없는 N5 섹션(실행 기록 이전 작업 등)은 확보하지 않는다 —
          시도 없음(`render.attempt = null`)이고 화면은 원본 + 미리보기 없음이다(reviewPreview 「구현 상태」).
        - **계약 확정·서버 구현 대기(별도 항목)**: N5 복원 때 검사 시도 확보 — 규칙 검사 연결 구현에서 같은 기준으로 붙인다.
        - **N5 섹션 Undo/Redo**(FE 합의 11-03 — 서버 revision 사용) · 화면: N5에서 직접 제외한 것의 Undo = 복원 요청, 그 복원의 Undo = 제외 요청(`user_manual`·`excludedStage=N5`).
