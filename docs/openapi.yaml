          type: integer
          format: int64
        sellerId:
          type: integer
          format: int64
        nameKo:
          type: string
        nameEn:
          type: [string, 'null']
        logoUrl:
          type: [string, 'null']
          format: uri
        brandOverview:
          type: [string, 'null']
          description: 번역 톤 프롬프트 (F-BRD-03)
        coreAudience:
          type: [string, 'null']
          description: 핵심 고객층 (F-BRD-05)
        metadata:
          type: [object, 'null']
