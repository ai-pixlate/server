  /jobs/{jobId}/preview:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [N5 Review]
      summary: 검수 뷰어 프리뷰 — 다폭 대응 🟢9월
      operationId: reviewPreview
      x-screen: 'N5'
      x-source: API-CFM-03
      description: >
        **2차 상태**(PRD v3.5.10 기준)

        - 구현 완료·서버 배포 대기: 공통 렌더 입력·지문 B·현재 시도/표시 결과·키 제공 규칙(required 키 항상·상태별 null)(#108)

        - 서버 미완료(`docs/README.md` 7.2 ①·②): 진행 중인 하류 실행이 없는 N5 섹션의 미리보기 확보 · 적용 박스를 읽을 수 없는 섹션의 렌더 실패 기록

        - 미착수(`docs/README.md` 7.2 ③): 서버 HTML/Playwright 공통 렌더 연결 — 현행 Pillow


        displayTop·scale·previewHeight 서버 계산(미저장). scale=previewWidth/maxOriginalWidth · align=left.
        섹션별 presigned. N3 제외 제외 · N5 제외는 bucket=exclude 포함. 🟢9월.


        **[PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 렌더 입력과 시도·결과**
        - **한 조회 시점**: 한 응답의 `renderer`·`renderInput`·`inputFingerprint`·`render`·`renderedUrl`은 서버의 같은 시점 상태로 만든다(조회 도중 저장·렌더 채택이 끝나도 섞이지 않고 다음 조회에 반영). 조회는 아무것도 쓰지 않는다.
        - **지문 세 가지**: A = /blocks `sectionInputFingerprint`, B = 이 응답의 `sections[].inputFingerprint`, C = 같은 섹션의 `render.result.inputFingerprint`.
          표와 뷰어 입력이 일치한다고 보는 것은 A = B일 때뿐이다. 이미지 최신성은 같은 응답의 B·C로 서버가 계산한 `render.isCurrent`로 본다(A·C를 직접 비교하지 않는다).
          null 지문은 비교하지 않는다(같지도 다르지도 않음 — 비교 불가). 최신이 아닌 결과의 `overflow`는 서버가 null로 내고 FE도 쓰지 않는다.
        - **입력 상태**(포함 섹션 — 세 필드의 조합으로만 판단하며 별도 상태 필드는 없다):
          정상 입력 = `renderInput`·`inputFingerprint` 모두 값, `inputError = null` /
          입력 오류 = `renderInput`·`inputFingerprint` 모두 null, `inputError` 값 /
          입력 준비 중 = `renderInput`·`inputFingerprint`·`inputError` 모두 null — 인페인팅·스타일·번역 단계가 끝나지 않아 입력을 아직 만들 수 없음(N4, N5 번역 재시도 중). 스타일 오류로 내지 않는다.
          이 셋 밖의 조합(일부 필드만 있음)은 정상 응답이 아니다 — 서버는 내지 않으며 FE는 정상 응답으로 쓰지 않는다.
          N5 제외 섹션은 `renderInput`·`inputFingerprint`·`inputError`·`render` 모두 null이고 렌더 상태를 판정하지 않는다(제외 표시는 기존 N5 제외 화면 규칙).
        - **입력 상태와 렌더 시도 상태는 따로 판단한다**: 포함 섹션의 `render`는 입력 상태와 상관없이 항상 있고, 그 시점의 현재 시도(`attempt`)와 표시 결과(`result`)다.
          입력 준비 중이어도 `attempt.status = failed`면 렌더 실패를 표시한다(예: 이전 미리보기가 실패한 섹션의 번역 재시도 중).
          `inputError`는 저장 상태로 입력을 만들 수 없다는 뜻이며 렌더 실행 실패(`attempt.status = failed`)와 구분한다 — 입력 오류 안내를 내고, 같은 입력으로는 풀리지 않는다.
          이전 성공 결과는 표시할 수 있지만 `isCurrent = false`면 최신 결과로 인정하지 않고 넘침도 쓰지 않는다.
        - **렌더 판정**(포함 섹션, 같은 응답 안에서 위에서부터 처음 맞는 것):
          a `isCurrent = true` → 최신. 결과 이미지를 표시하고 `result.overflow`로 넘침을 표시한다.
          b `attempt.status`가 pending·running → 진행 중. 넘침 미측정. `attempt.taskId`를 /tasks로 추적하고 끝나면 재조회한다.
          c `attempt.status = failed` → 렌더 실패. 넘침 미측정. 자동 재조회 없음. `retryable`이면 [다시 시도].
          d `attempt.status = done`인데 `result`가 null이거나 `attempt.taskId ≠ result.taskId` → 채택 직후·채택 거절. 한 번 재조회하고, 그대로면 e로 처리한다.
          (여기까지 걸리지 않았으면 `attempt`는 null이거나 result와 같은 task(done)이고 `isCurrent = false`다.)
          g `result`가 있고 `result.rendererId ≠ renderer.rendererId` → 렌더러 갱신 뒤 새 시도 등록 대기. 이전 이미지(최신 아님), 넘침 미측정. 재조회는 「g의 재조회」.
          e 나머지 — ① result가 있고 렌더러도 같은데 입력이 바뀌었고 새 시도가 없음 → 한 번 재조회하고, 그대로면 이전 이미지(최신 아님)·넘침 미측정으로 두고 보고한다.
            ② result가 없음 → 「표시 결과가 없을 때」. 정상 입력인데 `attempt`도 null이면 한 번 재조회한 뒤 그 표시로 이어간다. 재시도할 task가 없으므로 [다시 시도]는 없다.
        - **표시 결과가 없을 때**(`render.result = null` → `renderedUrl = null`. 이유를 담는 필드는 따로 두지 않는다):
          `attempt`가 pending·running → 렌더 대기 / `attempt.status = failed` → 원본 + 미리보기 생성 실패 / `attempt`가 null 또는 done → 원본 + 미리보기 없음.
          `inputError`가 있으면 입력 오류 안내를 함께 낸다. 재조회 규칙(d·e의 한 번, g의 제한된 재조회)이 적용되는 경우에는 재조회를 마친 응답으로 다시 판정하고, 그때도 결과가 없으면 이 표시로 이어간다.
          섹션에 이미지 키가 있어도 채택 기록에 연결하지 못하면(실행 기록 이전 작업·이전 실행·N6 최종 렌더 뒤·알 수 없는 키) `result`·`renderedUrl` 모두 null이다 —
          근거 없는 이미지를 최신 결과로 인정하지 않는다. 그 구분은 응답에 싣지 않고 서버 로그로만 한다.
          이 표시는 화면 표시 조건일 뿐 **N4 렌더 실패 판별이 아니다** — `result = null`·`attempt.status = failed`인 섹션에는 N4 렌더 실패 섹션도 있지만
          성공 이력이 없는 N5 재렌더 실패(채택 기록에 연결하지 못한 이미지만 있던 섹션의 재렌더 실패 등)도 같은 모양이다. 응답의 이 조합만으로 N4 렌더 실패로 단정하지 않는다
          (N4 실패 판별 기준과 N6 출력은 P14·P15 미결 — confirmReview 「섹션 실행 실패의 출력」).
        - **g의 재조회**: 과거 task(`result.taskId`)는 폴링하지 않는다. 새 시도 등록은 /preview를 다시 조회해야 알 수 있으므로 다음 계기로 재조회한다 —
          ① g를 처음 본 뒤 제한된 자동 재조회(5초 간격 최대 12회, 약 1분), ② 기존 재조회 계기(추적 task 완료·구성 변경·화면 재진입), ③ 사용자 새로고침.
          자동 재조회 횟수는 화면의 자동 조회 종료 기준이며 서버의 등록 완료 시간 보장이 아니다. 재조회에서 attempt가 새 task로 바뀌면 b가 되고 이후 a·c로 이어진다.
          한도에 도달해도 새 시도가 확인되지 않으면 자동 재조회를 멈추고 "새 렌더 등록을 아직 확인하지 못함"으로 처리한다(이전 이미지 최신 아님·넘침 미측정) —
          서버가 확인한 등록 실패나 서버 결함으로 확정하지 않으며, ②·③으로 다시 확인할 수 있다.
          렌더러 전환 때 새 시도를 등록하는 방식과 완료 시간은 BE 배포 설계에서 정한다(현행 서버는 전환 때 일괄 등록하지 않는다).
