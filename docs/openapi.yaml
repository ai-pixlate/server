  /jobs/{jobId}/confirm:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [N5 Review]
      summary: 검수 확정 = N5→N6 🟢9월
      operationId: confirmReview
      x-screen: 'N5'
      x-source: API-CFM-04
      description: >
        전 섹션 제외 차단. acknowledgedWarnings 정합 아니면 409 INVALID_STATE(+현재 경고 목록).
        job→review/N6. confirm 트랜잭션에서 렌더 task(job_async_task)를 서버가 자동 등록 —
        FE는 N6에서 JOB-05 폴링만(A4·Q9 채택). 수동 재렌더는 FIN-01 POST /render 유지. 🟢9월.

        **[PRD v3.5.10 · 계약 확정 · 구현 대기] 번역문 검사 중 확정 거절** — 확정 대상 번역문에 필요한 규칙 검사가
        진행 중이면 서버가 확정을 거절한다(F-CFM-09 J110⑥). 화면은 같은 동안 [저장하러 가기]를 비활성으로 둔다(2차).
        거절 응답·검사 상태·등록 시점·"끝남"의 판정 기준은 아래 「검사 연결 경계」 BE 계약안이다(합의 전 — AI·FE 확인).
        미리보기 재렌더 진행 중 확정은 허용한다(현행 — 진행 중 재렌더는 취소, N6가 다시 그린다). Q-07 확정 제한 ①(경계 판정 진행 중 거절)이 적용되면 이 규칙이 바뀐다 — 적용 시점은 PM 확인(아래 「이미지 경계 이탈」).
        저장되지 않은 번역문이 남아 있을 때 그 개수를 안내하는 확인창(PM 확정)은 화면 동작이며 위 검사 중 거절·비활성을 해제하지 않는다.

        **[PRD v3.5.10 · 구현 대기] 검사 연결 경계** — 검사 연결(실행계획 BE 6번 · 2차 J 묶음) 전에 맞출 경계 계약이다.
        제품 정책(PM 확정): 검사 중 확정 불가·화면 비활성, 최종 실패는 「⚠ 검사하지 못했습니다」 안내 후 확인받고 진행, 확인 기록은 감사 로그.
        **글자가 바뀌지 않은 박스·배율 변경과 섹션 제외·복원은 규제·강제 용어 검사를 다시 실행하지 않는다**(PM 확정 11-04).
        기술 방향(AI 승인): 요청 검증과 결과 유효성 검증 분리, 기존 lease·현재 시도 검증 유지, 취소·확정 뒤 오래된 결과는 채택·등록에 쓰지 않음.
        공개 상태 5값·상태별 버튼 처리·409 구분(`check_not_settled`·`registeredBlockIds`)은 FE 확정이다. 지문의 내부 필드·호환 구조는 BE·AI가 구현 때 정한다.

        - 활성 검사(2차, 확정 — AI 회신): 규칙 검사(`run_text_check`)만. 번역문 LLM 규제 판정은 3차(AI 회신·실행계획 F-TRN-03)라 2차에는 등록하지 않는다.

        - 요청·결과 형식: AI 함수의 기존 형식을 그대로 쓴다(대상 블록 키·번역문·그 실행의 고정 규제 묶음·용어집 선별 — be-handoff 8.1). 결과는 블록별 flag이며,
          채택하면 자기 producer의 `compliance_flags` 항목만 바꾸고 화면에는 `signals`로 낸다(기존 SignalCode).

        - 등록 단위: 섹션(검사 가능한 블록 전체 — 포함 섹션·제외되지 않은 블록·비공백 원문·비공백 번역문).

        - **등록 보장(원래 흐름)** — 아래 흐름이 같은 트랜잭션에서 등록하므로 정상 흐름에서 `missing`·`outdated`는 생기지 않는다:
          ① N4 번역 채택 ② 번역 재시도 채택 ③ N5 번역문이 실제로 바뀐 저장(이전 시도 대체)
          ④ N5 섹션 복원 — **재실행이 아니라 유효한 결과의 확보**다. 현재 검사 유효성 지문의 시도가 있으면(완료·최종 실패·대기·실행 중 모두) 그대로 쓰고,
            없을 때만(제외해 둔 사이 검사를 켰거나 규칙 버전이 바뀐 경우 등 — 유효한 결과가 없는 경우) 새 시도를 등록한다(sectionPatch 설명).
          ⑤ 배포 — 검사를 켜는 배포와 검사 규칙 구현 버전을 바꾸는 배포에서 대상 N5 작업에 일괄 등록(#83, 배포 절차 단계).
          등록하지 않는 경우: 글자가 바뀌지 않은 박스·배율 저장, 같은 값 저장, 섹션 제외, 유효한 결과가 있는 섹션의 복원.

        - **제외·복원과 검사 대상 집합**(BE 정리 — PM 원칙과 확보 규칙을 맞춘 것): 섹션을 제외하면 그 섹션 블록은 확정 때의 검사 대상 집합(`check_not_settled` 판정·필수 확인 집합)에서 빠진다 — 결과·flag는 지우지 않는다.
          복원하면 다시 들어오고, 기존 결과는 유효성 지문이 같으면 그대로 쓴다(섹션 포함 여부는 유효성 지문에 들어가지 않는다 — 복원만으로 `outdated`가 되지 않는다).
          제외해 둔 사이 유효한 결과가 없어졌으면 ④로 확보한다 — "다시 실행하지 않는다"는 원칙과 부딪치지 않는다(재실행이 아니라 없는 결과를 만드는 것).

        - **보조 복구 경로**: 그래도 `missing`·`outdated`가 남았으면(등록 실패·누락) 확정 요청이 그 블록의 검사를 등록하고 확정은 거절한다. 원래 흐름을 대신하지 않는다.

        - **두 지문을 구분한다**(AI A4 승인 — 기술 입출력 계약 v0.1 §2. 외부 필드·호환 구조는 BE·AI 확정 전):
          요청 검증 지문 = 기존 `StageReport.input_manifest_sha256`·`expected_input_manifest_sha256`(요청 전체, revision 포함). 고정된 요청·시도의 정합성 검증 역할을 그대로 둔다
          (`validate_report`·lease 소유·현재 시도·실행 세대·취소/확정 가드와 함께). 요청 안의 revision은 **현재 블록 revision과 비교하지 않는다** — flag의 revision은 출처·감사 메타로 보존한다.
          검사 유효성 지문(검사별 의미 입력 — 실제로 소비하는 입력만):
          규칙 검사 = 섹션·대상 블록 키, 원문·번역문 내용, 적용 국가·규제 분류, 고정 사전 묶음에서 실제 소비한 행, 강제 용어 공급·선별과 영어 매칭 규칙·구현 버전.
          현행 규칙 검사 요청에는 국가(`target_country`)만 있고 언어 필드가 없다 — 언어를 넣으려면 요청 형식과 함께 바꾼다(지금 입력으로 단정하지 않는다).
          LLM 검사(3차) = 국가·대상 언어·분류·규제 항목·참고 항목 스냅샷, 섹션 전체 블록 순서·역할·원문·대상/비대상·라벨/로고, 모델·프롬프트 SHA·분할 한도·검사 버전.
          **블록 revision·박스·배율·스타일·렌더러는 넣지 않는다.** 활성 검사 구성(`active_checks`)도 검사별 지문에 넣지 않는다 — 다른 검사를 켰다는 이유로 바뀌지 않은 규칙 검사를 다시 돌리지 않는다.
          작업의 검사 종료 판정은 활성 구성과 검사별 유효 결과를 함께 본다. 현재 입력과의 최신성은 이 지문만으로 본다 — 배치만 바뀌어 revision이 올라도 같다.
          검사 유효성 지문에서 revision을 빼는 것과 요청 검증에서 revision을 빼는 것은 다른 변경이다 — 이 계약은 앞의 것만 한다.

        - 결과 채택 조건: 현재 시도 · lease 세대 · `validate_report`(요청 검증) 통과 + 시도에 고정한 유효성 지문 = 지금 입력으로 다시 계산한 유효성 지문. 하나라도 아니면 보고 전체를 거절한다(블록별 부분 채택 없음).
          확정이 하류 실행을 닫은 뒤 도착한 결과도 거절한다.

        - "오래된 결과" = 결과의 유효성 지문이 지금 유효성 지문과 다른 결과다. 블록 revision 불일치로 정의하지 않는다.

        - 블록 `check.inputKey` — **기준 확정(AI 11-04)**: 규칙 검사 = 블록 ID, 원문·번역문, 그 블록에 적용되는 고정 사전·용어집 선별 결과, 규칙 버전 등 의미 입력.
          LLM 검사(3차) = 여기에 섹션 전체 문맥과 모델·프롬프트·구현 버전·분할 한도를 더한다. 배치·배율·저장 revision은 두 검사 모두 넣지 않는다.
          블록별 키는 **확인 최신성 대조용**이며 섹션 단위 검사 결과의 블록별 부분 채택을 허용하는 것이 아니다(채택은 계속 섹션 보고 전체 단위).
          같은 섹션의 다른 블록 번역문이 바뀌어 섹션을 다시 검사해도, 규칙 검사에서 바뀌지 않은 블록의 키는 같으므로 그 블록에서 한 확인은 유효하다(LLM 검사는 섹션 문맥이 키에 들어가 바뀐다).

        - 버전 변경(AI A7 승인): 검사 의미·구현 버전이 바뀌면 **영향받는 검사만** 유효성 지문이 바뀌어 기존 결과·최종 실패를 재사용하지 않고, 배포가 새 시도를 등록한다(시점·백필은 BE 운영 절차).
          예전 지문이 비교 불가능하면 유효 검사로 승계하지 않는다(`outdated`). 과거 실행의 고정 묶음을 최신 사전으로 재해석하지 않는다. 지문이 같은 입력의 최종 실패는 다시 실행하지 않는다.
          검사를 새로 켜면 그 검사만 `missing`이 되어 등록된다 — 이미 끝난 다른 검사 결과는 그대로다.

        - 배치만 바뀐 경우: 지문이 같으므로 진행 중 검사는 그대로 채택되고, 끝난 결과도 유효하다(`settled` 유지).

        - 번역문이 바뀐 경우: 새 시도가 이전 시도를 대체한다. 이전 시도의 늦은 보고는 현재 시도가 아니라서 거절되고, 이전 결과는 `outdated`, 새 결과를 채택하면 `settled`.

        - 공개 상태와 FE 처리 — **계약 확정(FE 동의, 11-03)**(블록 `check.state` — 검사 대상이 아니면 null). 확정 버튼은 포함 섹션 검사 대상 블록의 상태로 정한다:
          settled = 결과(`signals`) 표시. 모든 블록이 settled·failed면 버튼 활성 /
          in_progress = 「검사 중」 표시, 버튼 **비활성**(PRD J110⑥). /tasks(taskType=verify, unitType=section)를 기존 2초 폴링으로 추적하고 끝나면 /blocks 재조회 /
          failed = 「⚠ 검사하지 못했습니다」, 버튼 활성 — 확정 때 `check_failed`를 확인 대상으로 보낸다 /
          missing·outdated = 「검사 준비 중」 표시, 버튼 **활성으로 둔다**(정상 흐름에서는 생기지 않는 상태). 화면 진입·재조회 때 그대로면 확정 요청이 보조 복구 경로가 되어
          서버가 검사를 등록하고 409 `check_not_settled`로 답한다 → 그 블록이 in_progress가 되고 버튼이 비활성으로 바뀐다. 버튼을 막아 복구 요청이 나가지 않는 일이 없게 한다.

        - **이미지 경계 이탈(Q-07) — PM·AI 기준으로 통일(11-04)**. FE의 "섹션별 이미지 경계" 선호는 최종 합의가 아니다. 포함 섹션만 대상이고 제외 섹션은 대상이 아니다.
          **좌표계**: 제외를 반영한 **최종 결합 이미지**. 최종 블록 y = 섹션 로컬 y + 제외 반영 출력 위치(output offset — 앞선 포함 섹션 높이의 합).
          `/preview`의 `displayTop`은 N5 제외 섹션 높이를 포함하므로 출력 위치로 재사용하지 않는다.
          **재사용·재판정**: 섹션 자체 입력(섹션 렌더 입력 지문)이 같으면 유효한 섹션 이미지를 다시 쓴다 — 출력 위치는 섹션 렌더 입력 지문에 넣지 않는다.
          제외·복원 뒤에는 최종 합성과 경계 재판정이 필요하다(판정 대상 = 포함 섹션 순서·각 섹션의 **현재 렌더 입력 지문**·출력 위치·규칙 버전 — 결과 지문이 아니다). 뒤 섹션의 글자를 무조건 다시 렌더하지 않는다.
          섹션 렌더가 실제로 대기·실행 중이면 판정 진행 중(①)이고, 렌더·입력 구성·판정이 실패했거나 필요한 시도가 없으면 판정 없음·실패(③ — 마지막 완료 판정)다.
          지문이 다른 것만으로는 진행 중이 아니다 — 이전 판정을 최신(`current`)으로 인정하지 않을 뿐이다.
          **미결(AI)**: 중간 섹션 이미지 안에서 글자가 섹션 경계에 잘리면 최종 합성만으로는 복구되지 않는다 — 섹션 렌더 단계의 검출·방지 책임과 판정 방식을 AI와 정한다.
          **확정 제한(PM 확정 11-04)**:
            ① 현재 입력의 경계 판정 진행 중 → 버튼 비활성, 서버도 확정 거절(409 `boundary_check_in_progress` — 사유 이름은 후보)
            ② 현재 입력에서 이탈 확인 → 차단(409 `image_boundary_exceeded`, `details.basis: current`). 확인 목록으로 풀 수 없다
            ③ 현재 입력의 판정 없음·실패 → **마지막 완료 판정**을 쓴다. 그 판정이 이탈이면 차단(`image_boundary_exceeded`, `details.basis: last_completed`), 아니면 통과
            ④ 이전 이탈은 최신 서버 판정에서 해소됐을 때만 차단을 푼다 — ③과 같은 규칙으로 구현한다(마지막 완료 판정이 이탈인 동안 차단 — BE 해석)
            ⑤ 마지막 완료 판정조차 없음 → **미결(PM)**(사유 후보 `boundary_check_missing`)
          ①은 지금 규칙("미리보기 재렌더 진행 중 확정 허용")을 바꾼다 — 경계 판정은 섹션 렌더 결과에 달려 있어 렌더가 진행 중이면 판정도 진행 중이다(BE 해석). 적용 시점과 함께 확인한다.
          **응답**: 섹션 렌더 결과(`render.result`)는 섹션 단위이고 `isCurrent`가 아니면 비워지므로, 최종 결합 좌표의 판정과 과거 이탈에 따른 차단을 함께 나타낼 수 없다.
          과거 판정을 최신 결과처럼 보이면 안 되므로 BE 계약안은 작업 단위 `ReviewPreview.boundaryCheck`로 판정 상태(`state`)·판정 기준(`basis`)·확정 차단(`confirmBlock`)을 나눠 낸다.
          FE가 수용한 것은 이전 섹션 결과 구조(`boundaryExceeded`)라 이 구조는 **FE·AI 확인 필요**다(판정 대상 키·판정 입력 키·규칙 버전 구성 포함).
          **적용 차수**: 최종 결합 좌표계 판정·새 상태·`boundaryCheck` 응답 등 상세 기능은 **12월(PM — 실행계획대로)**. 위 확정 제한 ①~④를 2차(11/6)에 먼저 적용하는지는 불명확해 PM 확인 대상이다
          (상세 판정 없이 2차에 적용할 수 있는 범위인지 포함). N6 최종 렌더 이탈 → 렌더 실패 오류 → [중단] → N5 복귀는 **3차 유지**(현행 중단 API는 N2·N4만).

        - 확정 조건: 포함 섹션의 검사 대상 블록이 모두 `settled`이거나, `failed`이면서 확인받은 경우. 그 밖의 블록이 있으면 409 INVALID_STATE
          `details.reason: check_not_settled`, `details.blocks: [{blockId, state}]`, 이 요청이 검사를 등록한 블록 `details.registeredBlockIds`(FE 확정 — 등록으로 생긴 409를 다른 충돌과 구분). `missing`·`outdated`는 같은 요청에서 서버가 검사를 등록한다 —
          등록은 커밋하고 확정만 거절하므로, FE는 그 블록이 `in_progress`가 된 것을 보고 끝나기를 기다린다.
          `failed`를 확인하지 않았으면 기존 409 INVALID_STATE(`details.warnings`)로 거절한다 — 확인 요청 형식은 ConfirmRequest 설명(신호 `check_failed`, 후보).
          **차수**: PM이 2차로 명시한 동작 — 검사 중 [저장하러 가기] 비활성·서버 확정 거절(PM C4·C9), 미저장 번역문 확인창(PM D1) — 은 **2차 확정**이다.
          규칙 검사 결과의 **표시**(금지·조건부 칩 포함 — `regulationVerdict`)는 확인 절차와 별개로, 규칙 검사 연결(J 묶음 · F-TRN-03a · 2차)의 결과 표시 범위로 둔다(BE 해석 — 실행계획 J 배정 근거).
          확인 절차 중 **차수가 명시되지 않은 부분만** 확인 대상이다: 검사 최종 실패·미해결 규제 경고의 확정 시 필수 확인(`check_failed`·`prohibited_expression`)과
          실행 실패 섹션 확인(`acknowledgedSections`) — 실행계획상 F-CFM-09는 3차(L·가 묶음). 현행 `translation_failed` 확인은 그대로 유지된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
            examples:
              acknowledgeAfterChecks:
                summary: '(가상 값 · BE 계약안) 검사 연결 뒤 — 최종 실패·미해결 규제 경고·번역 실패를 확인하고 진행'
                description: >
                  블록 301은 검사 최종 실패(check_failed), 302는 미해결 규제 경고(prohibited_expression), 303은 번역 실패(translation_failed).
                  검사에서 나온 두 항목에는 화면이 보여 준 결과의 `check.inputKey`를(확정), 번역 실패에는 실패 번역 시도의 `taskId`를(BE 제안 — FE 확인) 함께 보낸다. 기준이 현재와 다르면 409.
                  mandatory_term_unapplied·width_overflow는 보내도 무시된다(PRD F-CFM-09 — 확인 대상 아님, 신호는 그대로 보인다). 서버 현재 입력의 미해결 집합과 같아야 진행된다.
                value:
                  acknowledgedWarnings:
                    - { blockId: 301, code: check_failed, inputKey: 'acb339a1e3e7778195234415eee880f44a6dd39afdb04449de716024e62d896f' }
                    - { blockId: 302, code: prohibited_expression, inputKey: 'c3e85b395960bf0d665223f9cf44efe893b460ab06a782ba07808565ed62d559' }
                    - { blockId: 303, code: translation_failed, taskId: 9120 }
              acknowledgeWithSections:
                summary: '(가상 값 · BE 계약안) 블록 경고와 실행 실패 섹션을 한 확인창에서 확인'
                description: '섹션 14는 N4 미리보기 렌더가 최종 실패(task 9201)해 성공 결과가 없다. PM 확정: N6는 이 섹션에 원본을 쓰고 새 렌더 실패로 세지 않는다.'
                value:
                  acknowledgedWarnings:
                    - { blockId: 303, code: translation_failed, taskId: 9120 }
                  acknowledgedSections:
                    - { sectionId: 14, reason: render_failed, taskId: 9201 }
      responses:
        '200':
          description: 'N6 진입'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '상태 충돌 — 전 섹션 제외(ALL_SECTIONS_EXCLUDED) · 경고 확인 불일치(INVALID_STATE details.warnings) · 검사 미종료(INVALID_STATE details.reason, BE 계약안)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                checkNotSettled:
                  summary: '(가상 값 · BE 계약안) 검사가 끝나지 않은 블록이 있어 확정 거절'
                  description: >
                    블록 301은 검사 진행 중, 302는 이전 입력 결과만 있었다. 서버는 302의 검사를 이 요청에서 등록(커밋)했으므로 이후 조회에서 302는 in_progress다.
                    FE는 [저장하러 가기]를 비활성으로 두고 검사가 끝난 뒤 다시 확정한다.
                  value:
                    error: { code: INVALID_STATE, message: 'translation checks are not settled', retryable: false,
                             details: { reason: check_not_settled, blocks: [ { blockId: 301, state: in_progress }, { blockId: 302, state: outdated } ], registeredBlockIds: [302] },
                             traceId: 'example-trace-0021' }

