  /jobs/{jobId}/blocks/{blockId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/BlockId'
    patch:
      tags: [N5 Review]
      summary: 번역문 셀 수정 🟢9월
      operationId: blockPatch
      x-screen: 'N5'
      x-source: API-CFM-02
      description: >
        revision 낙관적 잠금(불일치 409 REVISION_CONFLICT · details.current). char_count 즉시,
        overflow·autoAdjust는 재렌더 후. 응답 `rerenderTaskId`가 숫자면 /tasks 폴링, null이면 새 task 없음(BlockPatchResponse 설명). 🟢9월.

        **[PRD v3.5.10 · 계약 확정] 실행 취소·재실행(F-CFM-03)** — 전용 API가 없다. 화면이 이력을 갖고, 되돌릴 때는
        과거 값을 **현재 revision으로 이 API에 다시 저장**한다(새 수정 — 과거 revision으로 되돌리지 않는다).
        일반 수정과 같은 상태 검사·revision 충돌·재렌더를 거치며, 실제 값이 바뀌는 저장이 성공하면 revision이 증가한다.

        **[PRD v3.5.10 · 계약 확정 · 구현 대기] 같은 값 저장(FE 합의)** — 현재 값과 같은 값을 저장하면 revision을 유지하고
        새 재렌더를 만들지 않는다(`rerenderTaskId: null`). 현재 서버(f85b23e)는 같은 값이어도 revision을 올리고 재렌더를 등록한다(구현 차이).

        **재전송 응답의 화면 처리(FE 합의 — 멱등 재전송을 채택할 경우)** — 최초 성공 응답을 다시 돌려받으면 그 요청이 성공했다는
        확인으로만 쓴다. 응답의 과거 `block`으로 현재 화면 캐시를 덮지 않고, 서버 상태를 재조회해 최신 값·revision으로 화면과 이력을 맞춘다.
        과거 응답의 task ID도 현재 미리보기의 최신성을 보장하지 않는다. 응답 스키마는 바꾸지 않는다.
        아래 확정 예시(`changed`·`sameValue`·`sameValueWhileRendering`)는 번역문만 쓴다. 배치 필드·멱등 키가 들어간 예시는 BE 계약안이다.


        **[PRD v3.5.10 · 구현 대기] 저장 공통 — 처리 순서·멱등**(블록·섹션 PATCH 공통, sectionPatch도 이 규칙을 따른다)
        — **계약 확정(FE 동의, 11-03)**: 아래 처리 순서 1~9·오류 분류(422·400·409)·키 생성(조작마다 UUID v4, 통신 재시도는 같은 키·같은 본문)·결과 불명 동안 후속 조작 보류.
        **계약 확정(FE 수용, 11-04)**: 보관 24시간·기록 만료 뒤 새 요청 처리·잠금 대기 초과 503·재전송 표시 헤더 `Idempotent-Replayed: true`. 결과 불명이면 FE는 같은 키·같은 본문으로 재시도하고 그 대상의 후속 저장·Undo/Redo를 보류한다.
        BE 계약안(서버 내부): 키 범위·같은 요청 판별·작업 취소 때 기록 삭제. **구현 대기**: 브라우저가 교차 출처 응답에서 `Idempotent-Replayed`를 읽도록 CORS `Access-Control-Expose-Headers`에 넣는다.

        1. 인증(401) · 요청 형식(422 VALIDATION_ERROR — 아래 분류표) · `Idempotency-Key` 형식(422).

        2. 작업 소유 확인 — 남의 작업·없는 작업은 404. 저장된 응답을 재전송하기 전에도 매번 확인한다.

        3. 작업 행 잠금 — 같은 작업의 저장은 직렬화된다.

        4. 작업 상태 확인 — 취소된 작업·N5 검수 중이 아닌 작업(섹션 PATCH는 N3·N5)·전환 이전 작업(PM-R0 결정 뒤) 등은 409 INVALID_STATE.
           **멱등 기록이 있어도 재전송하지 않는다** — 권한·작업 제한을 재전송으로 건너뛰지 않는다. 이때 FE는 결과 불명 처리대로 재조회해 서버 상태에 맞춘다.
        5. 멱등 기록 조회(키가 있을 때) — 같은 요청이면 최초 응답을 그대로 돌려준다(다시 적용하지 않고 revision도 다시 비교하지 않는다, 헤더 `Idempotent-Replayed: true`).
           같은 키로 다른 요청이면 409 DUPLICATE `details.reason: idempotency_key_reused`, 아무것도 적용하지 않는다.
        6. 대상 확인(없으면 404) → revision 검사 — 다르면 409 REVISION_CONFLICT(`details.current`). 같은 값 저장이어도 revision이 다르면 409다(FE 선호안 — revision 먼저).

        7. 업무 검증(저장된 상태와 비교해야 아는 것) — 실패하면 400 VALIDATION_ERROR(`details.fields`) 또는 409 INVALID_STATE(`details.reason`). 요청 전체가 한 단위라 일부만 적용하지 않는다.

        8. 변경 없음(no-op) 판정 — 정규화한 저장값이 지금과 같으면 200, revision 유지, `rerenderTaskId: null`, 부수 기록 없음.

        9. 적용 — 변경·revision+1·부수 처리(edit_signal·재렌더 시도·검사 등록)와 멱등 기록을 **같은 DB 트랜잭션**으로 커밋한다. 변경만 남거나 기록만 남는 일이 없다.

        - **오류 분류**(블록·섹션 PATCH 공통 — 스키마 오류를 400으로 바꾸지 않는다):
          요청 형식 = 요청 본문·헤더만 보고 판단되는 것(타입·필수·허용되지 않은 키·빈 `layoutAdjust`·`box` 좌표 일부·`fontScale` ≤ 0·`trans1` null·
          `trans1`·`layoutAdjust` 모두 없음·키 형식·키가 있는 섹션 요청의 `revision` 누락) → **422 VALIDATION_ERROR** `details.fields: [{loc, msg}]`(현행 FastAPI 처리 그대로) /
          업무 검증 = 저장된 상태와 비교해야 아는 것(섹션 크기를 넘는 박스) → **400 VALIDATION_ERROR** `details.fields` /
          상태 거절 = 대상·작업 상태 때문에 못 하는 것(그리지 않는 블록·N5 아님·N3 제외 섹션의 N5 복원·복원 근거 없음) → **409 INVALID_STATE** `details.reason`.
          (참고: Error 스키마 enum 주석은 VALIDATION_ERROR를 400으로 적었지만 현행 서버는 요청 형식 오류를 422로 낸다 — 이 분류가 현행 동작과 같다.)
        - **키 범위**: (판매자, 작업, 오퍼레이션, 키). **같은 요청** = 오퍼레이션 + 경로의 대상 ID + 정규화한 본문(생략과 null은 다르다, 숫자는 값으로 비교)의 SHA-256이 같음 —
          같은 키를 다른 블록에 쓰면 다른 요청이다. 키 없는 요청은 멱등 보장 없이 처리한다(필수화 전 — `Idempotency-Key` 파라미터 설명).
        - **기록**: 2xx 응답만(no-op 200 포함). 4xx(400·409·422)·5xx는 기록하지 않으므로 같은 키로 다시 보내면 그때 상태로 다시 판정한다.
          보관 24시간(POST /jobs와 같음). 작업을 취소하면 그 작업의 기록을 지운다(번역문이 든 응답이 재전송으로 다시 나가지 않게).
        - **동시·처리 중 재전송**: 작업 잠금으로 직렬화되므로 뒤 요청은 앞 요청이 커밋된 뒤 기록을 보고 최초 응답을 받는다(두 번 적용되지 않음).
          잠금 대기가 한도를 넘으면 503 SERVICE_UNAVAILABLE(retryable) — 같은 키로 다시 보내도 안전하다.
        - **응답 유실**: 같은 키·같은 본문으로 다시 보내 결과를 확인한다(저장됐으면 최초 응답, 아니면 지금 처리).
          FE 합의: 결과 불명 동안 그 대상의 후속 저장·Undo/Redo를 보류하고, 재전송 응답은 성공 확인에만 쓰고 재조회로 화면·이력을 맞춘다. `rerenderTaskId` 필수·nullable 유지, `noOp` 필드 없음.
        - **보관 기한 뒤 재전송**: 새 요청으로 처리된다. 최초가 실제 변경이었으면 revision이 올라 409, 최초가 no-op이었고 그 뒤 변경이 없으면 다시 no-op 200,
          최초가 처리되지 않았으면 정상 처리 또는 409 — 어느 경우도 두 번 적용되지 않는다(revision 낙관적 잠금이 두 번째 방어선). 24시간 안에 확인하지 못하면 FE는 재조회한다.
          이 보장은 **revision이 든 요청에만** 성립한다. 블록 PATCH는 revision이 항상 필수이고, 섹션 PATCH는 키를 보내면 revision도 필수다(키 없이 revision도 없는 섹션 요청은 멱등·중복 방지 보장 밖).
        - **POST /jobs와 다른 점**: POST /jobs는 같은 키면 본문이 달라도 최초 응답을 돌려주고 처리 중이면 409 DUPLICATE다(Redis 기록).
          PATCH는 본문이 다르면 거절하고(다른 편집을 성공으로 오인하지 않게) 기록을 변경과 같은 트랜잭션에 둔다.


        **[PRD v3.5.10 · 구현 대기] 블록 배치(F-CFM-15)** — 이 API를 확장한다(새 엔드포인트 없음).
        **계약 확정(FE 동의, 11-03)**: 요청 구조·생략/null 의미·[+][−] 계산식·섹션 밖 400·소수 유지(고정 자릿수 없음)·저장 뒤 서버 반환값으로 동기화.
        **조건부(BE 계약안 유지)**: 정규화(1.0·원본 bbox → null)는 FE가 수용했지만, 3차 시스템 자동 조정과 충돌하지 않는지 BE·AI 공동 확인 전까지 확정이 아니다(아래 「정규화」).

        - 요청 `layoutAdjust: { box, fontScale }` — 셀러 조정만. 좌표 = 섹션 로컬 원본 px, 소수 유지. 배율 = 기준 글자 크기 대비 절대 배율.

        - 생략·null: `layoutAdjust` 생략 = 그대로 / `layoutAdjust: null` = 셀러 조정 전부 해제 / 안쪽 `box`·`fontScale` 생략 = 그 값 유지 / 안쪽 null = 그 값만 해제 /
          빈 객체·`box` 좌표 일부만·`trans1`·`layoutAdjust` 모두 없음 = 422(요청 형식).
        - 정규화(저장·응답): `fontScale` 1.0 = 배율 없음(null), `box`가 원본 bbox와 같으면 박스 조정 없음(null), 둘 다 없으면 `layoutAdjust: null`.
          같은 상태를 한 모양으로 저장해 같은 값 판정·content.csv 빈칸(PM 확정)·Undo가 어긋나지 않게 한다. 적용값은 정규화와 별개로 배율 1.0·원본 bbox다.
          FE는 null을 적용 배율 1.0·원본 bbox로 해석하고 Undo/Redo도 정규화된 서버 상태를 쓴다(FE 회신).
          **미결(BE·AI)**: 3차에 시스템 조정이 생기면 "셀러 값 없음(null → 시스템 값 적용)"과 "셀러가 1.0·원본으로 되돌림(시스템 값보다 우선)"이 달라진다.
          BE 권장: 2차는 시스템 조정이 항상 없으므로 정규화한다. 3차에는 그 블록에 시스템 조정이 있으면 셀러가 보낸 1.0·원본 박스를 정규화하지 않고 그대로 저장해 "셀러 지정"으로 둔다.
        - 원본 `bbox`는 바뀌지 않는다. 적용 박스 = 셀러 박스, 없으면 원본 bbox / 적용 배율 = 셀러 배율, 없으면 1.0. FE는 적용값을 /preview `renderInput`에서 읽는다.

        - 화면 조작(PM 확정 F-CFM-15)과 요청: 손잡이 끌기 = `box` 크기만(배율 그대로) / 영역 옮기기 = `box` 위치만 /
          [+][−] = 지금 영역·지금 배율에서 `box`와 `fontScale`을 함께 — FE가 새 절대값 둘을 계산해 한 요청으로 보낸다.
          서버는 [+][−]를 해석하거나 박스를 다시 계산하지 않는다.
          PM 확정 화면 규칙: 증감량 0.05 · 확대 기준점 = 박스 중심 · 섹션 경계를 넘으면 크기를 유지한 채 안쪽으로 이동 · 다음 확대가 섹션보다 커지면 [+] 비활성 ·
          Undo 이력 50단계 · 옮길 때 섹션 가운데 세로선·가로선에 스냅. 계산식(FE 동의): 새 배율 s′ = s ± 0.05(절대 배율에 더하고 빼기),
          새 박스 = 중심 고정으로 w·h에 s′/s를 곱한 뒤 섹션 안으로 이동, 계산한 절대값 전송 — 계산·경계 보정·버튼 비활성은 FE 몫.
          버튼 비활성: [+]는 다음 확대가 섹션보다 커질 때(PM 확정). [−]는 s′ ≤ 0이 될 때(BE 제안, FE가 계산식 회신에서 버튼 비활성 처리에 동의 — PM 규칙에는 [−] 조건이 따로 없다).
        - 범위: 0 ≤ x, 0 ≤ y, w > 0, h > 0, x + w ≤ 섹션 폭, y + h ≤ 섹션 높이(PRD I109·J109⑧, 허용 오차 없음, 십진수 비교).
          벗어나면 **400으로 거절하고 서버가 보정하지 않는다** — 보정하면 셀러가 보낸 값과 저장값이 달라져 Undo·재전송 판별·화면이 어긋난다.
          끌기·확대를 섹션 안으로 막는 것은 FE다(PRD J109⑧). 배율 상한은 없다(J109③).
        - 대상: 렌더 대상 블록만(라벨·로고·빈 원문·빈 번역문 제외 — 같은 요청의 `trans1`이 번역문을 채우면 대상). 아니면 409 INVALID_STATE `details.reason: not_render_target`.

        - 원자성: 모든 필드를 검증한 뒤 한 번에 적용한다. 하나라도 실패하면 번역문도 저장하지 않는다.

        - 처리: 번역문만 바뀜 → revision+1·`edited`·edit_signal·재렌더 시도·검사 등록 /
          배치만 바뀜 → revision+1·`blockStatus` 그대로(PM 확정)·edit_signal 없음·재렌더 시도·**검사 등록 없음**(검사 입력이 같아 기존 결과가 유효 — confirmReview 「검사 연결 경계」) /
          둘 다 바뀜 → revision+1 한 번·`edited`·재렌더 시도 하나·검사 등록 / 정규화 뒤 둘 다 지금과 같음 → no-op.
        - 2차·3차 경계: 2차는 셀러 조정만 저장한다. 시스템 자동 조정(F-TRN-04)은 3차 — 응답 `systemAdjust`는 2차에 항상 null이고 요청으로 받지 않는다(422).
          셀러 변경은 시스템 조정값을 덮지 않는다(저장 위치가 다르다). 둘의 적용 우선순위는 3차에 정한다.
        - 저장: `text_block.layout_adjust` 안에 `user`·`system`을 나눠 둔다(스키마안 — 마이그레이션은 구현 PR). content.csv의 `layout_x·layout_y·layout_w·layout_h·font_scale`은 `user` 값(PM 확정, 없으면 빈칸).
      parameters:
        - $ref: '#/components/parameters/EditIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockPatch' }
            examples:
              translation:
                summary: '번역문만 수정(현행 요청과 같음)'
                value: { revision: 4, trans1: 'Visibly smoother skin' }
              layoutMove:
                summary: '(가상 값 · BE 계약안) 영역 옮기기 — box 위치만, 배율 그대로'
                description: '블록 302(원본 bbox 40, 200, 520×48)를 옮겼다. 크기는 원본과 같고 위치만 소수로 바뀐다.'
                value: { revision: 5, layoutAdjust: { box: { x: 40.5, y: 212.25, w: 520, h: 48 } } }
              layoutPlus:
                summary: '(가상 값 · BE 계약안) [+] 한 번 — box와 fontScale을 함께(FE가 계산)'
                description: >
                  지금 영역(40.5, 212.25, 520×48)·배율 1.0에서 [+]. 증감량 0.05·박스 중심 기준은 PM 확정, 박스에 s′/s(=1.05)를 곱하는 계산식은 FE 동의.
                  서버는 받은 절대값 그대로 저장한다.
                value: { revision: 6, layoutAdjust: { box: { x: 27.5, y: 211.05, w: 546, h: 50.4 }, fontScale: 1.05 } }
              layoutResize:
                summary: '(가상 값 · BE 계약안) 손잡이 끌기 — box 크기만, 배율 그대로'
                value: { revision: 7, layoutAdjust: { box: { x: 27.5, y: 211.05, w: 600.5, h: 50.4 } } }
              clearScale:
                summary: '(가상 값 · BE 계약안) 배율만 해제(첫 [+]의 Undo 등) — 박스 조정은 유지'
                value: { revision: 8, layoutAdjust: { fontScale: null } }
              clearAll:
                summary: '(가상 값 · BE 계약안) 셀러 조정 전부 해제'
                value: { revision: 9, layoutAdjust: null }
              translationAndLayout:
                summary: '(가상 값 · BE 계약안) 번역문과 배치를 한 요청으로 — revision 한 번 증가, 재렌더 시도 하나'
                value: { revision: 10, trans1: 'Strengthens and protects the moisture barrier', layoutAdjust: { box: { x: 40, y: 200, w: 560, h: 48 } } }
      responses:
        '200':
          description: '저장 성공. 값이 바뀐 저장이면 revision 증가·새 재렌더 task, 같은 값 저장이면 revision 유지·rerenderTaskId null'
          headers:
            Idempotent-Replayed:
              description: >
                [PRD v3.5.10 · 계약 확정(FE) · 구현 대기] 같은 Idempotency-Key·같은 요청의 재전송에 최초 응답을 돌려줄 때만 `true`. 본문은 최초 응답 그대로다.
                FE는 이 헤더가 없어도 재전송한 요청의 응답을 성공 확인에만 쓰고 재조회한다(FE 합의). 교차 출처에서도 읽히도록 CORS 노출 헤더에 넣는다(구현 대기).
              schema: { type: string, enum: ['true'] }
          content:

            application/json:
              schema: { $ref: '#/components/schemas/BlockPatchResponse' }
