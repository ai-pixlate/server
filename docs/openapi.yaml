        width: { type: integer }
        height: { type: integer }
        createdAt: { type: string, format: date-time }
    SourceImageUploadResult:
      type: object
      description: '파일별 성공/실패 개별 기록 (한 파일 실패해도 나머지 적재)'
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              fileName: { type: string }
