        **[PRD v3.5.10 · 계약 확정(FE 11-04·11-05) · 구현 완료·서버 배포 대기] 섹션 입력 지문 세 가지의 관계** — 셋은 같은 계산(섹션 렌더 입력의 SHA-256)이다.

        - A = `/blocks`의 `sectionInputFingerprint` — 이 `/blocks` 응답 시점의 현재 섹션 입력.

        - B = `/preview`의 `sections[].inputFingerprint` — 그 `/preview` 응답 시점의 현재 섹션 입력.

        - C = `/preview`의 `render.result.inputFingerprint` — 표시 중인 결과를 만든 입력. 결과마다 고정된 값이라 언제 조회해도 같다.

        - **비교는 두 가지만 한다**(셋 중 아무 둘이나 비교하지 않는다):
          ① 미리보기 최신성 = B와 C(같은 `/preview` 응답 안 — 서버가 `render.isCurrent`로 계산한다). C가 `/blocks`의 A와 같아도 B와 다르면 최신이 아니다(A = C ≠ B — `/blocks`가 더 오래된 조회일 수 있다).
          ② 표와 뷰어의 입력 일치 = A와 B. 같으면 표(`/blocks`)와 뷰어(`/preview`)가 같은 섹션 입력을 봤으므로 함께 쓴다. A ≠ B = C면 미리보기는 최신이지만 표가 다른 입력을 봤다.
          A와 C를 직접 비교해 최신 여부를 정하지 않는다.
        - **null**: 어느 하나라도 null이면(N5 제외·입력 오류·입력 준비 중) 비교하지 않는다 — 일치로도 불일치로도 보지 않는다. 결과가 없으면 C가 없다.

        - **블록이 없는 섹션**: `/blocks`에 그 섹션의 행이 없어 A가 없다 — 표와 맞출 것이 없으므로 `/preview` 안의 B·C로 미리보기 최신성만 판단한다.

        - **불일치는 선후를 알려 주지 않는다**(· 화면): 지문은 같은 입력인지만 알려 주고 어느 응답이 더 오래됐는지는 알려 주지 않는다. 그래서 응답 교체는 **요청을 보낸 순서**로 한다 —
          같은 종류의 응답은 나중에 보낸 요청의 응답만 앞의 응답을 덮는다(먼저 보낸 요청의 응답이 늦게 와도 덮지 않는다).
          A ≠ B면 두 조회를 함께 다시 보낸다(그 섹션의 `/blocks?sectionId=` 와 `/preview`). 다시 받은 A·B도 다르면 그 사이에도 입력이 바뀐 것이므로, 표는 `/blocks`, 뷰어는 `/preview`로 각자 그리고
          두 응답을 섞어 쓰지 않는다(예: 표의 편집값을 뷰어 렌더 입력에 끼워 넣지 않는다). 다음 계기(저장 응답, 추적 task 완료, 화면 재진입)에 다시 맞춘다 — 자동 반복 재조회는 하지 않는다.
          서로 다른 조회는 같은 시점을 보장하지 않는다. 같다는 것은 "같은 입력을 봤다"는 뜻일 뿐 같은 순간이라는 뜻이 아니다.

        - 블록 revision 비교(`TextBlock.revision` ↔ `renderInput.blocks[].revision`)는 두 응답에 모두 있는 블록의 편집값 대조에만 쓴다 — 섹션 입력 전체가 같다는 증명이 아니다.
