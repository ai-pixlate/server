        - 구현 완료·서버 배포 대기: 같은 값 저장 no-op·`rerenderTaskId: null`(#104) · 저장 공통 — 처리 순서·멱등 키·422/409/503·`Idempotent-Replayed`(#105)

        - 계약 확정·서버 구현 대기: 블록 배치 저장(`layoutAdjust`)과 저장 공통의 배치 항목(업무 검증 400·배치 요청 422·409 `not_render_target`)

        - 서버 미완료(`docs/README.md` 7.2 ②): 적용 박스를 읽을 수 없는 섹션의 블록 저장은 렌더 실패 기록을 남기지 못하고 500으로 끝난다

        - 현행: 실행 취소·재실행(전용 API 없음) · `trans1` 필수(현재 공개안 — 배치 요청의 생략 허용은 후속 협의)


        revision 낙관적 잠금(불일치 409 REVISION_CONFLICT · details.current). char_count 즉시,
        overflow·autoAdjust는 재렌더 후. 응답 `rerenderTaskId`가 숫자면 /tasks 폴링, null이면 새 task 없음(BlockPatchResponse 설명). 🟢9월.


        **[PRD v3.5.10 · 계약 확정 · 현행] 실행 취소·재실행(F-CFM-03)** — 전용 API가 없다. 화면이 이력을 갖고, 되돌릴 때는
        과거 값을 **현재 revision으로 이 API에 다시 저장**한다(새 수정 — 과거 revision으로 되돌리지 않는다).
        일반 수정과 같은 상태 검사·revision 충돌·재렌더를 거치며, 실제 값이 바뀌는 저장이 성공하면 revision이 증가한다.
        배치(박스·배율)의 Undo/Redo도 같은 방식이다(배치 저장은 아래 「블록 배치」 — 계약 확정·서버 구현 대기).


        **[PRD v3.5.10 · 계약 확정(FE 합의)] 같은 값 저장** — 소유·작업 상태(N5 검수 중)·revision 검사를 통과한 뒤 `trans1`이 현재 값과 같으면
        아무것도 바꾸지 않는다: revision·`blockStatus` 유지, 수정 기록 없음, 새 재렌더를 만들지 않고 진행 중인 재렌더도 취소하지 않는다.
        응답은 전체 TextBlock과 `rerenderTaskId: null`이다. revision 검사가 먼저라 같은 값이어도 revision이 다르면 409 REVISION_CONFLICT다.
        비교는 저장된 문자열 그대로다 — 번역문이 없는(null) 블록에 빈 문자열을 저장하면 같은 값이 아니다(일반 수정).
        `layoutAdjust`를 함께 보내면 번역문과 정규화한 배치가 모두 지금과 같을 때만 변경 없음이다(배치 저장은 계약 확정·서버 구현 대기).


        **[PRD v3.5.10 · 계약 확정(FE 11-03·11-04) · 구현 완료·서버 배포 대기(블록 PATCH)] 저장 공통 — 처리 순서·멱등·오류 구분**.
        확정 범위: 처리 순서 1~9·오류 분류(422·400·409)·키 생성(조작마다 UUID v4, 통신 재시도는 같은 키·같은 본문)·결과 불명 동안 후속 조작 보류,
        보관 24시간·기록 만료 뒤 새 요청 처리·잠금 대기 초과 503·재전송 표시 헤더 `Idempotent-Replayed: true`(CORS 노출 헤더에 포함).
        아래 키 범위·같은 요청 판별·작업 취소 때 기록 삭제는 이 구현의 서버 동작이다. 섹션 PATCH도 같은 규칙을 따른다(sectionPatch 설명).

        1. 인증(401) · 요청 형식(422 VALIDATION_ERROR) · `Idempotency-Key` 형식(422).

        2. 작업 소유 확인 — 남의 작업·없는 작업은 404. 저장된 응답을 재전송하기 전에도 매번 확인한다.

        3. 작업 행 잠금 — 같은 작업의 저장은 직렬화된다. 잠금 대기가 한도를 넘으면 503 SERVICE_UNAVAILABLE(retryable) — 아무것도 적용하지 않았으므로 같은 키·같은 본문으로 다시 보내도 안전하다.

        4. 작업 상태 확인 — N5 검수 중이 아니면(취소된 작업 포함) 409 INVALID_STATE `details.reason: job_not_editable`. **멱등 기록이 있어도 재전송하지 않는다**(권한·작업 제한을 재전송으로 건너뛰지 않는다).

        5. 멱등 기록 조회(키가 있을 때) — 같은 요청이면 최초 응답을 그대로 돌려준다(다시 적용하지 않고 revision도 다시 비교하지 않는다, 헤더 `Idempotent-Replayed: true`).
           같은 키로 다른 요청이면 409 DUPLICATE `details.reason: idempotency_key_reused`, 아무것도 적용하지 않는다.

        6. 대상 블록 확인(없으면 404) → revision 검사 — 다르면 409 REVISION_CONFLICT(`details.current`). 같은 값 저장이어도 revision이 다르면 409다.

        7. 업무 검증(저장된 상태와 비교해야 아는 것) — 번역문 저장에는 없다(현행). 배치 저장은 박스가 섹션 크기를 넘으면 400 VALIDATION_ERROR(`details.fields`),
           그리지 않는 블록이면 409 INVALID_STATE `details.reason: not_render_target`이다 — 계약 확정·서버 구현 대기. 요청 전체가 한 단위라 일부만 적용하지 않는다.

        8. 변경 없음 판정 — 같은 값이면(배치를 보내면 정규화한 배치까지 같을 때) 200, revision 유지, `rerenderTaskId: null`, 부수 기록 없음(위 「같은 값 저장」).

        9. 적용 — 변경·revision+1·부수 처리(edit_signal·재렌더 시도, 규칙 검사 연결 뒤에는 검사 등록 — 계약 확정·서버 구현 대기)와 멱등 기록을 **같은 DB 트랜잭션**으로 커밋한다. 변경만 남거나 기록만 남는 일이 없다.

        - **키 범위**: (판매자, 작업, 오퍼레이션, 키). **같은 요청** = 오퍼레이션 + 경로의 대상(작업·블록 ID) + 정규화한 본문(`trans1`·`revision`, 배치 저장 뒤에는 `layoutAdjust`도 — 생략과 null은 다른 요청이다)의 SHA-256이 같음 —
          같은 키를 다른 블록에 쓰거나 본문·revision이 다르면 다른 요청(409 DUPLICATE)이다. 키 없는 요청은 멱등 보장 없이 처리한다.
        - **기록**: 2xx 응답만(값 변경과 no-op 200 모두). 4xx·5xx는 기록하지 않으므로 같은 키로 다시 보내면 그때 상태로 다시 판정한다.
          보관 24시간 — 기한이 지난 기록은 없는 것으로 보고 새 요청으로 처리한다(최초가 실제 변경이었으면 revision이 올라 409, no-op이었고 그 뒤 변경이 없으면 다시 no-op 200 — 두 번 적용되지 않는다).
          작업을 취소하면 그 작업의 기록을 지운다(응답에 번역문이 들어 있음).
        - **동시 재전송**: 작업 잠금으로 직렬화되므로 뒤 요청은 앞 요청이 커밋된 뒤 기록을 보고 최초 응답을 받는다.
        - **오류 분류**: 요청 형식(본문·헤더만 보고 판단 — 타입(`revision`은 정수 값만 — 0·0.0은 같은 0, false·문자열·0.5는 422 / `trans1` 숫자는 422)·필수 필드 누락·`trans1` null·정의되지 않은 키·키 형식) → **422 VALIDATION_ERROR** `details.fields: [{loc, msg}]` /
          배치 요청 형식(계약 확정·서버 구현 대기 — 빈 `layoutAdjust`·`box` 좌표 일부만·`layoutAdjust` 안의 정의되지 않은 키·`fontScale` ≤ 0) → **422** /
          업무 검증(섹션 크기를 넘는 박스 — 계약 확정·서버 구현 대기) → **400 VALIDATION_ERROR** `details.fields` /
          상태 거절(N5 아님 → `job_not_editable`, 그리지 않는 블록의 배치 저장 → `not_render_target` — 계약 확정·서버 구현 대기) → **409 INVALID_STATE** `details.reason`(FE 확정 409 구분 — `error.code` + `details.reason`). (참고: Error 스키마 enum 주석은 VALIDATION_ERROR를 400으로 적었지만 요청 형식 오류는 422로 낸다.)
        - **POST /jobs와 다른 점**: POST /jobs는 같은 키면 본문이 달라도 최초 응답을 돌려주고 처리 중이면 409 DUPLICATE다(Redis 기록).
          PATCH는 본문이 다르면 거절하고(다른 편집을 성공으로 오인하지 않게) 기록을 변경과 같은 트랜잭션에 둔다.
        - FE 처리(합의): 결과 불명이면 같은 키·같은 본문으로 재시도하고 그 대상의 후속 저장·Undo/Redo를 보류한다. 재전송 응답은 성공 확인으로만 쓰고
          과거 `block`으로 화면 캐시를 덮지 않으며 재조회로 맞춘다.


        **[PRD v3.5.10 · 합의(FE 11-03 · 정규화 FE 수용·AI 동의 11-04) · 계약 확정·서버 구현 대기] 블록 배치(F-CFM-15)** — 이 API를 확장한다(새 엔드포인트 없음).
        확정 범위: 요청 구조·생략/null 의미·[+][−] 계산식·섹션 밖 400·소수 유지(고정 자릿수 없음)·저장 뒤 서버 반환값으로 동기화·2차 정규화.
        서버 구현 전(현행)에는 `layoutAdjust`가 정의되지 않은 키라 422다.

        - 요청 `layoutAdjust: { box, fontScale }`(`LayoutAdjustPatch`) — 셀러 조정만. 좌표 = 섹션 로컬 원본 px, 소수 유지. 배율 = 기준 글자 크기 대비 절대 배율.

        - **`trans1` 필수(현재 공개안)**: 배치만 바꾸는 요청도 현재 `trans1`을 함께 보낸다(같은 값은 no-op 규칙대로 번역문 변경 없음). 빠지면 422 VALIDATION_ERROR다.
          생략 허용은 후속 협의 항목이다(`docs/README.md` 7.3).

        - 생략·null: `layoutAdjust` 생략 = 그대로 / `layoutAdjust: null` = 셀러 조정 전부 해제 / 안쪽 `box`·`fontScale` 생략 = 그 값 유지 / 안쪽 null = 그 값만 해제 /
          빈 객체·`box` 좌표 일부만 = 422(요청 형식).
        - 정규화(저장·응답 — 2차): `fontScale` 1.0 = 배율 없음(null), `box`가 원본 bbox와 같으면 박스 조정 없음(null), 둘 다 없으면 `layoutAdjust: null`.
          `box`와 `fontScale`은 따로 판단한다(한 필드만 기본값이면 그 필드만 정규화). 같은 상태를 한 모양으로 저장해 같은 값 판정·content.csv 빈칸·Undo가 어긋나지 않게 한다.
          적용값은 정규화와 별개로 배율 1.0·원본 bbox다. FE는 null을 적용 배율 1.0·원본 bbox로 해석하고, Undo/Redo도 정규화된 서버 상태를 쓰며, 실제로 바꾼 필드만 싣는다(안쪽 생략 = 그 값 유지).
        - 원본 `bbox`는 바뀌지 않는다. 적용 박스 = 셀러 박스, 없으면 원본 bbox / 적용 배율 = 셀러 배율, 없으면 1.0. FE는 적용값을 /preview `renderInput`에서 읽는다.

        - **화면 조작(PM 확정 F-CFM-15) · 화면**: 손잡이 끌기 = `box` 크기만(배율 그대로) / 영역 옮기기 = `box` 위치만 /
          [+][−] = 지금 영역·지금 배율에서 `box`와 `fontScale`을 함께 — FE가 새 절대값 둘을 계산해 한 요청으로 보낸다. 서버는 [+][−]를 해석하거나 박스를 다시 계산하지 않는다.
          화면 규칙: 증감량 0.05 · 확대 기준점 = 박스 중심 · 섹션 경계를 넘으면 크기를 유지한 채 안쪽으로 이동 · 다음 확대가 섹션보다 커지면 [+] 비활성 ·
          Undo 이력 50단계 · 옮길 때 섹션 가운데 세로선·가로선에 스냅. 계산식(FE 동의): 새 배율 s′ = s ± 0.05(절대 배율에 더하고 빼기),
          새 박스 = 중심 고정으로 w·h에 s′/s를 곱한 뒤 섹션 안으로 이동, 계산한 절대값 전송 — 계산·경계 보정·버튼 비활성은 FE 몫. [−]는 s′ ≤ 0이 될 때 비활성(FE 동의).
        - 범위: 0 ≤ x, 0 ≤ y, w > 0, h > 0, x + w ≤ 섹션 폭, y + h ≤ 섹션 높이(PRD I109·J109⑧, 허용 오차 없음, 십진수 비교).
          벗어나면 **400으로 거절하고 서버가 보정하지 않는다** — 보정하면 셀러가 보낸 값과 저장값이 달라져 Undo·재전송 판별·화면이 어긋난다.
          끌기·확대를 섹션 안으로 막는 것은 FE다(PRD J109⑧). 배율 상한은 없다(J109③).
        - 대상: 렌더 대상 블록만(라벨·로고·빈 원문·빈 번역문 제외 — 같은 요청의 `trans1`이 번역문을 채우면 대상). 아니면 409 INVALID_STATE `details.reason: not_render_target`.

        - 원자성: 모든 필드를 검증한 뒤 한 번에 적용한다. 하나라도 실패하면 번역문도 저장하지 않는다.

        - 처리: 번역문만 바뀜 → revision+1·`edited`·edit_signal·재렌더 시도(규칙 검사 연결 뒤에는 검사 등록) /
          배치만 바뀜 → revision+1·`blockStatus` 그대로(PM 확정)·edit_signal 없음·재렌더 시도·**검사 등록 없음**(검사 입력이 같아 기존 결과가 유효 — confirmReview 「규칙 검사 연결」) /
          둘 다 바뀜 → revision+1 한 번·`edited`·재렌더 시도 하나(규칙 검사 연결 뒤에는 검사 등록) / 정규화 뒤 둘 다 지금과 같음 → 변경 없음(no-op).
        - 셀러 조정만 저장한다. content.csv의 `layout_x·layout_y·layout_w·layout_h·font_scale`은 이 셀러 조정값이다(exportCreate — 없으면 빈칸).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockPatch' }
            examples:
              translation:
                summary: '(가상 값) 번역문만 수정 — 현행 요청과 같음'
                value: { revision: 4, trans1: 'Visibly smoother skin' }
              layoutMove:
                summary: '(가상 값 · 계약 확정·서버 구현 대기) 영역 옮기기 — box 위치만, 배율 그대로, 번역문은 현재 값'
                description: '블록 302(원본 bbox 40, 200, 520×48)를 옮겼다. 크기는 원본과 같고 위치만 소수로 바뀐다. trans1은 현재 값 그대로 보낸다(현재 공개안은 trans1 필수 — 생략 허용은 후속 협의).'
                value: { revision: 5, trans1: 'Strengthens the moisture barrier', layoutAdjust: { box: { x: 40.5, y: 212.25, w: 520, h: 48 } } }
              layoutPlus:
                summary: '(가상 값 · 계약 확정·서버 구현 대기) [+] 한 번 — box와 fontScale을 함께(FE가 계산)'
                description: >
                  지금 영역(40.5, 212.25, 520×48)·배율 1.0에서 [+]. 증감량 0.05·박스 중심 기준은 PM 확정, 박스에 s′/s(=1.05)를 곱하는 계산식은 FE 동의.
                  서버는 받은 절대값 그대로 저장한다.
                value: { revision: 6, trans1: 'Strengthens the moisture barrier', layoutAdjust: { box: { x: 27.5, y: 211.05, w: 546, h: 50.4 }, fontScale: 1.05 } }
              layoutResize:
                summary: '(가상 값 · 계약 확정·서버 구현 대기) 손잡이 끌기 — box 크기만, 배율 그대로'
                value: { revision: 7, trans1: 'Strengthens the moisture barrier', layoutAdjust: { box: { x: 27.5, y: 211.05, w: 600.5, h: 50.4 } } }
              clearScale:
