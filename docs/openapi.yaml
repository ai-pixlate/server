            현재 입력 지문의 시도가 없을 때만(제외 중 번들 갱신·검사 활성화·규칙 버전 변경 등으로 지문이 바뀜, 또는 시도 기록 없음) 새 시도를 등록한다 — 입력이 바뀐 새 시도이므로 재시도 횟수를 쓰지 않는다.
