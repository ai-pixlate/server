openapi: 3.1.0
info:
  title: Pixate Backend API
  version: 3.4.2
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  summary: AI 상세페이지 로컬라이제이션 서비스 백엔드 API
  description: |
    Pixate 백엔드 API 명세. 근거: `API설계_Inventory_데이터흐름_v3.4.2`(정본) ·
    `오케스트레이션 v0.3` · `CHECK_enum_허용값_v3.4.1` · `ERD_PIX_ateV5.sql` · `FK감사_V5대조_v3.4.2`.

    ## 릴리스 스코프 (태그·설명에 표기)
    - 🟢 9월 (MVP must) · 🟡 9월(should) · 🔵 12월 · 📌 조건부(PM 확정 대기)
    - 12월·조건부 오퍼레이션은 스펙에 **포함**하되 상세 계약이 미확정이라 최소 스키마 + `TODO` 주석으로 둔다.

    ## 화면(Screen) ↔ API 매핑 (MVP=Must)
    각 오퍼레이션에 `x-screen` 확장으로 대응 PRD 화면을 표기했다. Must 화면 전부 API로 커버됨.
    - **G1** 로그인·회원가입 → AUTH-01~05
    - **S0** 프로세스 바(전역) → JOB-03·04·05·07 (상태·취소·중단 · 전역 바라 전용 화면 API 없음)
    - **N1** 입력 → SRC-01~04 · JOB-02 · MST-01~07 · AUTH-05
    - **N2** 분석 → ANL-01 · JOB-05
    - **N3** 섹션확인 → SEC-01~04 · INP-01
    - **N4** 번역 → SEC-04(트리거) · JOB-05 · INP-01
    - **N5** 검수 → CFM-01~04 · SEC-03
    - **N6** 저장 → FIN-01~07
    - **M1** 보관함 → LIB-01
    - **M2** 브랜드 정보 → BRD-01~07
    - 🔵12월 화면(MVP=X): M0 브랜드관리 · M3 작업관리(JOB-01) · O1~O5 운영콘솔(ADM-01~07) → 스텁

    ## 공통 규칙
    - **Base-path**: 경로는 접두어 없는 상대경로(`/auth/login`). 버전·호스트는 `servers`에서만 선언(`/v1`).
    - **인증**: `bearerAuth`(JWT access) 전역 적용. refresh 토큰은 httpOnly 쿠키로만 오간다(요청 바디 금지).
      `/auth/refresh`·`/auth/logout`은 쿠키 기반(+ CSRF 헤더 `X-Requested-With`). `/admin/**`은 역할 권한(403).
    - **소유 검증**: 남의 `/jobs/{jobId}/**`·`/brands/{brandId}/**` 접근은 존재 은닉 위해 **404 NOT_FOUND**.
    - **Error**: 전 엔드포인트 4xx/5xx는 `Error` 컴포넌트(`{ error: { code, message, retryable, details?, traceId } }`). `code`는 15종 enum(§14-1). HTTP `error.code`(15종) / task `errorCode`(자유 텍스트·HTTP 200) / signal `code`(계약 §6)는 서로 다른 값 공간 — 번역·렌더 실패는 error.code가 아니라 task/signal로 전달.
    - **presigned URL**: 이미지·파일 URL은 응답 시 발급(만료 5분), DB엔 S3 키만 저장. `format: uri`.
    - **멱등·동시성**: `POST /jobs`는 `Idempotency-Key` 헤더 · `PATCH /jobs/{jobId}/blocks/{blockId}`는 `revision` 낙관적 잠금(409 REVISION_CONFLICT).
      블록·섹션 PATCH의 `Idempotency-Key`·섹션 revision·처리 순서는 [PRD v3.5.10 · BE 계약안](blockPatch 설명 「저장 공통」).
    - **비동기**: `/analyze`·`/sections/proceed`·`/render`·`PATCH /blocks` 등은 202 + taskId를 반환하고, 진행은 `GET /jobs/{jobId}/tasks` 폴링(2초).
    - **파생 필드**: `verdictType`·`displayTop`·`scale`·`signals[]`·`uiStatus`·`stages[]` 등은 응답에만 포함(서버 계산·미저장).

    ## 2차 통합(PRD v3.5.10) 반영 — 진행 중
    이 명세의 기준 버전(3.4.2)은 아직 바꾸지 않았다. PRD v3.5.10·실행계획 v3.5.10 2차 범위 중 **합의된 규칙만** 해당 오퍼레이션·스키마
    설명에 `[PRD v3.5.10 · 계약 확정]`으로 표시해 반영한다. 서버가 아직 따르지 않으면 `· 구현 대기`를 붙인다.
    FE가 필드 설계를 BE에 맡긴 항목(`/preview` 렌더 입력·시도·결과)은 `[PRD v3.5.10 · BE 계약안]`으로 스키마·예시까지 넣되,
    AI 합의가 필요한 내부 값은 후보로 표시한다.
    FE·AI가 BE에 구체안을 요청한 저장 공통(멱등·처리 순서)·섹션 제외·복원·블록 배치·검사 연결 경계도 `[PRD v3.5.10 · BE 계약안]`으로
    스키마·예시까지 넣되, 합의 전이므로 확인할 담당자(FE·AI·PM 확인)를 함께 적는다. 예시 이름·요약에 `BE 계약안`이 붙은 것은 정본 확정값이 아니다.
    그 밖에 협의 중인 것은 "협의 중(미확정)"으로만 적는다. 반영 현황표·확인 질문은 `docs/README.md` 7절.
  contact:
    name: Pixate Backend
servers:
  - url: https://api.pixate.example.com/v1
    description: '운영 게이트웨이 (base-path·버전은 여기서만 선언)'

tags:
  - name: G1 Auth
    description: 'G1 로그인·회원가입 — 계정·인증·동의 (F-ACC) · 🟢9월 (AUTH-06 소셜은 🔵12월)'
  - name: M2 Brand
    description: 'M2 브랜드 정보 — 브랜드·로고 (F-BRD) · 🟢9월'
  - name: N1 Source
    description: 'N1 입력 — 원본 이미지 업로드·순서 (F-SRC-01) · 🟢9월'
  - name: N2 Analysis
    description: 'N2 분석 — 비동기 트리거(OCR·섹션분해·판정) (F-SEC-01) · 🟢9월'
  - name: N3 Section Review
    description: 'N3 섹션 확인 — 섹션 버킷·판정 배지·되살리기 (F-SEC) · 🟢9월'
  - name: N4 Translate
    description: 'N4 번역 — 인페인팅·번역 결과 조회 (F-INP) · 🟢9월 (INP-02 🔵12월)'
  - name: N5 Review
    description: 'N5 검수 — 블록 대조·셀 수정·검수 프리뷰·확정 (F-CFM) · 🟢9월'
  - name: N6 Save & Export
    description: 'N6 저장 — 렌더·산출물·규격검증·묶음·저장 (F-FIN·F-EXP·F-CH) · 🟢9월 (FIN-07 🟡should)'
  - name: M1 Library
    description: 'M1 보관함 — 보관함 카드 (F-LST) · 🟢9월 (LIB-02/03 🔵12월)'
  - name: S0 Job
    description: 'S0 프로세스 바(전역) — 작업 골격·상태·제어 (F-JOB·F-SRC) · 🟢9월 (JOB-01 🔵12월 · PATCH /jobs draft-first 확정 · JOB-08 resume 📌조건부)'
  - name: Master
    description: '마스터 데이터 읽기 전용 시드 (F-LNG·F-CH·F-SRC) · 🟢9월 (전용 화면 O3는 🔵12월)'
  - name: Admin
    description: '운영 콘솔 O1~O5 (A-*) · 🔵12월 · 역할 권한 필요(403)'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access 토큰. FE는 access를 메모리 보관, 요청은 `credentials: include`.'

  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      description: '작업 ID (미소유 시 404 NOT_FOUND)'
      schema: { type: integer, format: int64 }
    BrandId:
      name: brandId
      in: path
      required: true
      description: '브랜드 ID (미소유 시 404 NOT_FOUND)'
      schema: { type: integer, format: int64 }
    SectionId:
      name: sectionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EditIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      description: >
        [PRD v3.5.10 · 계약 확정(FE) · 구현 대기] 블록·섹션 PATCH 저장 재전송의 멱등 키 — 규칙은 blockPatch 설명 「저장 공통」.
        FE 합의: 사용자 조작마다 새 키, 같은 조작의 통신 재시도는 같은 키·같은 요청 본문. 형식 = 공백 없는 ASCII 1~128자(UUID v4 권장), 어기면 422(요청 형식 오류).
        적용 순서(계약안): 서버가 먼저 키를 받아 처리하고 키 없는 요청은 지금처럼 멱등 보장 없이 처리 → FE 적용 확인 뒤 필수(키 없으면 422). 필수화 시점은 FE 확인.
        섹션 PATCH에 이 키를 보내면 `revision`도 함께 보내야 한다(없으면 422) — 기록 만료 뒤 재전송을 revision이 막도록(sectionPatch 설명).

  responses:
    BadRequest:
      description: '400 잘못된 요청 (VALIDATION_ERROR 등)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: '401 인증 실패·만료'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '403 권한 없음 (역할 · /admin)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '404 없음 / 미소유(존재 은닉)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: '409 상태 충돌 (INVALID_STATE · REVISION_CONFLICT · ALL_SECTIONS_EXCLUDED · RETRY_NOT_ALLOWED)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

