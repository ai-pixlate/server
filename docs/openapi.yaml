openapi: 3.1.0
info:
  title: Pixate API
  version: 3.3.1-mvp
  x-source-doc: Pixate_요구사항정의서_v3_3 / pixate_schema_v3.3.1.sql / ERD_Pix_ate_v2
  x-generated: '2026-09-04'
  description: '# Pixate — AI 상세페이지 로컬라이제이션 서비스 API


    국내 뷰티 브랜드의 상품 상세페이지·썸네일을 분석해, 성분·브랜드 정보를 국가별

    문화·규제·소비자 표현 방식과 판매 채널의 형식에 맞춰 자동 재구성하는 서비스의 백엔드 API.


    ## 이 문서의 성격 (API 트래킹)

    요구사항정의서 v3.0의 기능ID(F-*, A-*)와 ERD를 API 표면으로 옮긴 **추적용 스펙**이다.

    각 오퍼레이션에는 아래 확장 필드가 붙어 릴리스·근거를 추적할 수 있다.


    - `x-feature-id` : 대응하는 요구사항 기능ID (예: `F-SRC-10`)

    - `x-release`    : 릴리스 시점 — `9월` (MVP/must) · `9월 should` · `12월` · `이후`

    - `x-priority`   : 우선순위 — `P0`~`P3`

    - `x-mvp`        : MVP(9월 원본 규격 유지·미국·영어) 포함 여부 (`true`/`false`)


    > **범위**: 본 스펙은 **MVP(9월 must)** 를 완전히 정의하고, 12월/이후 기능은

    > 경로와 요약만 담은 **스텁**으로 표시해 로드맵을 함께 추적한다. 스텁 오퍼레이션은

    > `x-stub: true` 이며 `deprecated`가 아니라 미구현(향후 활성) 상태를 뜻한다.


    ## 작업 상태 머신 (05_상태_정책)

    사용자 상태 8종은 DB `status`(6종) + `current_step`(N1~N6)로 매핑된다.


    | 사용자 상태 | status | current_step | 비고 |

    |---|---|---|---|

    | 생성됨 | draft | N1 | N1 완료 |

    | 분석중 | processing | N2 | 비동기 |

    | 섹션확인 | review | N3 | 유일한 개입 지점 1 |

    | 번역중 | processing | N4 | 비동기 (인페인팅∥번역∥규제검증) |

    | 검수 | review | N5 | 개입 지점 2 |

    | 완료 | done | N6 | 보관함 카드 생성 |

    | 오류 | failed | 실패 지점 유지 | 재시도 시 해당 step 복귀 |

    | 취소 | archived | 중단 지점 유지 | |


    ## 파이프라인 (MVP: 원본 규격 유지)

    N1 입력 → N2 분석 → N3 섹션 확인 → N4 번역 → N5 검수 → N6 저장

    '
  contact:
    name: Pixate Backend
  license:
    name: Proprietary
servers:
- url: https://api.pixate.example.com/v1
  description: (예시) 운영
- url: https://staging-api.pixate.example.com/v1
  description: (예시) 스테이징
tags:
- name: Auth
  description: 인증 · 계정 (G1) — Cognito 기반 JWT
- name: Brand
  description: 브랜드 컨텍스트 (M2)
- name: Master Data
  description: N1 입력 폼용 마스터 데이터 (국가·언어·규제분류·카테고리·규격) — 시드 주입(PL-16)
- name: Job
  description: 작업 생성 · 상태 · 제어 (N1~N6 파이프라인 골격)
- name: N1 Input
  description: N1 입력 — 원본 업로드 · 작업 조건 확정
- name: N2 Analysis
  description: N2 분석 — OCR · 섹션 분해 · 규제/현지 판정 (비동기)
- name: N3 Section Review
  description: N3 섹션 확인 — 버킷 · 되살리기/제외 (개입 지점 1)
- name: N4 Translate
  description: N4 번역 — 인페인팅 ∥ 1차 번역 ∥ 규제 검증 → 조판·렌더 (비동기)
- name: N5 Review
  description: N5 검수 — 원문/번역 대조 · 셀 수정 (개입 지점 2)
- name: N6 Save & Export
  description: N6 저장 — 최종 렌더 · 규격 검증 · 산출물 묶음
- name: Library
  description: M1 보관함 — 카드 조회 · 다운로드 · 버전
- name: Admin
  description: 운영 콘솔 (O1~O5) — 대부분 12월. 감사로그/이벤트/신호 적재는 9월부터 동작(화면 없이)
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: 셀러 로그인 / JWT 발급
      operationId: login
      x-feature-id: F-ACC-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 인증 성공 — JWT 발급
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: 액세스 토큰 갱신
      operationId: refreshToken
      x-feature-id: F-ACC-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 갱신된 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃 / 토큰 무효화
      operationId: logout
      x-feature-id: F-ACC-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      responses:
        '204':
          description: 무효화 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Auth
      summary: 현재 셀러 정보 조회
      operationId: getMe
      x-feature-id: F-ACC-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      responses:
        '200':
          description: 셀러 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/social:
    post:
      tags:
      - Auth
      summary: '[12월] 소셜 로그인/회원가입 (카카오·구글 OAuth)'
      description: 제공자+제공자 회원번호로 식별. 등록 계정이면 로그인, 없으면 가입 흐름.
      operationId: socialAuth
      x-feature-id: F-ACC-05
      x-release: 9월 should
      x-priority: P0
      x-mvp: false
      x-stub: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider
              - code
              properties:
                provider:
                  type: string
                  enum:
                  - kakao
                  - google
                code:
                  type: string
                  description: OAuth authorization code
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /consents:
    post:
      tags:
      - Auth
      summary: 책임 한계 동의 기록
      description: 인증·시험 정보의 최종 확인 책임이 셀러에게 있음을 고지하고 동의 시점을 이력으로 저장(PL-02).
      operationId: recordConsent
      x-feature-id: F-ACC-04
      x-release: 9월
      x-priority: P0
      x-mvp: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - consentType
              properties:
                consentType:
                  type: string
                  example: liability_disclaimer
                jobId:
                  type: [integer, 'null']
                  format: int64
      responses:
        '201':
          description: 동의 기록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentLog'
  /brands:
    get:
      tags:
      - Brand
      summary: 브랜드 목록 조회
      description: MVP는 셀러:브랜드 1:1 운용. 1:N 전환은 12월(F-ACC-02).
      operationId: listBrands
      x-feature-id: F-BRD-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      responses:
        '200':
          description: 브랜드 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
    post:
      tags:
      - Brand
      summary: 브랜드 등록
      description: 브랜드명(한글·영문) 정규화 후 동일 셀러 내 중복 차단(F-ACC-02a). 영문명 미등록 시 번역 결과에 한글명 노출 경고.
      operationId: createBrand
      x-feature-id: F-BRD-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreate'
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '409':
          description: 브랜드명 중복 (F-ACC-02a)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /brands/{brandId}:
    parameters:
    - $ref: '#/components/parameters/BrandId'
    get:
      tags:
      - Brand
      summary: 브랜드 상세 조회
      operationId: getBrand
      x-feature-id: F-BRD-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      responses:
        '200':
          description: 브랜드 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Brand
      summary: 브랜드 정보 수정
      description: 브랜드 개요·핵심 고객층은 번역 톤 프롬프트로 주입(F-BRD-03/05). 변경은 새로 시작되는 작업부터 적용(PL-05).
      operationId: updateBrand
      x-feature-id: F-BRD-07
      x-release: 9월
      x-priority: P0
      x-mvp: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandUpdate'
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
  /brands/{brandId}/logo:
    parameters:
    - $ref: '#/components/parameters/BrandId'
    put:
      tags:
      - Brand
      summary: 브랜드 로고 업로드 (비번역 처리)
      description: 로고 영역을 태깅해 OCR·번역·인페인팅 대상에서 제외(F-BRD-02).
      operationId: uploadBrandLogo
      x-feature-id: F-BRD-02
      x-release: 9월
      x-priority: P0
      x-mvp: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 업로드됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  logoUrl:
                    type: string
                    format: uri
  /master/countries:
    get:
      tags:
      - Master Data
      summary: 타겟 국가 목록
      description: 규제 사전 보유 국가만 노출. MVP 미국 / 12월 일본·UAE (F-LNG-01).
      operationId: listCountries
      x-feature-id: F-LNG-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      responses:
        '200':
          description: 국가 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
  /master/languages:
    get:
      tags:
      - Master Data
      summary: 도착 언어 목록
      description: 출발어는 한국어 고정. MVP 영어 / 12월 일본어. 국가와 독립 (F-LNG-02).
      operationId: listLanguages
      x-feature-id: F-LNG-02
      x-release: 9월
      x-priority: P0
      x-mvp: true
      responses:
        '200':
          description: 언어 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'
  /master/regulatory-classes:
    get:
      tags:
      - Master Data
      summary: 규제 분류 목록 (국가별)
      description: 미국 4종 — 화장품 / OTC 의약품 / 복합 / 잘 모름. 미선택 차단, "잘 모름"이 탈출구 (F-LNG-03, PL-25).
      operationId: listRegulatoryClasses
      x-feature-id: F-LNG-03
      x-release: 9월
      x-priority: P0
      x-mvp: true
      parameters:
      - name: country
        in: query
        required: true
        schema:
          type: string
          example: US
      responses:
        '200':
          description: 규제 분류 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegulatoryClass'
  /master/categories:
    get:
      tags:
      - Master Data
      summary: 상품 카테고리 트리 (카테고리 마스터)
      description: Amazon 트리에 준하는 표시 카테고리. 규격·국가와 독립인 전 채널 공통 마스터 (F-SRC-04a). 내부 7종 매핑은 F-SRC-04b가 서버 내부 처리.
      operationId: listCategories
      x-feature-id: F-SRC-04a
      x-release: 9월
      x-priority: P0
      x-mvp: true
      parameters:
      - name: parentId
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: 지정 시 해당 노드의 하위만 반환. 미지정 시 전체 트리.
      responses:
        '200':
          description: 카테고리 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /master/channel-specs:
    get:
      tags:
      - Master Data
      summary: 규격(채널) 목록
      description: '9월은 원본 규격만 활성. 사이트별·커스텀은 비활성 노출(배지 없음) (F-CH-02).

        validation_rules·module_spec의 단일 소스(PL-23). 국가 필터는 F-CH-02c(12월).

        '
      operationId: listChannelSpecs
      x-feature-id: F-CH-01
      x-release: 9월
      x-priority: P0
      x-mvp: true
      parameters:
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: '[12월] 국가 필터 (F-CH-02c). 탐색 보조일 뿐 작업에 저장되지 않음.'
      responses:
        '200':
          description: 규격 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelSpec'
  /master/channel-specs/{channelSpecId}/upload-guide:
    parameters:
    - name: channelSpecId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - Master Data
      summary: 규격 종속 업로드 안내
      description: 선택 규격의 validation_rules·module_spec을 읽어 안내. 9월은 기본 안내(포맷·용량), 규격 종속 안내는 12월 (F-CH-03).
      operationId: getUploadGuide
      x-feature-id: F-CH-03
      x-release: 9월
      x-priority: P0
      x-mvp: true
      responses:
        '200':
          description: 업로드 안내
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadGuide'
  /master/versions:
    get:
      tags:
      - Master Data
      summary: 마스터 데이터 버전 조회 (읽기 전용)
      description: 시드 주입된 마스터 데이터의 버전·적재 시각 조회(PL-16). 편집 콘솔은 12월(A-CFG-01).
      operationId: listMasterDataVersions
      x-feature-id: A-CFG-06
      x-release: 9월
      x-priority: P0
      x-mvp: true
      responses:
        '200':
          description: 버전 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MasterDataVersion'
  /jobs:
    get:
      tags:
      - Job
      summary: 작업 목록 조회
      description: MVP는 단일 세션 전제. 이력 테이블(M3)은 12월(F-JOB-02).
      operationId: listJobs
      x-feature-id: F-JOB-02
      x-release: 12월
      x-priority: P1
      x-mvp: false
      x-stub: true
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/JobStatus'
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: 작업 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
    post:
      tags:
      - Job
      - N1 Input
      summary: 작업 생성 (N1 완료)
      description: '필수값 검증 후 작업 생성 → Job ID 발급, 상태 ''생성됨(draft/N1)'' → N2 분석 자동 시작(F-SRC-10).

        국가·규제분류·도착어·규격·카테고리·키워드를 확정한다. 원본 이미지는 별도 업로드(F-SRC-01)를

        선행하거나 sourceImageIds로 연결한다.

        '
      operationId: createJob
      x-feature-id: F-SRC-10
      x-release: 9월
      x-priority: P0
      x-mvp: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '201':
          description: 작업 생성됨 (생성됨 → 분석 자동 시작)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          description: 필수값 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /jobs/{jobId}:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
