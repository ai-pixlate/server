        - 자동 제외(`auto_*`)의 복원 = `restored_by_user`(F-SEC-06).

        - 제외·복원 어느 쪽도 판정(verdicts)·근거·최초 판정 기록·warningBadge를 바꾸지 않는다.

        - 현재 서버(f85b23e)는 복원 시 항상 `restored_by_user`로 덮는다(구현 차이).

        - 섹션 revision·충돌 검사·재전송 멱등·같은 동작 반복 처리는 아래 BE 계약안이다(합의 전).


        **[PRD v3.5.10 · 구현 대기] 섹션 revision·멱등·같은 동작** — **계약 확정(FE 동의, 11-03)**: 요청 `{action, revision}`·멱등 키·이미 같은 상태면 200 no-op·
        제외와 복원 각각 Undo/Redo 한 단계·저장 성공 뒤 `/blocks`·`/preview` 재조회·충돌 시 최신 상태 동기화와 이력 정리(FE 몫), 원상 복원(PM).
        **BE 계약안**: revision을 올리는 범위, N5 복원 때 시도 확보 세부, 키가 있을 때 revision 필수, 복원 근거 없음 처리(PM-R8 결정 전).

        - 처리 순서·멱등은 blockPatch 「저장 공통」과 같다(오퍼레이션 범위 = 섹션 PATCH). 요청 `{action, revision}` + `Idempotency-Key`.

        - revision이 오르는 변경 = 포함 상태(`bucket`·`exclusionReason`·`excludedStage`)가 실제로 바뀐 경우만. 판정·배지·인페인트 같은 파이프라인 값은 섹션 revision을 올리지 않는다(셀러 조작과 무관한 409를 막는다).

        - 409 REVISION_CONFLICT — `details.current` = 최신 Section 전체(revision 포함). FE는 그 섹션의 이력만 정리하고 current로 맞춘다(FE 합의).

        - 이미 같은 상태(제외인데 제외, 포함인데 복원) → 변경 없음 200. revision·사유·단계 그대로, 감사·이벤트 기록 없음. revision 검사가 먼저다.
          N5에서 N3 제외 섹션 복원은 같은 동작 판정보다 먼저 409 INVALID_STATE(현행 유지).
        - 응답 = 갱신된 Section 전체(현행 서버는 요약 6필드 — 구현 대기).

        - 제외: 진행 중인 미리보기·검사 시도를 취소하지 않는다(늦게 끝난 결과도 평소 채택 조건대로 채택되며, 복원 때 재사용 판단에 쓴다).

        - **N5 제외·복원과 뒤 섹션**(Q-07 — PM·AI 11-04): 제외·복원은 뒤에 있는 포함 섹션들의 출력 위치를 바꾼다. 뒤 섹션의 섹션 입력이 같으면 섹션 이미지를 다시 쓰고
          **다시 렌더하지 않는다**. 바뀐 출력 위치로 최종 합성과 경계 재판정만 한다(`boundaryCheck` — 상세 기능은 12월, confirmReview 「이미지 경계 이탈」).

        - **복원(실제로 포함이 된 경우) — 필요한 렌더·검사 확보**. 단계에 따라 다르다.
          N3 복원 = 아무것도 등록하지 않는다. 아직 번역·스타일 결과가 없을 수 있으므로 후속 처리는 기존 N3→N4 진행([이대로 진행]) 흐름에 맡긴다.
          N5 복원 = 복원 트랜잭션에서 그 섹션의 현재 입력 기준으로 미리보기와 활성 검사마다 현재 시도를 본다. 무조건 다시 실행하지 않는다
            (PM 11-04: 제외·복원만으로 규제·강제 용어 검사를 다시 실행하지 않는다 — 아래는 유효한 결과가 없을 때의 확보다).
            현재 입력 지문의 시도가 있으면 그 상태를 그대로 둔다 — 성공 결과·대기·실행 중은 물론 **최종 실패도 그대로**다. 같은 입력의 최종 실패를 복원 때문에 다시 실행하지 않으며,
