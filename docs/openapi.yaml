  /jobs:
    get:
      tags: [S0 Job]
      summary: 작업 목록 조회 🔵12월
      operationId: jobList
      x-screen: 'M3(12월)'
      x-source: API-JOB-01
      description: '🔵12월 · 상세는 M3 화면과 함께 확정. TODO: 필터·정렬·페이징 미확정.'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: '🔵12월 미확정'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StubResponse' }
    post:
      tags: [S0 Job]
      summary: 작업 생성 = N1 완료 🟢9월
      operationId: jobCreate
      x-screen: 'N1'
      x-source: API-JOB-02
      description: >
        draft 생성 (A3 draft-first). brandId만으로 빈 draft를 만들고 jobId 반환.
        흐름: POST /jobs(draft) → SRC-02(원본 업로드) → PATCH /jobs/{jobId}(N1 값) → analyze.
        N1 필수값 검증은 analyze(ANL-01) 게이트. Idempotency-Key 헤더 권장. 🟢9월.

        **[PRD v3.5.10 · 계약 확정] 호출 시점과 책임 동의(F-ACC-04)** — 화면은 책임 동의 체크 뒤 N1 [다음]에서 이 API를 호출하고
        이어서 위 순서(업로드 → PATCH → analyze)를 실행한다. draft-first는 [다음] 이후의 호출 순서다.
        동의는 따로 저장하지 않는다. `createdAt`은 지금은 작업 생성 시각이며, 동의 체크를 [다음]의 필수 조건으로 적용한 뒤부터는
        PM 정책에 따라 동의 시각으로도 쓴다. 현재 확인한 화면(client 8319dd6)에는 동의 체크가 없어(고지 문구만 있음) 이 전제는 아직 충족되지 않는다.
        생성 뒤 업로드 실패로 남는 draft의 재개·취소 정책은 별도(미확정).

        **[PRD v3.5.10 · 정책 확정(PM 11-04) · 구현 대기] 브랜드 스냅샷** — 브랜드 정보는 작업 생성 시점의 값으로 고정한다. 번역·검사·재시도에서도 이후의 브랜드 수정값을 섞지 않는다.
        현행 서버는 작업에 `brand_id`만 저장하고, 브랜드 값은 N3 [이대로 진행] 때 하류 실행 범위(`run_scope.brand`)에 고정한다 — 생성 시점 스냅샷으로 옮기는 것은 구현 대기.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: >
            같은 키 재요청은 첫 응답 재전송(Redis 24h · 중복 생성 방지).
            키 범위 = 판매자 + 작업 생성 API + 키(다른 판매자의 같은 키와 섞이지 않음).
            완료된 같은 키는 요청 본문이 달라도 최초 응답(201 Job)을 재전송 — 다른 작업을 만들려면 새 키를 쓴다.
            키 없는 요청도 허용(멱등 보장 없음). 같은 키 동시 요청에서도 작업은 하나만 생성.
