openapi: 3.1.0
info:
  title: Pixate Backend API
  version: 3.5.10
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  summary: 'AI 상세페이지 로컬라이제이션 서비스 백엔드 API — PRD v3.5.10 기준 · 2차 통합 API 계약'
  description: |
    # PRD v3.5.10 기준 · 2차 통합 API 계약

    ## 이 문서의 버전과 서버 동작 — 명세 공개 버전 ≠ 서버 동작
    - 이 문서(명세 3.5.10)는 PRD v3.5.10 기준 2차 통합 **확정 계약 공개본**이다. FE·AI는 서버 구현을 기다리지 않고 이 명세의 요청·응답·오류·예시로 타입·Mock·화면을 먼저 만든다.
      전체 서버 구현 완료는 이 명세 공개의 선행 조건이 아니다. 각 항목의 서버 상태는 아래 「2차 통합 반영 표기」의 상태 표기로 구별한다 —
      명세에 실렸다고 서버가 이미 그렇게 동작하는 것은 아니다.
    - `servers`의 `https://api.pixate.example.com/v1`은 예시 주소다. 그래서 Swagger 「Try it out」은 실제 서버를 호출하지 않으며, 이 사이트로는 실제 API 호출을 검증할 수 없다.
    - 운영 서버는 1.0.0 릴리즈 계약(명세 3.4.2) 기준이다. 2차 항목은 어느 서버(운영·dev 샌드박스)에도 아직 배포되지 않았다.

    Pixate 백엔드 API 명세. 근거: `API설계_Inventory_데이터흐름_v3.4.2`(정본) ·
    `오케스트레이션 v0.3` · `CHECK_enum_허용값_v3.4.1` · `ERD_PIX_ateV5.sql` · `FK감사_V5대조_v3.4.2`.

    ## 릴리스 스코프 (태그·설명에 표기)
    - 🟢 9월 (MVP must) · 🟡 9월(should) · 🔵 12월 · 📌 조건부(PM 확정 대기)
    - 12월·조건부 오퍼레이션은 스펙에 **포함**하되 상세 계약이 미확정이라 최소 스키마 + `TODO` 주석으로 둔다.

    ## 2차 통합(PRD v3.5.10 · 11/6) 반영 표기
    - 명세 버전(`info.version`) 3.5.10은 PRD v3.5.10에 맞춘 번호다. 3.5.10 = 2차 통합 확정 계약 공개본, 3.4.2 = 1.0.0 릴리즈 계약.
    - 이 명세에는 2차 확정 계약만 싣는다. 태그 `[PRD v3.5.10 · 계약 확정(근거) · 상태]`·`[PRD v3.5.10 · 합의(근거) · 상태]`의 근거는 확정한 쪽(PRD·PM·FE·AI)과 날짜이고,
      상태는 아래 셋 중 하나다. 2차 항목이 있는 오퍼레이션은 설명 첫머리 「2차 상태」에 항목별 상태를 모아 둔다.
      - `계약 확정·서버 구현 대기` = 계약은 확정됐고 develop 서버 코드에는 아직 없다.
      - `구현 완료·서버 배포 대기` = develop에 구현됐고 어느 서버(운영·dev 샌드박스)에도 배포되지 않았다.
      - `서버 배포·연동 확인 완료` = 실제 서버 배포와 FE 연동까지 확인됐다. 지금 2차 항목 중 해당하는 것은 없다.
      - 그 밖에 `현행` = 지금 운영 서버 동작과 같다(3.4.2 계약), `화면` = FE 동작, `서버 미완료`·`미착수` = 구현 PR 안에서 남은 경로(`docs/README.md` 7.2에서 추적).
    - /preview 렌더 입력·지문·시도/결과는 그 구현 PR(#108) 머지를 전제로 `구현 완료·서버 배포 대기`로 적는다.
    - 합의 전 후보·미결은 싣지 않는다. 확정되면 그때 추가한다(남은 계약 항목은 `docs/README.md` 7.3, 서버 미완료·의존 작업 추적은 7.2).
    - `[PRD v3.5.10 · 계약 확정(FE 11-05)]` = FE가 필드 설계를 BE에 맡긴 /preview 렌더 입력·지문·시도/결과다. BE 계약안을 FE가 11-05에 수용해 확정했다.
    - 3차(11/27) 예정 기능(최종 이미지 경계 판정 Q-07과 그 응답 필드 `boundaryCheck`, 확정 때 추가 확인 절차, LLM 규제 판정, 시스템 자동 조정 등)은 이 명세에 넣지 않는다 — 2차 연결에 필요한 필드가 아니다.

    ## 화면(Screen) ↔ API 매핑 (MVP=Must)
    각 오퍼레이션에 `x-screen` 확장으로 대응 PRD 화면을 표기했다. Must 화면 전부 API로 커버됨.
    - **G1** 로그인·회원가입 → AUTH-01~05
    - **S0** 프로세스 바(전역) → JOB-03·04·05·07 (상태·취소·중단 · 전역 바라 전용 화면 API 없음)
    - **N1** 입력 → SRC-01~04 · JOB-02 · MST-01~07 · AUTH-05
    - **N2** 분석 → ANL-01 · JOB-05
    - **N3** 섹션확인 → SEC-01~04 · INP-01
    - **N4** 번역 → SEC-04(트리거) · JOB-05 · INP-01
    - **N5** 검수 → CFM-01~04 · SEC-03
    - **N6** 저장 → FIN-01~07
    - **M1** 보관함 → LIB-01
    - **M2** 브랜드 정보 → BRD-01~07
    - 🔵12월 화면(MVP=X): M0 브랜드관리 · M3 작업관리(JOB-01) · O1~O5 운영콘솔(ADM-01~07) → 스텁

    ## 공통 규칙
    - **Base-path**: 경로는 접두어 없는 상대경로(`/auth/login`). 버전·호스트는 `servers`에서만 선언(`/v1`).
    - **인증**: `bearerAuth`(JWT access) 전역 적용. refresh 토큰은 httpOnly 쿠키로만 오간다(요청 바디 금지).
      `/auth/refresh`·`/auth/logout`은 쿠키 기반(+ CSRF 헤더 `X-Requested-With`). `/admin/**`은 역할 권한(403).
    - **소유 검증**: 남의 `/jobs/{jobId}/**`·`/brands/{brandId}/**` 접근은 존재 은닉 위해 **404 NOT_FOUND**.
    - **Error**: 전 엔드포인트 4xx/5xx는 `Error` 컴포넌트(`{ error: { code, message, retryable, details?, traceId } }`). `code`는 15종 enum(§14-1). HTTP `error.code`(15종) / task `errorCode`(자유 텍스트·HTTP 200) / signal `code`(계약 §6)는 서로 다른 값 공간 — 번역·렌더 실패는 error.code가 아니라 task/signal로 전달.
    - **presigned URL**: 이미지·파일 URL은 응답 시 발급(만료 5분), DB엔 S3 키만 저장. `format: uri`.
    - **멱등·동시성**: `POST /jobs`는 `Idempotency-Key` 헤더 · `PATCH /jobs/{jobId}/blocks/{blockId}`는 `revision` 낙관적 잠금(409 REVISION_CONFLICT) + 선택 `Idempotency-Key`(blockPatch 「저장 공통」 — 같은 키·같은 요청만 최초 응답 재전송). `PATCH /jobs/{jobId}/sections/{sectionId}`도 같은 규칙이다(sectionPatch).
    - **비동기**: `/analyze`·`/sections/proceed`·`/render`·`PATCH /blocks` 등은 202 + taskId를 반환하고, 진행은 `GET /jobs/{jobId}/tasks` 폴링(2초).
    - **파생 필드**: `verdictType`·`displayTop`·`scale`·`signals[]`·`uiStatus`·`stages[]` 등은 응답에만 포함(서버 계산·미저장).
