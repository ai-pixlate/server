  /jobs/{jobId}/preview:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [N5 Review]
      summary: 검수 뷰어 프리뷰 — 다폭 대응 🟢9월
      operationId: reviewPreview
      x-screen: 'N5'
      x-source: API-CFM-03
      description: >
        displayTop·scale·previewHeight 서버 계산(미저장). scale=previewWidth/maxOriginalWidth · align=left.
        섹션별 presigned. N3 제외 제외 · N5 제외는 bucket=exclude 포함. 🟢9월.


        **[PRD v3.5.10 · BE 계약안 · 구현 대기] 렌더 입력·현재 시도·표시 결과** — FE가 필드 설계를 BE에 맡긴 항목이다
        (FE 요구: 표시 preview의 입력, 현재 시도 상태, 표시 preview가 현재 입력의 결과인지). 필드 이름·구조는 이 계약안이다.
        `renderInput.blocks[].style` 최소 필드는 BE 계약안(AI 확인)이고, 정렬 근거의 저장·지문 표현은 AI 확인 대상이다. 다만 렌더 결과를 바꾸는 값을 지문에 넣는 것은 후보가 아니다(`inputFingerprint` 원칙).
        현재 서버(f85b23e)는 이 필드들을 내지 않는다. 필드 제공 규칙·호환은 ReviewPreview 설명에 있다.


        - **한 스냅샷**: 한 응답의 `renderer`·`renderInput`·`inputFingerprint`·`render`는 서버의 같은 시점 상태로 만든다.
          최신성은 이 응답 안에서만 비교하고, 다른 조회(`/blocks`)의 revision과 섞어 판단하지 않는다.
        - **최신성은 지문으로**: revision만 비교하지 않는다. 렌더 결과를 바꾸는 입력은 모두 지문에 들어가므로(배율·정렬 근거 포함 — 원칙)
          revision이 같아도 스타일·배경·배율·렌더러가 바뀌면 `isCurrent=false`다.
        - **서버 입력 기준**: `isCurrent`는 조회 시점에 서버가 저장한 입력 기준이다. FE의 저장 전 로컬 편집과 같다는 뜻이 아니며,
          로컬 편집과의 차이는 FE가 따로 처리한다.
        - **넘침**: `render.result.overflow`만 판정에 쓴다. `isCurrent=false`면 서버가 null로 낸다.

        - **상태 판정**(섹션마다, 같은 응답 안에서 위에서부터 처음 맞는 것 — 가능한 조합은 모두 어느 하나에 걸린다):
          x `render=null` → N5 제외 섹션(`renderInput`·`inputFingerprint`도 null). 렌더 상태를 판정하지 않는다. 제외 표시는 기존 N5 제외 화면 규칙을 따른다.
          i `inputError≠null` → 입력 구성 실패(`renderInput`·`inputFingerprint` null, isCurrent=false). result가 있으면 이전 이미지를 최신 아님으로, 없으면 이미지 없음. 넘침 미측정.
            [다시 시도] 없음(같은 입력으로는 풀리지 않는다), 자동 재조회 없음, 보고. 로컬 미리보기도 할 수 없다(공통 입력이 없다). attempt가 같은 코드로 failed여도 i가 먼저다.
          a `isCurrent=true` → 최신. 결과 이미지를 표시하고 `result.overflow`로 넘침을 표시한다.
          b `attempt.status`가 pending·running → 진행 중. result가 있으면 이전 이미지, 없으면 이미지 없음. 넘침 미측정. `attempt.taskId`를 /tasks로 추적하고 끝나면 재조회.
          c `attempt.status=failed` → 실패. result가 있으면 이전 이미지, 없으면 이미지 없음. 넘침 미측정. 자동 재조회 없음. `retryable`이면 [다시 시도].
          d `attempt.status=done`이고 result가 null이거나 `attempt.taskId ≠ result.taskId` → 채택 직후·채택 거절. 한 번 재조회하고, 그대로면 e처럼 처리한다.
          (여기까지 걸리지 않았으면 attempt는 null이거나 result와 같은 task(done)이고, isCurrent=false다.)
          g result가 있고 `result.rendererId ≠ renderer.rendererId` → 렌더러 갱신 뒤 새 시도 등록 대기. 이전 이미지, 넘침 미측정. 재조회는 아래 「g의 재조회」.
          e 나머지 전부 — ① result가 있고 렌더러도 같은데 입력이 바뀌었고 새 시도가 없음, ② attempt·result가 모두 null → 시도 누락(서버 결함).
            한 번 재조회 후 그대로면 실패처럼 표시하고(result가 있으면 이전 이미지, 넘침 미측정) 보고한다. 재시도할 task가 없으므로 [다시 시도]는 없다.
        - **렌더 대상 블록 0개**(`renderInput.blocks=[]`)는 판정의 예외가 아니다. 결과 이미지가 배경만 그린 이미지일 뿐이며 x~e를 그대로 적용한다
          (현재 결과면 `overflow={}`). 실패·시도 누락을 정상으로 보지 않는다.
        - **결과 없음 vs 시도 없음 vs 대상 없음**: 성공 결과 없음 = `result=null`·`renderedUrl=null`(b·c·d·e②) /
          현재 시도 없음 = `attempt=null`(g·e — 포함 섹션의 정상 흐름에는 없다) / 렌더 대상 블록 없음 = `renderInput.blocks=[]`(판정은 같음) /
          렌더 판정 대상 아님 = `render=null`(x).
        - **g의 재조회**(BE 계약안 — 횟수·간격은 FE 수용): 과거 task(`result.taskId`)는 폴링하지 않는다. 새 시도 등록은 `/preview`를 다시 조회해야만
          알 수 있으므로 다음 계기로 재조회한다 — ① g를 처음 본 뒤 제한된 자동 재조회(5초 간격 최대 12회, 약 1분 — FE 수용),
          ② 기존 재조회 계기(추적 task 완료·구성 변경·화면 재진입)에 함께 확인, ③ 사용자의 새로고침.
          서버는 HTML 번들 갱신 대상에 새 미리보기 시도를 등록한다. 등록 방식과 완료 시간 보장은 BE 배포 설계에서 정한다 —
          FE의 자동 재조회 횟수는 화면의 자동 조회 종료 기준이며 서버의 등록 완료 시간 보장이 아니다.
          재조회에서 attempt가 새 task로 바뀌면 b가 되고 이후 a·c로 이어진다(이미 끝났으면 바로 a·c·d).
          한도에 도달해도 새 시도가 확인되지 않으면 자동 재조회를 멈추고 "새 렌더 등록을 아직 확인하지 못함"으로 처리한다.
          이전 이미지는 최신이 아닌 상태로 유지하고 넘침은 미측정으로 표시한다. 이후 ②·③(화면 재진입·사용자 새로고침 등)으로 다시 확인할 수 있다.
          한도 도달은 관측 정보로 기록할 수 있지만, 서버가 확인한 등록 실패와 같게 취급하지 않는다(서버 결함으로 확정하지 않는다).
        - **렌더러 전환**: 같은 HTML 렌더 안의 공통 번들 갱신은 서버가 새 미리보기 시도를 등록한다(PM 확정). 새 시도가 확인되기 전 구간은 g다.
          전환 이전 작업은 새 시도를 만들지 않는다(다운로드만). 대상(PM 11-04): 대상·건수를 조사해 테스트 작업을 취소로 정리할 수 있는지 확인하고 결과에 따라 정한다 — 정리가 어려우면 전환 시점의 모든 미완료 작업,
          단 최종 렌더가 끝난 N6 저장 대기 작업은 [저장]·취소를 허용한다(조사 뒤 적용). 이 작업도 /preview에서는 g와 같은 모양이므로
          작업 단위 표시로 먼저 구별하고 그 작업에는 g의 재조회를 하지 않는다 — 그 표시 필드는 협의 중.
