    # ===== Section / Verdict =====
    SectionVerdict:
      type: object
      description: 'ERD section_verdict — 판정 배지. verdictType은 파생(읽기 전용).'
      properties:
        id: { type: integer, format: int64 }
        verdictStatus: { $ref: '#/components/schemas/VerdictStatus' }
        verdictType: { $ref: '#/components/schemas/VerdictType' }
        problemText: { type: [string, 'null'] }
        alternativeExpression: { type: [string, 'null'], description: '안전한 대체 표현 (N5 문구·regulatory_replaceable)' }
        basisArticle: { type: [string, 'null'], description: '조문 식별자만 (OI-58)' }
        evidenceUrl: { type: [string, 'null'], format: uri }
        reason: { type: [string, 'null'] }
    Section:
      type: object
      description: 'ERD section'
      properties:
        id: { type: integer, format: int64 }
        sectionOrder: { type: integer, description: '원본 세로 순서. [PRD v3.5.10 · 계약 확정 · 현행] N3 목록은 버킷과 관계없이 이 순서로 보인다(F-SEC-02 — 화면이 응답의 두 배열을 합쳐 이 값으로 정렬)' }
        sourceImageId: { type: integer, format: int64 }
        topOffset: { type: [integer, 'null'], description: '원본 이미지 내 세로 좌표(px). N5 스택엔 displayTop 사용' }
        displayTop: { type: [integer, 'null'], description: '서버 계산·미저장 (Σ 앞선 include 섹션 height)' }
        height: { type: [integer, 'null'] }
        bbox: { oneOf: [ { $ref: '#/components/schemas/Bbox' }, { type: 'null' } ] }
        category: { type: [string, 'null'] }
        bucket: { $ref: '#/components/schemas/SectionBucket' }
        exclusionReason: { oneOf: [ { $ref: '#/components/schemas/ExclusionReason' }, { type: 'null' } ] }
        excludedStage: { oneOf: [ { $ref: '#/components/schemas/ExcludedStage' }, { type: 'null' } ] }
        inpaintStatus: { oneOf: [ { $ref: '#/components/schemas/InpaintStatus' }, { type: 'null' } ] }
        warningBadge: { oneOf: [ { $ref: '#/components/schemas/WarningBadge' }, { type: 'null' } ] }
        verdicts:
          type: array
          description: >
            판정 목록 (정렬 불변식 regulated→policy→irrelevant→needs_fix→conditional, 같은 값은 id 순). 상세(SEC-02)는 판정 근거 전체.
            **[PRD v3.5.10 · 계약 확정·서버 구현 대기]** 목록(sectionList)도 버킷과 관계없이 그 섹션에 달린 판정 전부를 싣는다 —
            포함 섹션도 배지·판정 목록을 보인다(F-SEC-02 J74④ · F-SEC-04 J76⑤). 현행 서버는 목록의 포함 섹션을 빈 배열로 반환한다.
          items: { $ref: '#/components/schemas/SectionVerdict' }
        signals:
          type: array
          items: { $ref: '#/components/schemas/ReviewSignal' }
        revision:
          type: integer
          description: >
            [PRD v3.5.10 · 계약 확정(FE 11-03) · 구현 완료·서버 배포 대기] 섹션 낙관적 잠금 버전 — 목록·상세·섹션 PATCH 응답 모두에 싣는다.
            포함 상태(`bucket`·`exclusionReason`·`excludedStage`)가 섹션 PATCH로 실제로 바뀔 때만 +1이다. 판정·배지·인페인트 같은 파이프라인 값은 올리지 않는다. 기존 섹션은 0부터.
    SectionList:
      type: object
      description: >
        버킷 2단. 두 배열 모두 섹션마다 판정 목록 전부를 싣는다([PRD v3.5.10 · 계약 확정·서버 구현 대기] — 현행 서버는 포함 섹션 빈 배열).
        화면의 원래 순서 목록은 두 배열을 합쳐 `sectionOrder`로 정렬한다(· 화면).
      properties:
        exclude:
          type: array
          items: { $ref: '#/components/schemas/Section' }
        include:
          type: array
          items: { $ref: '#/components/schemas/Section' }
    SectionPatch:
      type: object
      required: [action]
      additionalProperties: false
      description: >
        N3(섹션 카드 버튼 — PRD v3.5.10 F-SEC-03)·N5(휴지통 F-CFM-14) 공용. excludedStage는 서버가 currentStep으로 기록.
        `action` 필수, 정의되지 않은 키는 받지 않는다 — 어기면 422 VALIDATION_ERROR.
      properties:
        action: { type: string, enum: [restore, exclude] }
        revision:
          type: integer
          description: >
            [PRD v3.5.10 · 계약 확정(FE 11-03) · 구현 완료·서버 배포 대기] 화면이 본 섹션 `revision`. 정수 값만(0과 0.0은 같은 0, false·"0"·0.5·null은 422).
            `Idempotency-Key`를 보내면 함께 보내야 한다(없으면 422). 키 없는 요청에서 생략하는 것은 **호환 기간의 동작**이며,
            revision 기반 충돌 방지(409 REVISION_CONFLICT)는 이 값을 보낸 요청에만 적용된다. FE 적용 뒤 모든 요청에서 필수로 바꾼다.
    InpaintResult:
      type: object
      properties:
        sectionId: { type: integer, format: int64 }
        inpaintStatus: { $ref: '#/components/schemas/InpaintStatus' }
        inpaintImageUrl: { type: [string, 'null'], format: uri, description: 'presigned, 만료 5분' }
        residualRatio: { type: [number, 'null'], format: float }
        warningBadge: { oneOf: [ { $ref: '#/components/schemas/WarningBadge' }, { type: 'null' } ] }

    # ===== N5 Blocks / Preview =====
    TextBlock:
      type: object
      description: 'ERD text_block. isExcluded는 파생(role=product_label). 번역 실패는 signals[].code=translation_failed.'
      properties:
        id: { type: integer, format: int64 }
        sectionId: { type: integer, format: int64 }
        displayTop: { type: [integer, 'null'], description: '소속 섹션 displayTop 복사(파생)' }
        blockOrder: { type: integer }
        role: { $ref: '#/components/schemas/BlockRole' }
        isExcluded: { type: boolean, description: '파생 (role=product_label)' }
        sourceKo: { type: [string, 'null'] }
        trans1: { type: [string, 'null'] }
        trans2: { type: [string, 'null'], description: '9월 null' }
        blockStatus:
          allOf: [ { $ref: '#/components/schemas/BlockStatus' } ]
          description: >
            「사용자수정」 표시(F-CFM-02a). `edited`는 번역문이 바뀐 저장에서만 된다.
            [PRD v3.5.10 · 합의(PM) · 계약 확정·서버 구현 대기] 배치(박스·글자 배율)만 바꾼 저장은 이 값을 바꾸지 않는다(blockPatch 「블록 배치」).
        bbox: { oneOf: [ { $ref: '#/components/schemas/Bbox' }, { type: 'null' } ] }
        charCount: { type: [integer, 'null'] }
        charLimit: { type: [integer, 'null'], description: '항상 필드 포함, 상한 없으면 null' }
        overflow:
          type: boolean
          description: >
            마지막으로 채택된 미리보기 결과의 측정값 — 현재 입력과 다를 수 있다(편집 직후·렌더 중·실패·스타일만 바뀐 경우).
            [PRD v3.5.10 · 계약 확정(FE) · 현행] 기존 호환을 위해 유지하되 넘침 판정에는 쓰지 않는다 — 판정은 /preview `render.result.overflow`.
        autoAdjust: { oneOf: [ { $ref: '#/components/schemas/AutoAdjust' }, { type: 'null' } ] }
        signals:
          type: array
          items: { $ref: '#/components/schemas/ReviewSignal' }
        alternativeExpression: { type: [string, 'null'] }
        revision: { type: integer, description: '낙관적 잠금 버전' }
        sectionInputFingerprint:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: >
            [PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 이 응답 시점의 소속 섹션 렌더 입력 지문 — /preview `sections[].inputFingerprint`와 같은 계산이며
            같은 섹션의 블록은 같은 값을 갖는다(지문 A). null = 제외 섹션, 입력 오류(/preview `inputError`), 입력 준비 중 — null은 비교하지 않는다(비교 불가).
            /blocks와 /preview는 별도 요청이라 같은 순간을 뜻하지 않는다 — 이 값과 /preview `inputFingerprint`(지문 B)가 같을 때만 표와 뷰어 입력이 일치한다고 본다.
            미리보기 최신성은 /preview 안의 `render.isCurrent`로 본다(reviewPreview 「렌더 입력과 시도·결과」).
        layoutAdjust:
          oneOf: [ { $ref: '#/components/schemas/LayoutAdjust' }, { type: 'null' } ]
          description: >
            [PRD v3.5.10 · 합의(FE 11-03 · 정규화 FE·AI 11-04) · 계약 확정·서버 구현 대기] 저장된 셀러 배치 조정(F-CFM-15). null = 셀러 조정 없음(정규화 — blockPatch 「블록 배치」).
            원본 `bbox`는 바뀌지 않는다. 적용 박스·배율은 /preview `renderInput`에서 읽는다. 서버 구현 전(현행) 응답에는 이 키가 없다.
        check:
          oneOf: [ { $ref: '#/components/schemas/BlockCheck' }, { type: 'null' } ]
          description: >
            [PRD v3.5.10 · 합의(FE 11-03 · AI 11-04) · 계약 확정·서버 구현 대기] 현재 입력에 대한 번역문 규칙 검사 상태(confirmReview 「규칙 검사 연결」).
            검사 대상이 아니면(라벨·로고·빈 원문·빈 번역문·제외 섹션) null. 서버 구현 전(현행) 응답에는 이 키가 없다.
    BlockPatch:
      type: object
      required: [trans1, revision]
      additionalProperties: false
      description: >
        trans1(문자열)·revision(정수) 필수, 정의되지 않은 키는 받지 않는다. revision은 JSON 수 중 정수 값(0과 0.0은 같은 정수 0)이며, false·"0"·0.5처럼 정수 값이 아니면 422 VALIDATION_ERROR. trans1에 숫자를 보내도 422(blockPatch 「저장 공통」 오류 분류).
        선택 `layoutAdjust`는 [PRD v3.5.10 · 합의(FE 11-03) · 계약 확정·서버 구현 대기] 블록 배치다(blockPatch 「블록 배치」) — 서버 구현 전(현행)에는 정의되지 않은 키라 422다.
        **현재 공개안: `trans1`은 필수다** — 배치(`layoutAdjust`)만 바꾸는 요청도 현재 `trans1`을 함께 보낸다(같은 값은 no-op 규칙대로 번역문 변경 없음).
        빠지면 422 VALIDATION_ERROR다(blockPatch 예시 `missingTrans1`). 배치 요청의 `trans1` 생략 허용은 후속 협의 항목이다(`docs/README.md` 7.3) — 허용으로 바뀌면 그때 명세를 고친다.
      properties:
        trans1: { type: string, description: '수정 번역문 — 필수(배치만 바꾸는 요청도 현재 값을 보낸다. 생략 허용은 후속 협의)' }
        revision: { type: integer, description: '현재 블록 revision. 불일치 시 409 REVISION_CONFLICT' }
        layoutAdjust:
          oneOf: [ { $ref: '#/components/schemas/LayoutAdjustPatch' }, { type: 'null' } ]
          description: '[PRD v3.5.10 · 합의(FE 11-03) · 계약 확정·서버 구현 대기] 셀러 배치 조정. 생략 = 그대로, null = 셀러 조정 전부 해제(적용값 = 원본 bbox·배율 1.0)'
    LayoutAdjustPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      description: >
        [PRD v3.5.10 · 합의(FE 11-03) · 계약 확정·서버 구현 대기] 셀러 조정만 담는다(그 밖의 키는 422). 안쪽 키 생략 = 그 값 유지, 안쪽 키 null = 그 값만 해제, 빈 객체는 422.
        서버는 받은 절대값을 저장할 뿐 [+][−]·손잡이·옮기기를 해석하거나 다시 계산하지 않는다(blockPatch 「블록 배치」).
      properties:
        box:
          oneOf: [ { $ref: '#/components/schemas/LayoutBox' }, { type: 'null' } ]
          description: '셀러 배치 영역(절대값). null = 박스 조정 해제(원본 bbox). 네 값을 모두 보낸다'
        fontScale:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: >
            기준 글자 크기 대비 **절대 배율**(직전 배율에 곱하지 않는다). null = 배율 해제(적용값 1.0). 상한 없음(PRD J109③).
            1.0을 보내면 null과 같은 상태로 저장한다(2차 정규화 — FE 수용·AI 동의 11-04).
    LayoutBox:
      type: object
      required: [x, y, w, h]
      additionalProperties: false
      description: >
        [PRD v3.5.10 · 합의(FE 11-03) · 계약 확정·서버 구현 대기] 섹션 로컬 원본 px(섹션 왼쪽 위 = 0,0). 소수 그대로 저장·반환한다(서버가 자르거나 반올림하지 않는다).
        범위 0 ≤ x, 0 ≤ y, w > 0, h > 0, x + w ≤ 섹션 폭, y + h ≤ 섹션 높이 — 허용 오차 없이 십진수로 비교하고, 벗어나면 400(보정하지 않음).
      properties:
        x: { type: number, description: '범위(0 이상 등)는 위 설명대로 서버 업무 검증에서 400 — 스키마 형식 오류(422)로 다루지 않는다' }
        y: { type: number }
        w: { type: number }
        h: { type: number }
    LayoutAdjust:
      type: object
      required: [box, fontScale]
      description: '[PRD v3.5.10 · 합의(FE 11-03 · 정규화 FE·AI 11-04) · 계약 확정·서버 구현 대기] 저장된 셀러 조정(정규화 후). 둘 다 없으면 이 객체 대신 null.'
      properties:
        box:
          oneOf: [ { $ref: '#/components/schemas/LayoutBox' }, { type: 'null' } ]
          description: 'null = 박스 조정 없음(원본 bbox와 같은 값을 보낸 경우도 null로 저장 — 정규화)'
        fontScale: { type: [number, 'null'], description: 'null = 셀러 배율 없음(적용값 1.0). 1.0을 보낸 경우도 null로 저장(정규화)' }
    BlockCheck:
      type: object
      required: [state]
      description: >
        [PRD v3.5.10 · 합의(상태 5값·FE 처리 FE 11-03 · inputKey 외부 계약 AI 11-04) · 계약 확정·서버 구현 대기] 서버가 계산한 현재 입력의 규칙 검사 상태.
        "현재 입력"은 블록 revision이 아니라 검사의 의미 입력으로 판단한다 — 배치·배율만 바뀌면 상태가 바뀌지 않는다. FE 처리는 confirmReview 「규칙 검사 연결」.
      properties:
        inputKey:
          type: [string, 'null']
          description: >
            지금 보이는 결과(`signals`·실패)가 어느 검사 입력의 것인지 나타내는 키. 값은 불투명 문자열이다 — FE는 해석하지 않고 같은지만 비교한다.
            **외부 계약은 확정이다**(불투명 문자열·같은지만 비교·아래 null 조건·배치·배율·저장 revision 제외). 서버 안에서 키를 계산·직렬화하는 방식은 FE 계약에 영향을 주지 않는다.
            규칙 검사의 키는 블록 ID·원문·번역문·그 블록에 적용되는 고정 사전·용어집 선별 결과·규칙 버전 등 의미 입력으로 정하며, 배치·배율·저장 revision은 넣지 않는다(AI 11-04).
            보일 결과가 없으면(missing, 결과 없는 in_progress) null. outdated면 이전 입력의 키라 현재 입력의 키와 다르다.
        state:
          type: string
          enum: [settled, in_progress, failed, missing, outdated]
          description: >
            settled = 현재 입력 검사가 정상 종료(결과는 `signals`) / in_progress = 현재 입력 검사가 대기·실행 중 /
            failed = 현재 입력 검사가 최종 실패(재시도 소진) — 「⚠ 검사하지 못했습니다」, 2차에는 확인 없이 확정을 통과한다 /
            missing = 현재 입력 검사 기록이 없음(등록 전·취소됨) / outdated = 이전 입력의 결과만 있고 현재 입력 검사가 없음.
    BlockPatchResponse:
      type: object
      required: [rerenderTaskId]
      properties:
        block: { $ref: '#/components/schemas/TextBlock' }
        rerenderTaskId:
          type: [integer, 'null']
          format: int64
          description: >
            [PRD v3.5.10 · 계약 확정(FE 합의)] 항상 포함한다.
            숫자 = **이 요청으로 만든** 새 재렌더 task ID — /tasks로 추적하고 done이면 블록·/preview를 재조회한다.
            null = 이 요청으로 새 task를 만들지 않았다는 뜻일 뿐이다. 변경 없음(no-op)·렌더 완료·저장 실패의 판정 근거로 쓰지 않으며,
            null이어도 이미 추적 중인 pending/running task는 계속 추적한다. no-op 여부를 알리는 별도 필드는 두지 않는다.
    ReviewPreview:
      type: object
      description: >
        다폭 대응 검수 프리뷰 (계산값·미저장). scale=previewWidth/maxOriginalWidth · align=left.
        요청 파라미터는 jobId뿐(폭 파라미터 없음). 리사이즈 시 재요청하지 않고 FE가
        `transform: scale(표시폭/previewWidth)`로 축소한다(10차 #B — 리사이즈는 재조회 계기가 아니다).
        재조회 계기 = 구성 변경(SEC-03·CFM-02) · 추적 중인 task(저장 응답 `rerenderTaskId`·`render.attempt.taskId`) 완료 ·
        reviewPreview 렌더 판정 d·e의 한 번 재조회 · g의 제한 재조회(5초 간격 최대 12회) · 화면 재진입·사용자 새로고침.
        렌더 입력·지문·시도/결과 필드 규칙은 reviewPreview 설명 「렌더 입력과 시도·결과」.


        **[PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 키 제공 규칙** — `required`의 키는 상태와 관계없이 항상 낸다.
        값이 없는 상태는 키를 빼지 않고 null로 낸다 — nullable 필드: 섹션의 `excludedStage`·`originalUrl`·`renderedUrl`·`renderInput`·`inputFingerprint`·`inputError`·`render`,
        `render`의 `attempt`·`result`, `result.overflow`, `renderer.bundleId`. 키가 빠진 응답은 계약 위반이며 FE는 정상 상태로 해석하지 않는다.
        허용되는 null 조합은 reviewPreview 「입력 상태」와 `PreviewRender`에 적은 것뿐이다(정상 입력·입력 오류·입력 준비 중·N5 제외 섹션).
        필드 사이의 조합은 스키마 조건식이 아니라 설명으로 정한다 — 조건식은 문서 도구의 예시 검사가 분기를 따로 평가해 정상 예시를 거부한다.
      required: [maxOriginalWidth, originalHeight, previewWidth, previewHeight, scale, align, renderer, sections]
      properties:
        maxOriginalWidth: { type: integer }
        originalHeight: { type: integer }
        previewWidth:
          type: integer
          description: '서버 고정 상수 500 (설정값·server constant). 뷰포트 무관 좌표 기준 폭 — FE 코드젠이 변수로 오해하지 않도록 example 미지정.'
        previewHeight: { type: integer }
        scale: { type: number, format: float }
        align: { type: string, enum: [left] }
        renderer:
          $ref: '#/components/schemas/PreviewRenderer'
        sections:
          type: array
          items:
            type: object
            required: [id, sectionOrder, bucket, excludedStage, sourceImageId, width, displayTop, height, originalUrl, renderedUrl,
                       renderInput, inputFingerprint, inputError, render, signals, revision]
            properties:
              id: { type: integer, format: int64 }
              sectionOrder: { type: integer }
              bucket: { $ref: '#/components/schemas/SectionBucket' }
              excludedStage: { oneOf: [ { $ref: '#/components/schemas/ExcludedStage' }, { type: 'null' } ] }
              sourceImageId: { type: integer, format: int64 }
              width: { type: integer, description: '소속 원본 폭 (source_image.width 조인)' }
              displayTop: { type: integer }
              height: { type: integer }
              originalUrl: { type: [string, 'null'], format: uri, description: 'presigned' }
              renderedUrl:
                type: [string, 'null']
                format: uri
                description: >
                  presigned. [PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 포함 섹션에서는 표시 결과(`render.result`)의 이미지이고 `render.result`가 null이면 null이다
                  (화면은 reviewPreview 「표시 결과가 없을 때」대로 원본을 보인다).
                  새 시도가 진행 중이거나 실패해도 이전 성공 결과가 있으면 그 이미지를 낸다. 현재 입력에 대응하는지는 `render.isCurrent`로 본다.
                  N5 제외 섹션은 현행 그대로(제외 전 이미지가 있으면 낸다)이며 렌더 상태 판정에 쓰지 않는다.
              renderInput:
                oneOf: [ { $ref: '#/components/schemas/PreviewRenderInput' }, { type: 'null' } ]
                description: '[PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 서버에 저장된 현재 입력으로 만든 공통 렌더 입력. 정상 입력이면 값, N5 제외 섹션·입력 오류(`inputError`)·입력 준비 중이면 null — `inputFingerprint`와 항상 함께 있거나 함께 null이다.'
              inputFingerprint:
                type: [string, 'null']
                pattern: '^[0-9a-f]{64}$'
                description: >
                  [PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] `renderInput`에 대응하는 서버 렌더 입력 지문(SHA-256 16진수 소문자 64자) —
                  서버 미리보기 시도의 고정 입력 지문과 같은 계산이다(지문 B). null이면 `renderInput`도 null이고 비교하지 않는다(비교 불가).
                  들어가는 입력: 배경 key·sha256·출처, 블록별 revision·역할·번역문 해시·스타일 해시·적용 박스, 섹션 ⑦ 결과, 렌더러 식별자, 스타일 기본값 자료(설정·폰트 해시·규칙 버전).
                  presigned URL처럼 결과를 바꾸지 않는 값은 넣지 않는다. 직렬화는 RFC 8785(JCS)라 같은 수는 표기(10·10.0)와 무관하게 같은 지문이다.
              inputError:
                oneOf: [ { $ref: '#/components/schemas/PreviewInputError' }, { type: 'null' } ]
                description: '[PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 포함 섹션인데 저장 상태로 공통 렌더 입력을 만들 수 없을 때만 값이 있다(이때 `renderInput`·`inputFingerprint`는 null). 정상 입력·N5 제외 섹션·입력 준비 중은 null. 렌더 실행 실패(`render.attempt.status = failed`)와는 다른 것이다.'
              render:
                oneOf: [ { $ref: '#/components/schemas/PreviewRender' }, { type: 'null' } ]
                description: '[PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 현재 시도와 표시 결과. N5 제외 섹션이면 null, 포함 섹션이면 항상 값이 있다.'
              signals:
                type: array
                items: { $ref: '#/components/schemas/ReviewSignal' }
              revision: { type: integer, description: '[PRD v3.5.10 · 계약 확정(FE 11-03) · 구현 완료·서버 배포 대기] 섹션 revision(Section.revision과 같음) — N5 섹션 제외·복원 요청에 쓴다' }
    PreviewRenderer:
      type: object
      required: [rendererId, bundleId]
      description: >
        [PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 지금 서버가 미리보기를 그리는 렌더러. FE는 두 값을 파싱하지 않고 같은지만 본다.
        **현행 서버는 Pillow 조판**(`pillow-typeset/…`)이며 공통 렌더 번들(HTML/CSS)을 쓰지 않는다 — `bundleId = null`.
        Pillow 조판은 자간(`style.letterSpacingEm`)을 적용하지 않고 행간은 비율 1.2를 쓴다. 그래서 `renderInput`을 FE 공통 렌더 코드로 그린 로컬 미리보기는
        서버 이미지와 다를 수 있다 — 넘침·최신 판정은 서버 값(`render.result.overflow`·`render.isCurrent`)만 쓴다.
        **FE·서버 렌더 일치는 아직 아니다**: 서버 HTML/Playwright 공통 렌더 연결(번들 반입·측정 규칙 버전)은 2차 의존 작업으로 남아 있고, 연결되면 `rendererId`가 바뀌고 `bundleId`가 생긴다.
      properties:
        rendererId:
          type: string
          description: '서버 렌더·측정 실행 환경 식별자. 현행 값은 `pillow-typeset/2+pillow-<Pillow 버전>` 문자열 그대로다. FE는 파싱하지 않고 같은지 비교(`render.result.rendererId`)와 진단에만 쓴다(FE 11-05).'
        bundleId:
          type: [string, 'null']
          description: '공통 렌더 번들 식별자 — 서버가 공통 번들을 쓰지 않는 렌더러(현행 Pillow)면 null'
    PreviewRenderInput:
      type: object
      required: [section, blocks]
      description: >
        [PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 공통 렌더 입력(섹션 단위, 서버 저장값 기준). FE는 그대로 공통 렌더 코드에 넘기고,
        저장 전 편집값(번역문·박스·배율)만 로컬에서 바꿔 넣는다. 폰트 목록(파일 해시)은 번들 합의 뒤 추가한다.
      properties:
        section:
          type: object
          required: [id, width, height, background]
          properties:
            id: { type: integer, format: int64 }
            width: { type: integer, description: '섹션 원본 px' }
            height: { type: integer, description: '섹션 원본 px' }
            background:
              type: object
              required: [url, source, sha256]
              description: '그리는 바탕(완성 이미지 위에 다시 그리지 않는다)'
              properties:
                url: { type: string, format: uri, description: 'presigned(만료 5분). URL 재발급은 지문을 바꾸지 않는다' }
                source: { type: string, enum: [inpaint, original], description: 'inpaint = 글자를 지운 배경, original = 인페인트 실패·생략으로 원본 위에 그림' }
                sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: '배경 파일 내용 해시. 서버가 모르면 null' }
        blocks:
          type: array
          description: '렌더 대상 블록만(라벨·로고·빈 원문·빈 번역문 제외). 0개면 빈 배열이고 결과 이미지는 배경만 그린 이미지다 — 상태 판정의 예외가 아니다.'
          items: { $ref: '#/components/schemas/PreviewRenderBlock' }
    PreviewRenderBlock:
      type: object
      required: [blockId, revision, text, box, style]
      description: '[PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 렌더 대상 블록 하나의 공통 렌더 입력'
      properties:
        blockId: { type: integer, format: int64 }
        revision: { type: integer }
        text: { type: string, description: '서버에 저장된 번역문' }
        box:
          type: object
          required: [x, y, w, h]
          description: '적용 박스 = 셀러 박스가 있으면 그것, 없으면 원본 bbox. 섹션 로컬 원본 px, 저장값 그대로(소수 절삭 없음). 렌더러에 실제로 넘기는 값이다.'
          properties:
            x: { type: number }
            y: { type: number }
            w: { type: number }
            h: { type: number }
        style:
          type: object
          additionalProperties: true
          required: [fontFamily, fontWeight, fontSizePx, fontScale, fontColor, align, letterSpacingEm, lineHeightRatio]
          description: >
            공통 렌더 코드에 넘기는 최소 스타일(AI A1 — 8키). 서버가 ⑦ 측정값·승인 역할 기본값(측정 NULL·⑦ 실패 항목만)으로 만든다(be-handoff 6.3 적용 규칙과 같은 함수).
            null을 쓰지 않는다 — 만들 수 없으면 그 섹션은 `inputError`다. 최종 글자 크기 = `fontSizePx × fontScale`을 공통 렌더 코드가 한 번만 계산한다.
          properties:
            fontFamily: { type: string, description: '예 Pretendard' }
            fontWeight: { type: integer, minimum: 100, maximum: 900 }
            fontSizePx: { type: number, exclusiveMinimum: 0, description: '기준 글자 크기(배율 적용 전, 섹션 원본 px) — 측정값 또는 역할 기본값' }
            fontScale: { type: number, exclusiveMinimum: 0, description: '적용 배율. 셀러 배율 저장 전이라 현재는 항상 1.0' }
            fontColor: { type: string, pattern: '^#[0-9A-F]{6}$', description: "글자색 — 대문자 '#RRGGBB'(FE 11-05 확정). 서버는 ⑦ 측정값·역할 기본값을 이 형식으로 검증하고, 소문자 등 형식 밖 측정값은 고치지 않고 `inputError` STYLE_RESULT_INVALID로 낸다" }
            align: { type: string, description: 'left | center | right' }
            letterSpacingEm: { type: number, description: '자간(글자 크기 대비 비율). 현행 서버 Pillow 조판은 적용하지 않는다(PreviewRenderer)' }
            lineHeightRatio: { type: number, exclusiveMinimum: 0, description: '행간 비율(승인값 1.2)' }
    PreviewInputError:
      type: object
      required: [code, blockIds]
      description: >
        [PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기 · 코드 역할 AI 동의 11-04] 공통 렌더 입력 구성 실패. `code`는 task `errorCode`와 같은 값 공간이며 HTTP `error.code`가 아니다.
        다시 시도해도 풀리지 않는다(입력·자료를 고쳐야 함). 한 섹션에 여럿이면 `STYLE_DEFAULTS_UNAPPROVED` → `RENDER_INPUT_INVALID` → `STYLE_RESULT_INVALID` 순으로 하나를 낸다(BE 해석).
        `STYLE_DEFAULTS_UNAPPROVED` = 승인 스타일 설정·폰트 자산을 쓸 수 없음 / `STYLE_RESULT_INVALID` = ⑦ 스타일 결과의 계약 위반(⑦ 상태와 style의 모순, 형식 밖 값, 알 수 없는 역할) /
        `RENDER_INPUT_INVALID` = BE가 구성한 값의 오류 — 적용 박스를 읽을 수 없음(bbox NULL·좌표 키 누락·수가 아닌 값·배치 조정값 형식 오류), w·h ≤ 0, 섹션 밖, 섹션 크기·원본 이미지 없음(이때 `blockIds`는 빈 배열).
        입력 준비 중(N4 — 인페인팅·스타일·번역 단계 진행 중)은 오류가 아니므로 이 필드를 쓰지 않는다.
      properties:
        code: { type: string }
        blockIds:
          type: array
          items: { type: integer, format: int64 }
          description: '입력을 만들 수 없는 블록(섹션 단위 자료 문제면 빈 배열)'
    PreviewRender:
      type: object
      required: [attempt, result, isCurrent]
      description: >
        [PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 현재 시도(attempt)와 표시 결과(result)를 나눈다. 새 시도가 진행 중이거나 실패해도 이전 성공 결과를 result로 낸다.
        `isCurrent=true`면 result가 있고 `result.overflow`는 객체, false면 result가 null이거나 `result.overflow`가 null이다.
        `isCurrent=false`인 이전 결과는 표시할 수 있지만 최신 결과로 인정하지 않고 넘침도 쓰지 않는다. 입력 상태(입력 준비 중·입력 오류)와 따로 판단한다.
      properties:
        attempt:
          oneOf: [ { $ref: '#/components/schemas/PreviewRenderAttempt' }, { type: 'null' } ]
          description: '이 섹션의 현재 미리보기 시도. null = 현재 시도 없음(N4 입력 준비 중, 시도를 확보하지 못한 섹션 등)'
        result:
          oneOf: [ { $ref: '#/components/schemas/PreviewRenderResult' }, { type: 'null' } ]
          description: >
            지금 표시하는 이미지를 실제로 만든 채택 기록. 최신 성공 시도를 고르지 않는다 — 현재 분석에 연결된 하류 실행의 미리보기 시도이고, 그 결과가 채택됐고,
            채택된 이미지의 키가 지금 섹션 이미지와 같을 때만 낸다. 근거가 없으면 null(renderedUrl도 null).
        isCurrent:
          type: boolean
          description: '서버 계산 `result != null && result.inputFingerprint == inputFingerprint`(같은 응답 안). 조회 시점 서버 입력 기준이며 FE의 미저장 편집과 같다는 뜻이 아니다.'
    PreviewRenderAttempt:
      type: object
      required: [taskId, status, errorCode, retryable]
      description: '[PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 섹션의 현재 미리보기 시도'
      properties:
        taskId: { type: integer, format: int64, description: '저장 응답의 rerenderTaskId와 같은 번호 체계' }
        status: { $ref: '#/components/schemas/RenderStatus' }
        errorCode: { type: [string, 'null'], description: 'failed일 때 오류 코드(예: PREVIEW_FAILED·STYLE_DEFAULTS_UNAPPROVED). 그 밖에는 null' }
        retryable: { type: boolean, description: 'failed이고 true면 POST /jobs/{jobId}/tasks/{taskId}/retry 로 다시 시도할 수 있다(/tasks의 retryable과 같은 판정)' }
    PreviewRenderResult:
      type: object
      required: [taskId, inputFingerprint, rendererId, overflow]
      description: '[PRD v3.5.10 · 계약 확정(FE 11-05) · 구현 완료·서버 배포 대기] 지금 표시하는 이미지를 만든 채택 결과'
      properties:
        taskId: { type: integer, format: int64, description: '이 결과를 만든 시도' }
        inputFingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: '이 결과를 만든 입력의 지문(섹션 `inputFingerprint`와 같은 계산)' }
        rendererId: { type: string, description: '이 결과를 그린 렌더러(채택 기록의 구현 버전)' }
        overflow:
          type: [object, 'null']
          additionalProperties: { type: boolean }
          description: >
            블록 ID(문자열) → 넘침. 넘침 판정의 정본. `isCurrent`가 true일 때만 값을 싣고 false면 null — 이전 측정값을 최신 넘침으로 쓰지 않는다.
            렌더 대상 블록이 0개인 섹션의 현재 결과는 빈 객체 `{}`다.
    ConfirmRequest:
      type: object
      description: >
        acknowledgedWarnings는 개수가 아니라 식별자. 필수 확인 대상 = 포함(include) 섹션 블록의 translation_failed.
        서버는 받은 목록 중 필수 확인 대상만 골라 서버의 미해결 필수 경고 집합과 비교하고, 다르면 409 INVALID_STATE
        (error.details.warnings = 서버 집합). 그 밖의 코드(width_overflow 등)·제외 섹션 블록은 보내도 무시한다 —
        화면 신호 전부를 보내도 된다. 넘침 경고는 표시만 하고 확정을 막지 않는다(2026-10-14 결정).


        **[PRD v3.5.10 · 계약 확정] 2차 확인 규칙**

        - 2차 필수 확인 대상은 `translation_failed`뿐이다 — 현행. `mandatory_term_unapplied`는 확인 대상으로 세지 않는다(PRD F-CFM-09 I열 — PM 재확인 11-04) — 현행.
          확인 대상에서 빼도 강제 용어 신호는 그대로 남고 화면에도 보인다.

        - `translation_failed`의 뜻(현행 서버 기준): 그 섹션의 현재 번역 시도가 failed이고 블록의 번역문이 NULL이며 셀러가 손대지 않은(`blockStatus = machine`) 블록이다.
          번역 재시도가 그 블록을 채우거나 셀러가 번역문을 저장하면(빈 문자열 저장 포함) 사라진다 — 처리 실패이며, 셀러가 일부러 비운 빈 번역문과 다르다.
          재시도가 다시 실패하면 같은 블록에 같은 코드가 새 실패로 다시 나온다 — 코드만으로는 과거 확인이 어느 실패에 대한 것인지 구분할 수 없다.

        - **확인 기준 `taskId` — 합의(FE 11-04) · 계약 확정·서버 구현 대기**: 확인 항목에 화면이 본 `ReviewSignal.taskId`(실패 번역 시도)를 함께 보낸다. 선택 필드다.
          값이 있으면 서버는 그 경고가 지금도 유효한지(현재 미해결 집합에 있는지)와 `taskId`가 지금 그 블록을 실패시킨 현재 번역 시도인지를 함께 검증하고,
          시도가 다르면 409 INVALID_STATE `details.reason: acknowledgement_outdated`(`details.warnings` = 서버 집합). 값이 없으면 지금처럼 `{blockId, code}`로 판정한다.
          필수로 바꾸는 시점은 미결이다(FE 적용 확인 뒤 배포 일정으로 정한다).

        - 블록 하나에 같은 코드의 경고가 여럿이어도 블록·코드 단위로 한 번 확인한다 — 현행.

        - 확인한 목록은 감사 로그에 블록 ID·코드·확인 기준(`taskId`)·revision으로 남긴다(PM C3) — 계약 확정·서버 구현 대기.

        - 집합이 다르면 409 INVALID_STATE(`details.warnings` = 서버 집합) — 현행. 여기에 `details.reason: acknowledgement_mismatch`를 붙이는 것은 계약 확정·서버 구현 대기.
      properties:
        acknowledgedWarnings:
          type: array
          items:
            type: object
            properties:
              blockId: { type: integer, format: int64 }
              code: { $ref: '#/components/schemas/SignalCode' }
              taskId:
                type: integer
                format: int64
                description: '[PRD v3.5.10 · 합의(FE 11-04) · 계약 확정·서버 구현 대기] translation_failed 확인의 기준 — 화면이 본 실패 번역 시도(`ReviewSignal.taskId`). 선택 필드(필수화 시점 미결). 지금 그 블록을 실패시킨 현재 번역 시도와 다르면 409 acknowledgement_outdated'

