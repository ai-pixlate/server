  /jobs/{jobId}/confirm:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [N5 Review]
      summary: 검수 확정 = N5→N6 🟢9월
      operationId: confirmReview
      x-screen: 'N5'
      x-source: API-CFM-04
      description: >
        **2차 상태**(PRD v3.5.10 기준)

        - 계약 확정·서버 구현 대기: 규칙 검사 연결·검사 중 확정 거절(409 `check_not_settled`)·검사 최종 실패 통과 · `translation_failed` 확인 기준 `taskId`(선택 필드) · 확인 기록 감사 로그

        - 현행: 재렌더 중 확정 허용·넘침 경고 비차단 · 필수 확인 = `translation_failed`(`mandatory_term_unapplied` 제외) · 섹션 실행 실패의 출력(인페인팅 실패·이전 성공 이미지가 있는 N5 재렌더 실패)

        - 화면: 미저장 번역문 확인창 · 표시 결과 없이 렌더 시도가 실패한 섹션의 N5 원본 표시

        - 남은 계약 항목: N6 출력 정책 P14·P15(「섹션 실행 실패의 출력」)


        전 섹션 제외 차단. acknowledgedWarnings 정합 아니면 409 INVALID_STATE(+현재 경고 목록).
        job→review/N6. confirm 트랜잭션에서 렌더 task(job_async_task)를 서버가 자동 등록 —
        FE는 N6에서 JOB-05 폴링만(A4·Q9 채택). 수동 재렌더는 FIN-01 POST /render 유지. 🟢9월.

        **[PRD v3.5.10 · 계약 확정] 2차(11/6) 확정 규칙**
        - 미리보기 재렌더가 진행 중이어도 확정을 허용한다 — 현행(진행 중 재렌더는 취소하고 N6가 다시 그린다).
        - **검사 중 확정 거절**([PRD v3.5.10 · 합의(PM 10-29 · 409 구분 FE 11-04) · 계약 확정·서버 구현 대기]) — 확정 대상 번역문에 필요한 규칙 검사가 끝나지 않았으면
          서버가 409 INVALID_STATE `details.reason: check_not_settled`로 확정을 거절하고, 화면은 같은 동안 [저장하러 가기]를 비활성으로 둔다(F-CFM-09 J110⑥). 아래 「규칙 검사 연결」.
        - 검사가 최종 실패한 블록(「⚠ 검사하지 못했습니다」)은 추가 확인 없이 확정을 통과한다 — 계약 확정·서버 구현 대기(규칙 검사 연결과 함께).
        - 저장되지 않은 번역문이 남아 있을 때 개수를 안내하는 확인창 — 화면(FE). 검사 중 거절·비활성을 해제하지 않는다.
        - 블록 넘침 경고는 표시만 하고 확정을 막지 않는다 — 현행.
        - 필수 확인 대상은 `translation_failed`다 — 현행. `mandatory_term_unapplied`는 확인 대상이 아니다 — 현행. 확인 기준 `taskId`·감사 로그는 ConfirmRequest 설명.


        **[PRD v3.5.10 · 계약 확정·서버 구현 대기] 규칙 검사 연결**(실행계획 BE 6번 · 2차 J 묶음)

        - 정책(PM 확정): 검사 중에는 확정할 수 없고 화면도 비활성이다. 최종 실패는 「⚠ 검사하지 못했습니다」로 안내하고 2차에는 확인 없이 확정을 통과한다.
          **글자가 바뀌지 않은 박스·배율 변경과 섹션 제외·복원은 규제·강제 용어 검사를 다시 실행하지 않는다**(PM 11-04).

        - 활성 검사(2차 — AI 회신): 규칙 검사(`run_text_check`)만. 결과는 블록별 flag이고 화면에는 기존 `signals`(SignalCode)로 낸다.

        - 등록 단위: 섹션(검사 가능한 블록 전체 — 포함 섹션·제외되지 않은 블록·비공백 원문·비공백 번역문).

        - **등록 보장(원래 흐름)** — 아래 흐름이 같은 트랜잭션에서 등록하므로 정상 흐름에서 `missing`·`outdated`는 생기지 않는다:
          ① N4 번역 채택 ② 번역 재시도 채택 ③ N5 번역문이 실제로 바뀐 저장(이전 시도 대체)
          ④ N5 섹션 복원 — **재실행이 아니라 유효한 결과의 확보**다. 현재 입력의 검사 시도가 있으면(완료·최종 실패·대기·실행 중 모두) 그대로 쓰고,
            없을 때만(제외해 둔 사이 검사를 켰거나 규칙 버전이 바뀐 경우 등 — 유효한 결과가 없는 경우) 새 시도를 등록한다(sectionPatch 설명).
          ⑤ 배포 — 검사를 켜는 배포와 검사 규칙 구현 버전을 바꾸는 배포에서 대상 N5 작업에 일괄 등록(배포 절차 단계).
          등록하지 않는 경우: 글자가 바뀌지 않은 박스·배율 저장, 같은 값 저장, 섹션 제외, 유효한 결과가 있는 섹션의 복원.

        - **보조 복구 경로**: 그래도 `missing`·`outdated`가 남았으면(등록 실패·누락) 확정 요청이 그 블록의 검사를 등록하고 확정은 거절한다(아래 「확정 조건」). 원래 흐름을 대신하지 않는다.

        - 배치만 바뀐 경우: 검사 입력이 같으므로 진행 중 검사는 그대로 채택되고, 끝난 결과도 유효하다(`settled` 유지).
          번역문이 바뀐 경우: 새 시도가 이전 시도를 대체한다. 이전 결과는 `outdated`, 새 결과를 채택하면 `settled`.

        - **블록 상태와 FE 처리 — 계약 확정(FE 동의, 11-03)**(블록 `check.state` — 검사 대상이 아니면 null). 확정 버튼은 포함 섹션 검사 대상 블록의 상태로 정한다:
          settled = 결과(`signals`) 표시. 모든 블록이 settled·failed면 버튼 활성 /
          in_progress = 「검사 중」 표시, 버튼 **비활성**(PRD J110⑥). /tasks(taskType=verify, unitType=section)를 기존 2초 폴링으로 추적하고 끝나면 /blocks 재조회 /
          failed = 「⚠ 검사하지 못했습니다」, 버튼 활성 — 2차에는 확인 없이 확정을 통과한다 /
          missing·outdated = 「검사 준비 중」 표시, 버튼 **활성으로 둔다**(정상 흐름에서는 생기지 않는 상태). 화면 진입·재조회 때 그대로면 확정 요청이 보조 복구 경로가 되어
          서버가 검사를 등록하고 409 `check_not_settled`로 답한다 → 그 블록이 in_progress가 되고 버튼이 비활성으로 바뀐다. 버튼을 막아 복구 요청이 나가지 않는 일이 없게 한다.

        - **확정 조건**: 포함 섹션의 검사 대상 블록이 모두 `settled`·`failed`이면 통과한다(2차에는 `failed`도 확인 없이 통과 — 거절은 검사 중·미종료만).
          그 밖의 블록이 있으면 409 INVALID_STATE `details.reason: check_not_settled`, `details.blocks: [{blockId, state}]`, 이 요청이 검사를 등록한 블록 `details.registeredBlockIds`(FE 확정 — 등록으로 생긴 409를 다른 충돌과 구분).
          `missing`·`outdated`는 같은 요청에서 서버가 검사를 등록한다 — 등록은 커밋하고 확정만 거절하므로, FE는 그 블록이 `in_progress`가 된 것을 보고 끝나기를 기다린다.


        **[PRD v3.5.10 · 계약 확정(PM 11-04)] 섹션 실행 실패의 출력**

        - 인페인팅 실패 섹션 = 원본 위에 번역문 — 현행(렌더 입력 배경 `source = original`).

        - 이전 성공 이미지가 있는 N5 재렌더 실패 섹션 = N6에서 **확정된 번역문으로 다시 렌더**한다 — 이전 이미지나 원본으로 대체하지 않는다. N6 재렌더도 실패하면 N6 렌더 실패 화면으로 간다.
          N5 미리보기 갱신 실패 자체는 확정 때 확인 대상이 아니다. 현행 N6 최종 렌더는 포함 섹션 전체를 확정 번역문으로 다시 그리므로 현행과 같다 — 현행.

        - 표시 결과 없이 렌더 시도가 실패한 섹션(`render.result = null`·`render.attempt.status = failed`)은 N5에서 원본 + 미리보기 생성 실패를 보인다 — 화면(reviewPreview 「표시 결과가 없을 때」).
          `renderedUrl: null`만으로 실패를 단정하지 않고 대기와 실패를 구분하며, 원본 위에 번역 텍스트를 다시 합성하지 않는다.
          **이 표시 조건은 N4 렌더 실패 판별이 아니다** — 성공 이력이 없는 N5 재렌더 실패도 같은 모양이므로, 응답의 이 조합만으로 N4 렌더 실패로 단정하지 않는다.

        - **N6 출력 정책 미결 — 이 명세에 싣지 않는다**: P14 = N4 렌더 실패 섹션의 N6 원본 사용과 그 적용 차수 /
          P15 = 성공 이력이 없지만 N4 렌더 실패로 단정하지 않는 섹션의 확인·N6 출력(`render_failed` 판별 기준 포함).
          확정 전까지 이 섹션들의 N6 처리는 계약으로 보장하지 않는다(현행 서버는 포함 섹션 전체를 확정 번역문으로 다시 그린다).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRequest' }
            examples:
              acknowledgeTranslationFailed:
                summary: '(가상 값 · taskId는 계약 확정·서버 구현 대기) 번역 실패 확인 — 화면이 본 실패 번역 시도 taskId를 함께 보냄'
                description: >
                  블록 303은 번역 실패(translation_failed). `taskId`(선택 필드)를 보내면 서버는 그것이 지금 그 블록을 실패시킨 현재 번역 시도인지 대조하고, 다르면 409 acknowledgement_outdated다.
                  mandatory_term_unapplied·width_overflow는 보내도 무시된다(확인 대상 아님, 신호는 그대로 보인다).
                value:
                  acknowledgedWarnings:
                    - { blockId: 303, code: translation_failed, taskId: 9120 }
      responses:
        '200':
          description: 'N6 진입'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            상태 충돌 — 전 섹션 제외(ALL_SECTIONS_EXCLUDED · 현행) · 경고 확인 불일치(INVALID_STATE `details.warnings` · 현행, reason `acknowledgement_mismatch`·`acknowledgement_outdated`는 계약 확정·서버 구현 대기) ·
            검사 미종료(INVALID_STATE `details.reason: check_not_settled` · 계약 확정·서버 구현 대기)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                checkNotSettled:
                  summary: '(가상 값 · 계약 확정·서버 구현 대기) 검사가 끝나지 않은 블록이 있어 확정 거절'
                  description: >
                    블록 301은 검사 진행 중, 302는 이전 입력 결과만 있었다. 서버는 302의 검사를 이 요청에서 등록(커밋)했으므로 이후 조회에서 302는 in_progress다.
                    FE는 [저장하러 가기]를 비활성으로 두고 검사가 끝난 뒤 다시 확정한다.
