      properties:
        id:
          type: integer
          format: int64
        jobId:
          type: [integer, 'null']
          format: int64
        sellerId:
          type: integer
          format: int64
        consentType:
          type: string
        consentedAt:
          type: string
          format: date-time
    Brand:
