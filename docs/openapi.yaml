      description: >
        excludedStage는 서버가 currentStep으로 기록. N5에서 excludedStage=N3 섹션 복원 시 409 INVALID_STATE. 🟢9월.

        **[PRD v3.5.10 · 계약 확정 · 구현 대기] 복원(restore)의 의미** — N3 [번역하기]·N5 [되돌리기]·N5 Undo 모두 같다:

        - 직접 제외(`user_manual`)의 복원 = **제외 전 상태로**. 원래 포함 섹션이면 `exclusionReason=null`(새로운 「되살린 섹션」 배지를 붙이지 않으며 기존 판정·경고 배지는 보존 — PRD H106),
