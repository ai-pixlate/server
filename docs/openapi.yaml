components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito 발급 JWT (F-ACC-01). 만료 토큰 호출 시 401.
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BrandId:
      name: brandId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Unauthorized:
      description: 인증 실패 / 토큰 만료 (F-ACC-01)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 권한 없음 (F-ACC-03)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        details:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
          description: 초
    Seller:
      description: ERD seller
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
