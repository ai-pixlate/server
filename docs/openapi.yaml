  schemas:
    # ===== 공통 =====
    Error:
      type: object
      description: '공통 에러 래퍼 (전 엔드포인트 4xx/5xx). FE는 `error.code`로 분기.'
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, traceId]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR       # 400
                - UNAUTHORIZED           # 401
                - TOKEN_EXPIRED          # 401 (retryable: refresh 후)
                - NOT_FOUND              # 404 (미존재 + 남의 리소스 소유 위반)
                - DUPLICATE              # 409
                - UNSUPPORTED_FORMAT     # 415
                - FILE_TOO_LARGE         # 413
                - INVALID_STATE          # 409
                - ALL_SECTIONS_EXCLUDED  # 409
                - RETRY_NOT_ALLOWED      # 409
                - REVISION_CONFLICT      # 409
                - CSV_SCHEMA_MISMATCH    # 422
                - RATE_LIMITED           # 429 (retryable)
                - INTERNAL_ERROR         # 500 (retryable)
                - SERVICE_UNAVAILABLE    # 503 (retryable)
              description: >
                HTTP `error.code` 15종 enum (근거: 인벤토리 §14-1 · 회신문 종합 1-C-5 · 10차 #D).
                코드 네임스페이스 3종은 서로 다른 값 공간이며 섞지 않는다 —
                ① HTTP `error.code`(이 15종 · 4xx/5xx · 이 래퍼) /
                ② task `errorCode`(비동기 task 실패 · 자유 텍스트 · HTTP 200 · JOB-05 items[].errorCode) /
                ③ signal `code`(검수 신호 · 계약 §6 · CFM-01 signals[].code).
                번역·렌더 실패는 HTTP error.code가 아니라 task/signal로 전달된다.
                # 403 FORBIDDEN은 /admin/** 역할 권한 전용(ADM=12월)이라 9월 15종에서 제외 — ADM 활성 시 추가 예정.
            message: { type: string }
            retryable: { type: boolean, description: '재시도 가능 여부(FE 재시도 버튼 노출 판단)' }
            details:
              type: [object, 'null']
              additionalProperties: true
              description: >
                코드별 부가 정보 (예 REVISION_CONFLICT → { current }).
                [PRD v3.5.10 · 구현 대기] **409 구분** — `error.code` + `details.reason` 조합(15종 enum은 늘리지 않는다). 아래 목록의 조합과 `check_not_settled`의 `registeredBlockIds`는
                **FE 확정(11-04)**. 이후 새로 제안하는 사유는 일괄 승인이 아니라 따로 확인한다(`boundary_check_in_progress`·`boundary_check_missing`은 그런 후보다):
                REVISION_CONFLICT(reason 없음) → `details.current` 최신 대상으로 교체 /
                DUPLICATE `idempotency_key_reused` → 같은 키를 다른 요청에 썼음(FE 키 관리 오류) — 재조회 /
                INVALID_STATE `job_not_editable` → 작업이 그 단계가 아님(N5 아님·취소 등) — 작업 재조회 /
                INVALID_STATE `not_render_target` → 그리지 않는 블록의 배치 저장 /
                INVALID_STATE `n3_excluded_section` → N5에서 N3 제외 섹션 복원 /
                INVALID_STATE `restore_basis_missing` → 최초 판정 기록 없는 직접 제외 섹션 복원(PM-R8 결정 전) /
                INVALID_STATE `check_not_settled` → 검사 미종료, `details.blocks: [{blockId, state}]`, 이 요청이 검사를 새로 등록한 블록은 `details.registeredBlockIds` — 검사 상태 재조회 /
                INVALID_STATE `acknowledgement_mismatch` → 확인 목록이 서버의 미해결 집합과 다름, `details.warnings`(·`details.sections`) = 서버 집합 — 확인창 갱신 /
                INVALID_STATE `acknowledgement_outdated` → 확인 기준(`inputKey`·섹션 실패 task)이 현재와 다름, `details.warnings` = 서버 집합 — 최신 검사 결과 재조회 후 확인창 갱신 /
                INVALID_STATE `image_boundary_exceeded` → 이미지 경계 이탈로 확정 차단(Q-07, 확인으로 풀 수 없음), `details.blocks`, `details.basis`(current = 현재 입력 판정 · last_completed = 현재 판정이 없거나 실패해 마지막 완료 판정) /
                INVALID_STATE `boundary_check_in_progress`(후보) → 현재 입력의 경계 판정 진행 중 / `boundary_check_missing`(후보 — PM 미결) → 완료 판정이 한 번도 없음 /
                INVALID_STATE `legacy_renderer` → 렌더러 전환 이전 작업 차단(PM-R0 결정 뒤) /
                ALL_SECTIONS_EXCLUDED·RETRY_NOT_ALLOWED → 현행 그대로.
                현행 서버의 INVALID_STATE는 `details.reason`이 없다 — 추가 필드라 호환되며, reason이 없으면 FE는 일반 상태 오류로 처리한다.
                요청 형식 오류(422 VALIDATION_ERROR — 현행 FastAPI 처리)와 업무 검증 실패(400 VALIDATION_ERROR)는 둘 다 `details.fields: [{loc, msg}]`.
            traceId: { type: string, description: '서버 추적 ID' }
    AcceptedTask:
      type: object
      description: 비동기 트리거 202 응답. 진행은 GET /jobs/{jobId}/tasks 폴링(2초).
      properties:
        jobId: { type: integer, format: int64 }
        taskId: { type: [integer, 'null'], format: int64, description: '등록된 task ID(renderTaskId·rerenderTaskId 등)' }

    # ===== enum (CHECK_enum_허용값 v3.4.1 · ERD V5 그대로) =====
    JobStatus:
      type: string
      description: 'DB job.status (6종)'
      enum: [draft, processing, review, done, failed, archived]
    JobStep:
      type: string
      enum: [N1, N2, N3, N4, N5, N6]
    UserFacingStatus:
      type: string
      description: '사용자 노출 상태 영문 enum 8종 (GENERATED · 한글은 FE i18n gloss, API 값 아님)'
      enum: [draft, analyzing, section_review, translating, reviewing, done, failed, archived]
    SpecType:
      type: string
      enum: [original, site, custom]
      description: '9월은 original 고정'
    RegulatoryClass:
      type: string
      description: '셀러 선택값 (job.regulatory_class)'
      enum: [cosmetic, otc, combination, unknown]
    ImageContinuity:
      type: string
      description: 'job.image_type — 입력 연속성 축 (12월 분기)'
      enum: [multi_section, single]
    SourceImageType:
      type: string
      description: 'source_image.image_type — 입력 유형(연속성 축과 별개)'
      enum: [detail, thumbnail]
    SectionBucket:
      type: string
      enum: [include, exclude]
    ExclusionReason:
      type: string
      enum: [auto_regulatory, auto_channel, auto_local, auto_local_failed, user_manual, restored_by_user]
    ExcludedStage:
      type: string
      enum: [N3, N5]
    InpaintStatus:
      type: string
      enum: [pending, running, done, failed]
    WarningBadge:
      type: string
      enum: [processing_failed, quality_warning]
    BlockRole:
      type: string
      enum: [title, body, caption, price, caution, product_label]
    BlockStatus:
      type: string
      enum: [machine, edited]
    VerdictStatus:
      type: string
      description: 'section_verdict.verdict_status — 판정행 5값 (allowed·cultural은 행 미생성)'
      enum: [regulated, conditional, irrelevant, needs_fix, policy]
    VerdictType:
      type: string
      description: '파생(GENERATED) 배지 6종 — verdict_status(+대체표현 유무)에서 계산. 읽기 전용.'
      enum: [regulatory, regulatory_replaceable, regulatory_conditional, local_irrelevant, needs_fix, channel_policy]
    TaskType:
      type: string
      enum: [ocr, section, inpaint, translate, verify, render]
    TaskUnitType:
      type: string
      description: 'unit_id가 가리키는 대상'
      enum: [job, source_image, section, text_block]
    TaskStatus:
      type: string
      enum: [pending, running, done, failed, cancelled]
    TaskUiStatus:
      type: string
      description: 'JOB-05 파생 표시 상태'
      enum: [waiting, retrying, running, done, failed]
    UsageType:
      type: string
      enum: [detail, thumbnail_main, thumbnail_sub]
    RenderStatus:
      type: string
      enum: [pending, running, done, failed]
    SignalCode:
      type: string
      description: >
        확인 필요 신호 코드 (원천 10 · 화면 8). admin 2종(low_ocr_confidence·inpaint_residual_flag)은
        서버가 셀러 응답 signals[]에서 제외. 이 값 공간은 HTTP `error.code`와 다르다.
        [PRD v3.5.10 · BE 계약안 · AI·FE 확인] `check_failed` = 현재 입력의 번역문 검사가 최종 실패한 블록(「⚠ 검사하지 못했습니다」, PRD F-CFM-09 ②) — 3.4.2에 없는 후보 값이다.
        규칙 검사는 금지(regulated)와 조건부(conditional) 매칭을 모두 regulatory flag로 남기되 판정 상태·사전 ID·위치를 따로 보존한다(AI A9).
        **확정(FE·PM 11-04)**: 공통 코드 `prohibited_expression`에 판정 구분 `ReviewSignal.regulationVerdict`(regulated | conditional)를 더한다 — 필드 이름·값은 BE 계약안.
        표시명은 regulated = 「금지 표현」, conditional = 「조건부 규제」이고, 조건부에는 사전의 허용 조건을 `reason`으로 준다.
      enum:
        - prohibited_expression
        - mandatory_term_unapplied
        - translation_failed
        - empty_block
        - logo_match_failed
        - width_overflow
        - low_ocr_confidence
        - inpaint_residual_flag
        - check_failed

    # ===== 파생·공통 DTO =====
    ReviewSignal:
      type: object
      description: '서버가 여러 소스를 조합해 만드는 파생 DTO(테이블 아님). Block/Section 객체에 signals[]로 중첩.'
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/SignalCode' }
        reason: { type: [string, 'null'] }
        basisArticle: { type: [string, 'null'], description: '조문 식별자만 (전문 미수록, OI-58)' }
        evidenceUrl: { type: [string, 'null'], format: uri, description: 'presigned, 만료 5분' }
        taskId: { type: [integer, 'null'], format: int64, description: 'translation_failed 신호에 동봉 — 이 블록을 실패시킨 현재 번역 시도' }
        regulationVerdict:
          type: [string, 'null']
          enum: [regulated, conditional, null]
          description: >
            [PRD v3.5.10 · BE 계약안 · 구현 대기] `prohibited_expression`의 판정 구분(FE·PM 11-04 — 공통 코드 + 판정 구분 방식 확정, 필드 이름·값은 계약안).
            regulated = 「금지 표현」, conditional = 「조건부 규제」(사전의 허용 조건을 `reason`에). AI 규칙 검사 flag의 사전 판정 상태(`dictionary_verdict_status`)에서 채운다. 다른 코드에서는 null
        retryable: { type: [boolean, 'null'], description: 'translation_failed 신호에 동봉' }
    AutoAdjust:
      type: object
      description: >
        자동 조정 결과. DB JSONB(`font_scale`·`line_break_applied`)를 응답 시
        `fontScale`·`lineBreakApplied`로 매핑한다(직렬화 계층 · 저장값 불변 · 10차 #A).
      properties:
        fontScale: { type: number }
        lineBreakApplied: { type: boolean }
    Bbox:
      type: object
      description: '{x,y,w,h} px · 원점 좌상단'
      properties:
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }

    # ===== Auth =====
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      description: 'access 토큰은 본문, refresh는 Set-Cookie(HttpOnly·Secure·SameSite=Strict·Path=/auth).'
      properties:
        accessToken: { type: string }
        seller: { $ref: '#/components/schemas/Seller' }
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
    Seller:
      type: object
      description: 'ERD seller'
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        accountType: { type: string, enum: [individual, business] }
        createdAt: { type: string, format: date-time }
    ConsentRequest:
      type: object
      required: [agreed]
      properties:
        agreed: { type: boolean, description: '책임 한계 동의(true)' }
    ConsentResponse:
      type: object
      description: '(3.4.2 계약: consentId를 JOB-02 바디에 넣어 작업과 연결) [PRD v3.5.10] 사용하지 않음 — consentCreate 설명'
      properties:
        consentId: { type: integer, format: int64 }
        consentType: { type: string }
        consentedAt: { type: string, format: date-time }

    # ===== Brand =====
    Brand:
      type: object
      description: 'ERD brand'
      properties:
        id: { type: integer, format: int64 }
        nameKo: { type: string }
        nameEn: { type: string, description: '영문명 필수(NOT NULL · F-BRD-01)' }
        overview: { type: [string, 'null'] }
        targetCustomer: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BrandCreate:
      type: object
      required: [nameKo, nameEn]
      properties:
        nameKo: { type: string }
        nameEn: { type: string, description: '필수 — 누락 시 400 VALIDATION_ERROR' }
        overview: { type: [string, 'null'] }
        targetCustomer: { type: [string, 'null'] }
    BrandUpdate:
      type: object
      description: '부분 수정. nameEn을 null·빈값으로 바꾸는 요청은 400.'
      properties:
        nameKo: { type: string }
        nameEn: { type: string }
        overview: { type: [string, 'null'] }
        targetCustomer: { type: [string, 'null'] }
    BrandLogo:
      type: object
      description: 'ERD brand_logo (복수 로고)'
      properties:
        id: { type: integer, format: int64 }
        format: { type: string, enum: [svg, png, jpg] }
        orderNo: { type: integer }
        logoUrl: { type: string, format: uri, description: 'presigned, 만료 5분 (DB엔 logo_key만)' }

    # ===== Master =====
    Country:
      type: object
      description: 'master_country (자연키 code)'
      properties:
        code: { type: string }
        name: { type: string }
        hasRegulatoryDictionary: { type: boolean }
        release: { type: [string, 'null'] }
    Language:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        release: { type: [string, 'null'] }
    RegulatoryClassItem:
      type: object
      description: 'master_regulatory_class (국가별)'
      properties:
        code: { type: string }
        name: { type: string }
        isEscapeHatch: { type: boolean }
    Category:
      type: object
      description: 'category_master 트리 노드'
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: [integer, 'null'], format: int64 }
        name: { type: string }
        amazonNode: { type: [string, 'null'] }
        isLeaf: { type: boolean }
        path: { type: [string, 'null'] }
    ChannelSpec:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        specType: { $ref: '#/components/schemas/SpecType' }
        description: { type: [string, 'null'] }
        isActive: { type: boolean }
        release: { type: [string, 'null'] }
    UploadGuide:
      type: object
      description: '규격 종속 업로드 안내 (파생 · 미저장)'
      properties:
        formats: { type: array, items: { type: string } }
        maxFileSize: { type: [integer, 'null'], description: '바이트. 9월 원본 규격 미검사(null)' }
        recommendedResolution: { type: [string, 'null'] }
        notes: { type: array, items: { type: string } }
    MasterVersion:
      type: object
      properties:
        dataType: { type: string }
        version: { type: string }
        isCurrent: { type: boolean }
        loadedAt: { type: string, format: date-time }

    # ===== Job =====
    JobCreate:
      type: object
      required: [brandId]
      description: >
        draft 생성 (A3 draft-first). brandId만 필수 — 나머지 N1 값은 업로드(SRC-02) 후
        PATCH /jobs/{jobId}로 세팅한다. 필수값 검증은 analyze(ANL-01) 게이트에서 수행.
        keywords는 job_keyword로 저장.
      properties:
        brandId: { type: integer, format: int64 }
        productName: { type: [string, 'null'], description: 'F-SRC-11 · analyze 게이트에서 필수(400)' }
        productCode: { type: [string, 'null'] }
        targetCountry: { type: string }
        regulatoryClass: { $ref: '#/components/schemas/RegulatoryClass' }
        targetLanguage: { type: string }
        specType: { $ref: '#/components/schemas/SpecType' }
        channelSpecId: { type: [integer, 'null'], format: int64 }
        categoryId:
          type: integer
          format: int64
          description: >
            카테고리 마스터(MST-04)의 id. [PRD v3.5.10 · 계약 확정 · 구현 대기] 더 펼칠 것이 없는 항목(leaf — 소분류, 또는 소분류가 없는 중분류)만
            허용한다(F-SRC-04 J41②). 검증 실패 응답 형식과 analyze 게이트의 필수 검사 적용 시점(FE 입력 연결 — 3차)은 협의 중(미확정).
        keywords: { type: array, items: { type: string } }
        imageType: { $ref: '#/components/schemas/ImageContinuity' }
        consentId:
          type: integer
          format: int64
          description: >
            [PRD v3.5.10] 사용하지 않는다 — 서버는 저장하지 않는다(현행과 같음). 동의 시각은 작업 생성 시각으로 본다(F-ACC-04) —
            단 동의 체크가 [다음]의 필수 조건으로 적용된 뒤부터다(전제·현재 상태는 jobCreate 설명). 필드·POST /consents의 제거 여부는 협의 중(미확정).
    JobPatch:
      type: object
      description: >
        N1 입력값 세팅/수정 (A3 draft-first · PATCH /jobs/{jobId}). 부분 갱신 — 보낸 필드만 반영.
        전부 기존 job 컬럼(스키마 무변경). 필수값 최종 검증은 analyze(ANL-01) 게이트.
      properties:
        productName: { type: [string, 'null'], description: 'F-SRC-11' }
        productCode: { type: [string, 'null'] }
        targetCountry: { type: [string, 'null'] }
        regulatoryClass:
          oneOf: [ { $ref: '#/components/schemas/RegulatoryClass' }, { type: 'null' } ]
          description: >
            [PRD v3.5.10 · 정책 확정(PM 11-04) · 필드는 새 규제사전(F 묶음) 계약에서] OTC 종류와의 관계 — OTC·복합 → 화장품·잘 모름으로 바꾸면 OTC 종류를 지운다.
            OTC ↔ 복합 사이 변경은 OTC 종류를 유지한다. 국가를 바꾸면 규제 분류와 OTC 종류를 다시 고른다.
            임시 M020: OTC·복합이면서 OTC 종류가 없는 작업에 실제로 저장한다(기존 작업 포함, 화장품·잘 모름에는 적용하지 않음). 3차 필수 선택을 도입하면 새 임시 적용은 끝내고
            이미 저장한 M020은 유지한다. 기존 작업에 M020을 기록할 때 검사 입력·기존 결과의 유효성이 어떻게 바뀌는지는 AI와 맞춘다(미결).
        targetLanguage: { type: [string, 'null'] }
        specType:
          allOf: [ { $ref: '#/components/schemas/SpecType' } ]
          description: 'null 불가(400 VALIDATION_ERROR) — 생략하면 기존 값 유지. 1.0.0 은 original 만 사용(2026-10-14 결정)'
        channelSpecId: { type: [integer, 'null'], format: int64 }
        categoryId:
          type: [integer, 'null']
          format: int64
          description: '카테고리 마스터 id. [PRD v3.5.10 · 계약 확정 · 구현 대기] leaf 항목만 허용(JobCreate.categoryId와 같음). 검증 실패 응답 형식·필수 적용 시점은 협의 중.'
        keywords: { type: array, items: { type: string }, description: '보내면 전체 교체. null 불가' }
        imageType: { oneOf: [ { $ref: '#/components/schemas/ImageContinuity' }, { type: 'null' } ] }
        consentId: { type: [integer, 'null'], format: int64, description: '[PRD v3.5.10] 사용하지 않음(서버 미저장). 동의 시각은 동의 체크가 [다음]의 필수 조건으로 적용된 뒤부터 작업 생성 시각으로 본다(F-ACC-04, jobCreate 설명). 제거 여부는 협의 중.' }
    Job:
      type: object
      description: 'ERD job — 상태 + N1 입력값 전체'
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/JobStatus' }
        currentStep: { $ref: '#/components/schemas/JobStep' }
        userFacingStatus: { $ref: '#/components/schemas/UserFacingStatus' }
        productName: { type: [string, 'null'] }
        productCode: { type: [string, 'null'] }
        brandId: { type: integer, format: int64 }
        targetCountry: { type: [string, 'null'] }
        regulatoryClass: { type: [string, 'null'] }
        targetLanguage: { type: [string, 'null'] }
        specType: { $ref: '#/components/schemas/SpecType' }
        channelSpecId: { type: [integer, 'null'], format: int64 }
        categoryId: { type: [integer, 'null'], format: int64 }
        internalCategory: { type: [string, 'null'] }
        keywords: { type: array, items: { type: string } }
        imageType: { oneOf: [ { $ref: '#/components/schemas/ImageContinuity' }, { type: 'null' } ] }
        isSaved: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JobTaskStatus:
      type: object
      description: >
        JOB-05 폴링 응답. progress·stages·uiStatus·analysisProgress는 DB에 저장하지 않고 응답 때 계산하는 파생 값이다(analysisProgress 의
        분석 구간 값 중 일부는 BE 가 임시 진행 저장소에 TTL 로 보관한 AI 보고에서 읽는다). cancelled 항목 제외.
      properties:
        jobStatus: { $ref: '#/components/schemas/JobStatus' }
        currentStep: { $ref: '#/components/schemas/JobStep' }
        userFacingStatus: { $ref: '#/components/schemas/UserFacingStatus' }
        progress:
          type: number
          format: float
          description: >
            0.0~1.0 (done/total · 9/15 확정). 처리량·시간 비율이 아니다. N2: 분석 시도 1행이 끝날 때까지 0, 분석 채택 트랜잭션에서
            분모가 1+영역 수로 바뀌며 값은 오른다. LOCAL_JUDGE_FAILED 로 제외된 영역은 done 이 아니어서 N3 전환 뒤에도 1 미만일 수 있다(분석 실패 아님).
            판정 중 분석 실행이 실패 종료되면 취소된 시도가 빠져 분모가 줄 수 있다 — 실패 판단은 jobStatus 로 한다.
        total: { type: integer }
        done: { type: integer }
        failedCount: { type: integer }
        stages:
          type: array
          description: >
            step별 고정 단계 (N2 ocr→section→verify · N4 inpaint→translate→verify→render · N6 render).
            status는 해당 task_type 행 집계 — 전부 done→done / 하나라도 running→running /
            전부 pending→pending / failed 있으면 failed(cancelled 제외). 파생·미저장.
            N2 현 구현 대응: ocr = 분석 시도(① 분해 · ② OCR · ③ 병합 전체 1행) · section = 영역별 판정(③-1·③-1′) ·
            verify = N2 에 대응 시도 없음(실행 종료 전 pending, 완료 후 done). LOCAL_JUDGE_FAILED 가 있으면 section=failed 로
            집계되지만 분석 실패가 아니다.
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string, description: 'FE 표시 문구(런타임 값)' }
              status: { type: string, enum: [pending, running, done, failed] }
        items:
          type: array
          items: { $ref: '#/components/schemas/JobAsyncTaskItem' }
        analysisProgress:
          allOf: [ { $ref: '#/components/schemas/AnalysisProgress' } ]
          description: >
            【구현 예정 — 운영 미제공】 선택. N2 세부 진행. currentStep=N2 가 아니면 속성을 생략한다(null 을 보내지 않음).
            없으면 FE 는 기존 progress·stages·items 로 표시한다. 기존 필드의 값·의미는 바꾸지 않는다.
    JobAsyncTaskItem:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        taskType: { $ref: '#/components/schemas/TaskType' }
        unitType: { $ref: '#/components/schemas/TaskUnitType' }
        unitId: { type: [integer, 'null'], format: int64 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        uiStatus: { $ref: '#/components/schemas/TaskUiStatus' }
        retryCount: { type: integer }
        maxRetry: { type: integer }
        retryable: { type: boolean }
        errorCode: { type: [string, 'null'] }
        revision: { type: [integer, 'null'] }
    AnalysisProgress:
      type: object
      description: >
        【구현 예정 — 운영 미제공】 JOB-05 의 N2 분석 세부 진행. DB 에 저장하지 않는 파생 응답이다.
        phase=analyze 의 activity·current·regions 근거는 AI 진행 보고이며 BE 가 임시 진행 저장소에 TTL 로 보관했다가 응답 때 읽는다
        (영구 기록 아님 — 보고가 없거나 만료·읽기 실패·실행 권한 만료면 null). sourceTotal·judge 와 phase=judge 의 regions 는
        응답 때 DB 시도 행에서 센다. 화면 표시용 세부 단계이며 TaskType·stages·items 와 다른 값 공간이다
        (TaskType 을 늘리거나 실행·시도 단위를 나누지 않는다). 포함 조건: currentStep=N2 이고 현재 분석 실행(0008 이후 대표 실행)이
        있을 때만. 그 밖(N1·N3~N6, 0008 이전 레거시 작업, 이 필드를 구현하기 전 서버)은 속성을 생략한다(null 아님).
        완료·전환 판단은 jobStatus·currentStep 만 따른다. 퍼센트는 제공하지 않는다.
      required: [phase, status, sourceTotal, activity, current, regions, judge]
      properties:
        phase:
          type: string
          enum: [analyze, judge]
          description: >
            analyze = 분석 시도(items 의 taskType=ocr·unitType=job 1행)가 done 이 아닌 동안 — 원본마다 ① 영역 분해 후
            그 원본의 영역마다 ② OCR · ③ 병합·역할 분류를 반복. judge = 분석 결과 채택 뒤 영역별 판정(taskType=section·unitType=section 행).
        status:
          type: string
          enum: [waiting, running, retrying, failed]
          description: >
            done 없음(분석 시도 done 이면 phase=judge, 판정이 끝나면 같은 트랜잭션에서 N3 전환되어 속성 생략).
            analyze = 분석 시도 uiStatus 그대로. judge = failed(실행 실패 종료) > running > retrying > waiting.
        sourceTotal:
          type: integer
          minimum: 1
          description: '분석 대상 원본 수(시도의 고정 입력).'
        activity:
          type: [string, 'null']
          enum: [split, ocr, merge, finalize, null]
          description: >
            마지막으로 시작한 처리(phase=analyze·status=running 일 때만). 끝난 영역 수는 regions.done 으로만 판단.
            split 분해 · ocr 텍스트 추출(타일 OCR 포함) · merge 병합·역할 분류 · finalize = 분석 함수 정상 반환 뒤 채택 전.
            finalize 근거는 현재 시도·lease 세대의 analyze_done 보고 또는 같은 시도·세대의 성공 결과 인계(채택 대기),
            실패 결과 인계는 근거 아님(그때 null, 이후 표시는 DB 상태 전이).
            null = 해당 없음 또는 알 수 없음(보고 전·만료·읽기 실패·실행 권한 만료 후 복구 전·실패 인계 등록 후).
        current:
          type: [object, 'null']
          description: 'activity 가 split·ocr·merge 일 때만 객체.'
          required: [sourceIndex, sourceImageId, regionIndex, regionCountInSource]
          properties:
            sourceIndex: { type: integer, minimum: 1, description: '업로드 순서 1부터' }
            sourceImageId: { type: integer, format: int64, description: 'SRC-01 SourceImage.id' }
            regionIndex: { type: [integer, 'null'], minimum: 1, description: 'split 이면 null' }
            regionCountInSource:
              type: [integer, 'null']
              minimum: 1
              description: '그 원본 분해가 끝나면 1 이상, 분해 중에만 null. ocr·merge 면 항상 정수.'
        regions:
          type: [object, 'null']
          description: >
            영역 = 분해 결과 섹션 1개, 타일 제외. analyze 는 AI 보고 누계·없으면 null. finalize 면 analyze_done 보고가 있을 때만
            done=known·totalFixed=true, 없으면 null(완료 개수를 채우지 않음). judge 는 판정 시도 행으로 done=known=judge.total·totalFixed=true
            (실패 때 지워지는 section 행으로 세지 않음).
          required: [done, known, totalFixed]
          properties:
            done: { type: integer, minimum: 0, description: 'OCR·병합까지 끝난 영역 누계(현재 영역 OCR만 끝난 상태는 제외)' }
            known: { type: integer, minimum: 0, description: '분해가 끝난 원본들의 영역 수 합(done ≤ known)' }
            totalFixed: { type: boolean, description: '마지막 원본 분해 완료. false 면 known 을 분모로 쓰지 않음' }
        judge:
          type: [object, 'null']
          description: >
            phase=judge 일 때만. 판정 현재 시도 행(영역마다 1개, cancelled 포함).
            total = done+excluded+running+waiting+retrying+failed+cancelled. items 의 section 개수 = total−cancelled.
            excluded = LOCAL_JUDGE_FAILED 로 자동 제외(exclusionReason=auto_local_failed) — failedCount 에 들어가지만 분석 실패 아님,
            N3 전환 안 막음. failed = excluded 제외 실패(실행 실패 종료 때만). cancelled = 실행 실패 종료 때 취소(items 에 없음).
            total 은 채택 때 정해지고 재시도·실패 종료로 바뀌지 않음.
          required: [total, done, excluded, running, waiting, retrying, failed, cancelled]
          properties:
            total: { type: integer, minimum: 0 }
            done: { type: integer, minimum: 0 }
            excluded: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
            waiting: { type: integer, minimum: 0 }
            retrying: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
    AbortResponse:
      type: object
      properties:
        returnTo: { type: string, enum: [N1, N3] }
        job: { $ref: '#/components/schemas/Job' }

    # ===== Source Image =====
    SourceImage:
      type: object
      description: 'ERD source_image'
      properties:
        id: { type: integer, format: int64 }
        uploadOrder: { type: integer }
        imageType: { $ref: '#/components/schemas/SourceImageType' }
        fileUrl: { type: string, format: uri, description: 'presigned, 만료 5분 (DB엔 S3 키만)' }
        width: { type: integer }
        height: { type: integer }
        createdAt: { type: string, format: date-time }
    SourceImageUploadResult:
      type: object
      description: '파일별 성공/실패 개별 기록 (한 파일 실패해도 나머지 적재)'
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              fileName: { type: string }
              ok: { type: boolean }
              sourceImageId: { type: [integer, 'null'], format: int64 }
              errorCode: { type: [string, 'null'] }
        sourceImages:
          type: array
          items: { $ref: '#/components/schemas/SourceImage' }
    ReorderRequest:
      type: object
      required: [order]
      properties:
        order:
          type: array
          description: 'sourceImageId 순서 배열'
          items: { type: integer, format: int64 }

    # ===== Section / Verdict =====
    SectionVerdict:
      type: object
      description: 'ERD section_verdict — 판정 배지. verdictType은 파생(읽기 전용).'
      properties:
        id: { type: integer, format: int64 }
        verdictStatus: { $ref: '#/components/schemas/VerdictStatus' }
        verdictType: { $ref: '#/components/schemas/VerdictType' }
        problemText: { type: [string, 'null'] }
        alternativeExpression: { type: [string, 'null'], description: '안전한 대체 표현 (N5 문구·regulatory_replaceable)' }
        basisArticle: { type: [string, 'null'], description: '조문 식별자만 (OI-58)' }
        evidenceUrl: { type: [string, 'null'], format: uri }
        reason: { type: [string, 'null'] }
    Section:
      type: object
      description: 'ERD section'
      properties:
        id: { type: integer, format: int64 }
        sectionOrder: { type: integer, description: '원본 세로 순서. N3 목록은 버킷과 관계없이 이 순서로 보인다(PRD v3.5.10 F-SEC-02 — 응답의 두 배열을 합쳐 정렬)' }
        sourceImageId: { type: integer, format: int64 }
        topOffset: { type: [integer, 'null'], description: '원본 이미지 내 세로 좌표(px). N5 스택엔 displayTop 사용' }
        displayTop: { type: [integer, 'null'], description: '서버 계산·미저장 (Σ 앞선 include 섹션 height)' }
        height: { type: [integer, 'null'] }
        bbox: { oneOf: [ { $ref: '#/components/schemas/Bbox' }, { type: 'null' } ] }
        category: { type: [string, 'null'] }
        bucket: { $ref: '#/components/schemas/SectionBucket' }
        exclusionReason: { oneOf: [ { $ref: '#/components/schemas/ExclusionReason' }, { type: 'null' } ] }
        excludedStage: { oneOf: [ { $ref: '#/components/schemas/ExcludedStage' }, { type: 'null' } ] }
        inpaintStatus: { oneOf: [ { $ref: '#/components/schemas/InpaintStatus' }, { type: 'null' } ] }
        warningBadge: { oneOf: [ { $ref: '#/components/schemas/WarningBadge' }, { type: 'null' } ] }
        verdicts:
          type: array
          description: >
            판정 목록 (정렬 불변식 regulated→policy→irrelevant→needs_fix→conditional, 같은 값은 id 순).
            **[PRD v3.5.10 · 계약 확정 · 구현 대기]** 목록(sectionList)도 버킷과 관계없이 그 섹션에 달린 판정 전부를 싣는다 —
            포함 섹션도 배지·판정 목록을 보인다(F-SEC-02 J74④ · F-SEC-04 J76⑤). 상세(SEC-02)는 판정 근거 전체.
            현재 서버(f85b23e)는 목록의 포함 섹션을 빈 배열로 반환한다(구현 차이).
          items: { $ref: '#/components/schemas/SectionVerdict' }
        signals:
          type: array
          items: { $ref: '#/components/schemas/ReviewSignal' }
        revision:
          type: integer
          description: >
            [PRD v3.5.10 · BE 계약안 · 구현 대기] 섹션 낙관적 잠금 버전(섹션 revision 사용은 FE 합의). 포함 상태(`bucket`·`exclusionReason`·`excludedStage`)가
            실제로 바뀔 때만 +1 — 판정·배지·인페인트 같은 파이프라인 값은 올리지 않는다. 기존 섹션은 0부터.
    SectionList:
      type: object
      description: >
        버킷 2단. 두 배열 모두 섹션마다 판정 목록 전부를 싣는다([PRD v3.5.10 · 계약 확정 · 구현 대기] — 현재 서버는 포함 섹션 빈 배열).
        화면의 원래 순서 목록은 두 배열을 합쳐 `sectionOrder`로 정렬한다(단일 배열 응답은 협의안 — 미확정).
      properties:
        exclude:
          type: array
          items: { $ref: '#/components/schemas/Section' }
        include:
          type: array
          items: { $ref: '#/components/schemas/Section' }
    SectionPatch:
      type: object
      required: [action]
      description: 'N3(섹션 카드 버튼 — PRD v3.5.10 F-SEC-03)·N5(F-CFM-14) 공용. excludedStage는 서버가 currentStep으로 기록. 복원 의미는 sectionPatch 설명.'
      properties:
        action: { type: string, enum: [restore, exclude] }
        revision:
          type: integer
          description: >
            [PRD v3.5.10 · BE 계약안 · 구현 대기] 현재 섹션 revision. 다르면 409 REVISION_CONFLICT(`details.current` = 최신 Section).
            적용 순서(계약안): `Idempotency-Key`가 있는 요청은 처음부터 필수(없으면 422) — 키 없는 요청만 생략 허용(충돌 검사·멱등 보장 없음, 현행 FE 호환) →
            FE 적용 뒤 모든 요청에서 필수.
    InpaintResult:
      type: object
      properties:
        sectionId: { type: integer, format: int64 }
        inpaintStatus: { $ref: '#/components/schemas/InpaintStatus' }
        inpaintImageUrl: { type: [string, 'null'], format: uri, description: 'presigned, 만료 5분' }
        residualRatio: { type: [number, 'null'], format: float }
        warningBadge: { oneOf: [ { $ref: '#/components/schemas/WarningBadge' }, { type: 'null' } ] }

    # ===== N5 Blocks / Preview =====
    TextBlock:
      type: object
      description: 'ERD text_block. isExcluded는 파생(role=product_label). 번역 실패는 signals[].code=translation_failed.'
      properties:
        id: { type: integer, format: int64 }
        sectionId: { type: integer, format: int64 }
        displayTop: { type: [integer, 'null'], description: '소속 섹션 displayTop 복사(파생)' }
        blockOrder: { type: integer }
        role: { $ref: '#/components/schemas/BlockRole' }
        isExcluded: { type: boolean, description: '파생 (role=product_label)' }
        sourceKo: { type: [string, 'null'] }
        trans1: { type: [string, 'null'] }
        trans2: { type: [string, 'null'], description: '9월 null' }
        blockStatus:
          allOf: [ { $ref: '#/components/schemas/BlockStatus' } ]
          description: >
            「사용자수정」 표시(F-CFM-02a). `edited`는 **번역문이 바뀐 저장**에서만 된다.
            [PRD v3.5.10 · 계약 확정] 배치(박스·글자 배율)만 바꾼 저장은 이 값을 바꾸지 않는다(배치 저장 필드는 협의 중 — 미확정).
        bbox: { oneOf: [ { $ref: '#/components/schemas/Bbox' }, { type: 'null' } ] }
        charCount: { type: [integer, 'null'] }
        charLimit: { type: [integer, 'null'], description: '항상 필드 포함, 상한 없으면 null' }
        overflow:
          type: boolean
          description: >
            마지막으로 채택된 미리보기 결과의 측정값 — 현재 입력과 다를 수 있다(편집 직후·렌더 중·실패·스타일만 바뀐 경우).
            [PRD v3.5.10 · 계약 확정(FE)] 기존 호환을 위해 유지하되 넘침 판정에는 쓰지 않는다 — 판정은 /preview `render.result.overflow`.
        autoAdjust: { oneOf: [ { $ref: '#/components/schemas/AutoAdjust' }, { type: 'null' } ] }
        signals:
          type: array
          items: { $ref: '#/components/schemas/ReviewSignal' }
        alternativeExpression: { type: [string, 'null'] }
        revision: { type: integer, description: '낙관적 잠금 버전' }
        layoutAdjust:
          oneOf: [ { $ref: '#/components/schemas/LayoutAdjust' }, { type: 'null' } ]
          description: >
            [PRD v3.5.10 · BE 계약안 · 구현 대기] 저장된 셀러 배치 조정(F-CFM-15, 2차). null = 셀러 조정 없음. 원본 `bbox`는 바뀌지 않는다.
            적용 박스·배율의 정본은 /preview `renderInput`이다(3차 시스템 조정이 들어와도 FE가 우선순위를 계산하지 않게).
            합의되면 항상 제공(required)으로 바꾼다 — 지금은 확정 예시(blockPatch changed 등)를 바꾸지 않으려고 넣지 않았다.
        systemAdjust:
          type: [object, 'null']
          description: '[PRD v3.5.10 · BE 계약안] 시스템 자동 조정(F-TRN-04 — 3차) 자리. 2차는 항상 null이며 요청으로 받지 않는다(요청 키가 있으면 422). 구조는 3차에 정한다.'
        sectionInputFingerprint:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: >
            [PRD v3.5.10 · 계약 확정(FE 11-04) · 구현 대기] 이 블록이 속한 섹션의 **현재 렌더 입력 지문** — 이 `/blocks` 응답을 만든 시점에 서버가 계산한 값이며,
            /preview `sections[].inputFingerprint`와 같은 계산이다(배경·스타일·렌더러·대상 블록 구성·박스·배율 포함). 같은 섹션의 블록은 같은 값을 갖는다.
            FE가 필요하다고 회신(11-03) — 배경·스타일·렌더러·대상 블록 구성까지 포함해 표(`/blocks`)와 뷰어(`/preview`)가 같은 섹션 입력을 봤는지 판단하는 용도.
            미리보기 최신성은 /preview 안에서 판단한다. 비교 규칙은 blockList 설명.
            null = N5 제외 섹션 또는 입력 구성 실패(/preview `inputError`). 합의되면 항상 제공(required)으로 바꾼다.
        check:
          oneOf: [ { $ref: '#/components/schemas/BlockCheck' }, { type: 'null' } ]
          description: '[PRD v3.5.10 · BE 계약안 · 구현 대기 · AI·FE 확인] 현재 입력에 대한 번역문 규칙 검사 상태. 검사 대상이 아니면(라벨·로고·빈 원문·빈 번역문·제외 섹션) null.'
    BlockPatch:
      type: object
      required: [revision]
      description: >
        [PRD v3.5.10 · BE 계약안 · 구현 대기] `trans1`·`layoutAdjust` 중 하나 이상을 보낸다(둘 다 없으면 422 — 요청 모델이 판단). 3.4.2 계약은 `trans1` 필수였다 —
        생략 허용은 완화라서 지금 FE 요청(`trans1`·`revision`)은 그대로 통과한다.
      properties:
        trans1: { type: string, description: '수정 번역문. 생략 = 그대로(BE 계약안). null은 422 — 비우기는 빈 문자열(현행 허용)' }
        revision: { type: integer, description: '현재 블록 revision. 불일치 시 409 REVISION_CONFLICT' }
        layoutAdjust:
          oneOf: [ { $ref: '#/components/schemas/LayoutAdjustPatch' }, { type: 'null' } ]
          description: '[계약 확정(FE) · 구현 대기] 셀러 배치 조정. 생략 = 그대로, null = 셀러 조정 전부 해제(적용값 = 원본 bbox·배율 1.0)'
    LayoutAdjustPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      description: >
        [PRD v3.5.10 · 계약 확정(FE) · 구현 대기] 셀러 조정만 담는다(그 밖의 키는 422). 안쪽 키 생략 = 그 값 유지, 안쪽 키 null = 그 값만 해제, 빈 객체는 422.
        서버는 받은 절대값을 저장할 뿐 [+][−]·손잡이·옮기기를 해석하거나 다시 계산하지 않는다(blockPatch 설명 「블록 배치」).
      properties:
        box:
          oneOf: [ { $ref: '#/components/schemas/LayoutBox' }, { type: 'null' } ]
          description: '셀러 배치 영역(절대값). null = 박스 조정 해제(원본 bbox). 네 값을 모두 보낸다'
        fontScale:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: >
            기준 글자 크기 대비 **절대 배율**(직전 배율에 곱하지 않는다 — AI 원칙). null = 배율 해제(적용값 1.0). 상한 없음(PRD J109③).
            1.0을 보내면 null과 같은 상태로 저장한다(정규화 — FE 조건부 동의, 3차 시스템 조정과의 관계는 BE·AI 확인 전 · BE 계약안).
    LayoutBox:
      type: object
      required: [x, y, w, h]
      additionalProperties: false
      description: >
        [PRD v3.5.10 · BE 계약안] 섹션 로컬 원본 px(섹션 왼쪽 위 = 0,0). 소수 그대로 저장·반환한다(서버가 자르거나 반올림하지 않는다 — AI 원칙).
        범위 0 ≤ x, 0 ≤ y, w > 0, h > 0, x + w ≤ 섹션 폭, y + h ≤ 섹션 높이 — 허용 오차 없이 십진수로 비교하고, 벗어나면 400(보정하지 않음).
      properties:
        x: { type: number, minimum: 0 }
        y: { type: number, minimum: 0 }
        w: { type: number, exclusiveMinimum: 0 }
        h: { type: number, exclusiveMinimum: 0 }
    LayoutAdjust:
      type: object
      required: [box, fontScale]
      description: '[PRD v3.5.10 · BE 계약안] 저장된 셀러 조정(정규화 후). 둘 다 없으면 이 객체 대신 null.'
      properties:
        box:
          oneOf: [ { $ref: '#/components/schemas/LayoutBox' }, { type: 'null' } ]
          description: 'null = 박스 조정 없음(원본 bbox와 같은 값을 보낸 경우도 null로 저장 — FE 조건부 동의, BE 계약안)'
        fontScale: { type: [number, 'null'], description: 'null = 셀러 배율 없음(적용값 1.0)' }
    BlockCheck:
      type: object
      required: [state]
      description: >
        [PRD v3.5.10 · 구현 대기] 서버가 계산한 현재 입력의 규칙 검사 상태. 5개 상태와 FE 처리는 **계약 확정(FE 동의, 11-03)**.
        "현재 입력"은 블록 revision이 아니라 **검사 유효성 지문**으로 판단한다(confirmReview 설명 「검사 연결 경계」) — 배치만 바뀌면 상태가 바뀌지 않는다.
        판단 기준(유효성 지문·`inputKey`의 의미 입력)은 AI 확정(11-04). 지문의 내부 필드·직렬화는 BE·AI가 구현 때 정한다.
      properties:
        inputKey:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: >
            [계약 확정(FE 구조 · AI 기준 11-04) · 구현 대기] 지금 보이는 결과(`signals`·실패)가 어느 입력의 것인지 나타내는 블록 검사 입력 키.
            규칙 검사 = 블록 ID, 원문·번역문, 그 블록에 적용되는 고정 사전·용어집 선별 결과, 규칙 버전 등 의미 입력. LLM 검사(3차) = 여기에 섹션 전체 문맥·모델·프롬프트·구현 버전·분할 한도.
            배치·배율·저장 revision·활성 검사 구성은 넣지 않는다. 확인 최신성 대조용이며 섹션 결과의 블록별 부분 채택을 뜻하지 않는다. 확정 확인 항목에 그대로 보낸다(ConfirmRequest).
            보일 결과가 없으면(missing·in_progress 중 결과 없음) null. outdated면 이전 입력의 키라 현재 키와 다르다.
        state:
          type: string
          enum: [settled, in_progress, failed, missing, outdated]
          description: >
            settled = 현재 입력 검사가 정상 종료(결과는 `signals`) / in_progress = 현재 입력 검사가 대기·실행 중 /
            failed = 현재 입력 검사가 최종 실패(재시도 소진) — 「⚠ 검사하지 못했습니다」, 확정 때 확인 대상 /
            missing = 현재 입력 검사 기록이 없음(등록 전·취소됨) / outdated = 이전 입력의 결과만 있고 현재 입력 검사가 없음.
            AI 내부 상태(기술 입출력 계약 v0.1 §3.4)와의 대응: settled = done·current / in_progress = pending·running / failed = failed·current(최종 실패) /
            missing = none·cancelled, 그리고 done·current인데 결과 기록이 없는 무결성 오류 / outdated = stale·not_comparable /
            skipped(no_targets)·inactive(작업에 예정되지 않은 검사)는 블록 상태로 내지 않는다(검사 대상 아님 → `check` null, 비활성 검사는 집계에서 빠짐).
    BlockPatchResponse:
      type: object
      required: [rerenderTaskId]
      properties:
        block: { $ref: '#/components/schemas/TextBlock' }
        rerenderTaskId:
          type: [integer, 'null']
          format: int64
          description: >
            **[PRD v3.5.10 · 계약 확정(FE 합의)]** 항상 포함한다.
            숫자 = **이 요청으로 만든** 새 재렌더 task ID — /tasks로 추적하고 done이면 블록·/preview를 재조회한다.
            null = 이 요청으로 새 task를 만들지 않았다는 뜻일 뿐이다. 변경 없음(no-op)·렌더 완료·저장 실패의 판정 근거로 쓰지 않으며,
            null이어도 이미 추적 중인 pending/running task는 계속 추적한다. 번역문·박스·배율의 Undo/Redo 저장도 같은 규칙이다.
            no-op 여부를 알리는 별도 필드는 두지 않는다.
            [구현 대기] 같은 값 저장은 null이어야 한다(현재 서버는 새 task를 만든다). 실제 값이 바뀐 저장인데
            진행 중인 후속 처리 실행이나 현재 미리보기 시도가 없어 null이 나오는 현행 경로는 정상 no-op이 아니다 —
            편집 뒤 필요한 재렌더를 보장하도록 서버를 보완한다.
    ReviewPreview:
      type: object
      description: >
        다폭 대응 검수 프리뷰 (계산값·미저장). scale=previewWidth/maxOriginalWidth · align=left.
        요청 파라미터는 jobId뿐(폭 파라미터 없음). 리사이즈 시 재요청하지 않고 FE가
        `transform: scale(표시폭/previewWidth)`로 축소한다(10차 #B — 리사이즈는 재조회 계기가 아니다).
        재조회 계기 = 구성 변경(SEC-03·CFM-02), 추적 중인 재렌더 task 완료, reviewPreview 상태 판정 규칙(d·e·g)의 재조회.


        [PRD v3.5.10 · BE 계약안 · 구현 대기] **필드 제공 규칙** — `required`의 키는 항상 낸다(키 생략은 계약 위반이며 정상 상태로 해석하지 않는다).
        null은 정해진 경우에만 쓴다: N5 제외 섹션(`bucket=exclude`)이면 `renderInput`·`inputFingerprint`·`render`가 모두 null,
        포함 섹션이면 `render`는 항상 있고, `renderInput`·`inputFingerprint`는 둘 다 있거나(정상) 입력 구성 실패면 둘 다 null이며 그때만 `inputError`가 있다.
        이 필드 간 조건과 `PreviewRender`의 isCurrent·overflow 조건은 스키마 조건식이 아니라 설명으로 정한다
        (조건식은 문서 도구의 예시 검사가 분기를 따로 엄격 평가해 정상 예시를 거부한다). 기존 필드는 현행 서버(f85b23e)가 이미 항상 내는 것이고, 새 필드(`renderer`·`renderInput`·
        `inputFingerprint`·`render`)는 아직 내지 않는다. 호환 기간은 두지 않는 안이다 — 기존 FE가 추가 필드를 허용하는지와 기존 필드 의미
        (`renderedUrl`의 이전 성공 이미지 유지 등)가 호환되는지를 확인한 뒤 서버가 먼저 배포하고, FE는 그 뒤 판정 규칙을 적용한다. 새 FE가 새 키 없는 응답을 받으면 렌더 상태를 판정하지 않고 오류로 보고한다.
      required: [maxOriginalWidth, originalHeight, previewWidth, previewHeight, scale, align, renderer, sections]
      properties:
        maxOriginalWidth: { type: integer }
        originalHeight: { type: integer }
        previewWidth:
          type: integer
          description: '서버 고정 상수 500 (설정값·server constant). 뷰포트 무관 좌표 기준 폭 — FE 코드젠이 변수로 오해하지 않도록 example 미지정.'
        previewHeight: { type: integer }
        scale: { type: number, format: float }
        align: { type: string, enum: [left] }
        renderer:
          $ref: '#/components/schemas/PreviewRenderer'
        boundaryCheck:
          oneOf: [ { $ref: '#/components/schemas/BoundaryCheck' }, { type: 'null' } ]
          description: '[PRD v3.5.10 · BE 계약안 · 12월(PM — 실행계획대로)] 이미지 경계 판정(Q-07, 작업 단위). 적용 전 서버는 이 키를 내지 않는다'
        sections:
          type: array
          items:
            type: object
            required: [id, sectionOrder, bucket, excludedStage, sourceImageId, width, displayTop, height, originalUrl, renderedUrl,
                       renderInput, inputFingerprint, inputError, render, signals, revision]
            properties:
              id: { type: integer, format: int64 }
              sectionOrder: { type: integer }
              bucket: { $ref: '#/components/schemas/SectionBucket' }
              excludedStage: { oneOf: [ { $ref: '#/components/schemas/ExcludedStage' }, { type: 'null' } ] }
              sourceImageId: { type: integer, format: int64 }
              width: { type: integer, description: '소속 원본 폭 (source_image.width 조인)' }
              displayTop:
                type: integer
                description: >
                  화면 세로 위치(현행 서버 = 이 응답에 실린 섹션의 높이를 차례로 더한 값 — N5 제외 섹션의 높이도 더한다).
                  그래서 Q-07의 **제외를 반영한 최종 출력 위치**와 값이 다르다(PM·AI 11-04: 출력 위치로 재사용하지 않는다) — 경계 판정에는 이 값을 쓰지 않고
                  최종 출력 위치(앞선 포함 섹션 높이의 합)를 따로 계산한다. 두 값을 나눌지(필드 추가)·displayTop의 의미를 바꿀지는 BE·FE 결정.
              height: { type: integer }
              originalUrl: { type: [string, 'null'], format: uri, description: 'presigned' }
              renderedUrl:
                type: [string, 'null']
                format: uri
                description: >
                  presigned. [PRD v3.5.10 · BE 계약안] 포함 섹션에서는 **표시 결과**(`render.result`)의 완성 이미지이며,
                  `render.result`가 null일 때만 null이다. 새 시도가 진행 중이거나 실패해도 이전 성공 결과가 있으면 그 이미지를 낸다
                  (현행 서버도 재렌더 실패 때 이전 이미지 키를 지우지 않는다 — 3.4.2의 "실패 시 null"은 최초 렌더 실패에만 맞았다).
                  현재 입력에 대응하는지는 `render.isCurrent`로 판단한다. N5 제외 섹션의 값은 이 계약안에서 바꾸지 않으며
                  (현행 서버는 제외 전 이미지가 있으면 낸다) 렌더 상태 판정에 쓰지 않는다.
              renderInput:
                oneOf: [ { $ref: '#/components/schemas/PreviewRenderInput' }, { type: 'null' } ]
                description: '[PRD v3.5.10 · BE 계약안 · 구현 대기] 서버가 저장한 현재 입력으로 만든 공통 렌더 입력. N5 제외 섹션이면 null. 포함 섹션은 값이 있고(렌더 대상 블록 0개면 `blocks=[]`), 입력을 만들 수 없을 때만 null(`inputError`).'
              inputFingerprint:
                type: [string, 'null']
                pattern: '^[0-9a-f]{64}$'
                description: >
                  [PRD v3.5.10 · BE 계약안 · 구현 대기] `renderInput`(같은 응답)에 대응하는 서버 렌더 입력 지문 — SHA-256 16진수 소문자 64자.
                  서버 미리보기 시도의 입력 지문과 같은 계산이다. N5 제외 섹션·입력 구성 실패(`inputError`)면 null.
                  **원칙(계약안의 고정 조건)**: 렌더 결과(이미지·넘침 측정)를 바꿀 수 있는 입력은 모두 지문에 들어간다. 지금 들어가는 것은
                  배경 key·sha256·출처, 블록별 revision·번역문 해시·스타일 해시·적용 박스, 렌더러 식별자, 스타일 기본값 자료다.
                  HTML 렌더로 바꾸면 `bundleId`·측정 규칙 버전(`rendererId`)도 넣는다(AI A6). 섹션의 출력 위치는 넣지 않는다 — 섹션 입력이 같으면 섹션 이미지를 다시 쓰고,
                  경계 판정은 최종 합성 단계에서 출력 위치로 한다(Q-07 — PM·AI 11-04, `boundaryCheck`).
                  사용자 배율·정렬 근거처럼 아직 저장 필드가 없는 입력도, 도입되는 변경에서 그 값 자체 또는 그 값이 반영된 최종 렌더 입력
                  (`renderInput`에 실리는 값)으로 반드시 지문에 넣는다 — 지문에 빠진 입력이 있으면 `isCurrent`가 틀린다.
                  AI·FE 협의는 그 값의 필드 이름·표현·계산 방법을 정하는 일이며, 지문에 넣을지는 협의 대상이 아니다.
                  presigned URL 재발급처럼 결과를 바꾸지 않는 값은 넣지 않는다.
              inputError:
                oneOf: [ { $ref: '#/components/schemas/PreviewInputError' }, { type: 'null' } ]
                description: >
                  [PRD v3.5.10 · BE 계약안 · 구현 대기 · AI 확인] 포함 섹션인데 서버가 공통 렌더 입력을 만들 수 없을 때만 값이 있다 —
                  그때 `renderInput`·`inputFingerprint`는 null이다(값을 지어내거나 임의 기본값으로 채우지 않는다). 입력을 만들었으면 null.
                  입력은 만들었고 실행하다 실패한 경우는 이 필드가 아니라 `render.attempt.status=failed`다. N5 제외 섹션은 null.
              render:
                oneOf: [ { $ref: '#/components/schemas/PreviewRender' }, { type: 'null' } ]
                description: '[PRD v3.5.10 · BE 계약안 · 구현 대기] 현재 시도와 표시 결과. N5 제외 섹션이면 null, 포함 섹션이면 항상 값이 있다.'
              signals:
                type: array
                items: { $ref: '#/components/schemas/ReviewSignal' }
              revision: { type: integer, description: '[PRD v3.5.10 · BE 계약안 · 구현 대기] 섹션 revision(Section.revision과 같음) — N5 섹션 제외·복원 요청에 쓴다' }
    BoundaryCheck:
      type: object
      required: [state, basis, currentTargetKey, judgedTargetKey, ruleVersions, exceeded, confirmBlock]
      description: >
        [PRD v3.5.10 · BE 계약안 · 12월(PM — 실행계획대로) · **FE·AI 확인 필요**] 이미지 경계 판정(Q-07) — 제외를 반영한 최종 결합 이미지 좌표계, 작업 단위.
        FE가 수용한 것은 이전의 섹션 결과 `render.result.boundaryExceeded` 구조이며 이 새 구조는 아직 FE·AI 확인 전이다.
        최신 판정 상태(`state`), 보여 주는 판정의 기준(`basis`), 확정 차단(`confirmBlock`)을 나눠 과거 판정을 최신 결과처럼 보이지 않게 한다.
        **판정 키는 결과 지문이 아니라 입력 지문으로 만든다** — 번역문을 고쳤는데 새 렌더가 아직 끝나지 않았으면 섹션 결과 지문(C)은 그대로이므로, 결과 지문으로 만든 키는
        이전 판정을 최신으로 오인한다. 그래서:
        `currentTargetKey` = 현재 **저장 입력**에 대응하는 판정 대상 키 — 포함 섹션 순서, 각 섹션의 현재 렌더 입력 지문(B — 그 섹션 렌더가 끝났는지와 무관), 출력 위치
        (최종 블록 y = 섹션 로컬 y + 제외 반영 출력 위치, `displayTop`은 쓰지 않음), 최종 이미지 크기, `ruleVersions`로 만든다.
        `judgedTargetKey` = 완료 판정이 **실제로 사용한** 판정 입력 키 — 그 판정이 쓴 섹션 결과들의 입력 지문(C)·출력 위치·규칙 버전으로 같은 방식으로 만든다.
        두 키가 같을 때만 `basis = current`다. **지문 불일치 자체는 상태가 아니라, 이전 판정을 `current`로 인정하지 않는 조건이다.**
        상태(`state`)는 현재 입력에 필요한 섹션 렌더·입력 구성·판정이 실제로 어떻게 되어 있는지로 정한다 —
        `in_progress` = 필요한 렌더나 판정이 실제로 대기·실행 중 / `failed` = 필요한 렌더·입력 구성(`inputError`)·판정 중 하나가 실패 /
        `none` = 필요한 렌더·판정 시도가 등록돼 있지 않음(미등록) / `done` = 현재 입력의 판정이 끝남(이때만 `basis = current`).
        섹션이 여럿이면 하나라도 대기·실행 중이면 `in_progress`, 아니면 하나라도 실패면 `failed`, 아니면 하나라도 미등록이면 `none`이다(BE 해석).
        `failed`·`none`이면 확정 제한 ③(마지막 완료 판정)을 따른다 — 지문이 다르다는 이유만으로 진행 중으로 두어 버튼을 계속 막지 않는다.
      properties:
        state: { type: string, enum: [in_progress, done, failed, none], description: '`currentTargetKey`에 대한 판정 상태. in_progress = 필요한 렌더·판정이 실제로 대기·실행 중 / failed = 필요한 렌더·입력 구성·판정 실패 / none = 필요한 렌더·판정 시도 미등록 / done = 현재 입력 판정 완료' }
        basis:
          type: string
          enum: [current, last_completed, none]
          description: '`exceeded`가 어느 판정의 결과인지 — current = 현재 입력의 완료 판정, last_completed = 현재 판정이 없거나 실패해 쓴 마지막 완료 판정(최신 결과 아님), none = 완료 판정이 한 번도 없음'
        currentTargetKey: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: '현재 저장 입력에 대응하는 판정 대상 키(섹션 렌더 입력 지문 기준). 포함 섹션이 없거나 입력 구성 실패가 있으면 null' }
        judgedTargetKey: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: '`exceeded`를 만든 완료 판정이 실제로 사용한 판정 입력 키. basis=current면 currentTargetKey와 같다. basis=none이면 null' }
        ruleVersions:
          type: object
          required: [renderer, composite, boundary]
          description: '판정 키에 들어가는 규칙 버전(이름·값은 AI 확인). 하나라도 바뀌면 키가 바뀌어 이전 판정은 current가 아니다'
          properties:
            renderer: { type: string, description: '섹션 렌더·측정 실행 환경과 측정 규칙(`renderer.rendererId`)' }
            composite: { type: string, description: '섹션 이미지를 이어 붙이는 합성 규칙 버전' }
            boundary: { type: string, description: '최종 이미지 경계 측정 규칙 버전' }
        exceeded:
          type: [array, 'null']
          description: '`basis` 판정에서 이미지 경계를 넘은 블록. 빈 배열 = 이탈 없음, null = 완료 판정 없음'
          items:
            type: object
            required: [sectionId, blockId]
            properties:
              sectionId: { type: integer, format: int64 }
              blockId: { type: integer, format: int64 }
        confirmBlock:
          type: object
          required: [blocked, reason]
          properties:
            blocked: { type: boolean }
            reason:
              type: [string, 'null']
              description: >
                차단 사유 — `boundary_check_in_progress`(현재 판정 진행 중, 후보) · `image_boundary_exceeded`(basis 판정에서 이탈) ·
                `boundary_check_missing`(완료 판정이 한 번도 없음 — PM 미결, 후보). 차단이 없으면 null. confirmReview의 409 사유와 같은 값
    PreviewInputError:
      type: object
      required: [code, blockIds]
      description: >
        [PRD v3.5.10 · BE 계약안 · 구현 대기 · AI 확인] 공통 렌더 입력 구성 실패. `code`는 task `errorCode`와 같은 값 공간(자유 텍스트)이며 HTTP `error.code`가 아니다.
        이 상태는 다시 시도해도 풀리지 않는다(입력·자료를 고쳐야 함). **세 코드의 역할 구분은 AI 동의로 확정(11-04)** — 겹치지 않게 다음처럼 나눈다:
        `STYLE_RESULT_INVALID` = AI 스타일 결과(⑦)의 계약 위반 — ⑦ 완료·실패 상태와 style의 모순, 측정 4키 형식 밖 값, 알 수 없는 역할·원본 폭(AI A8 원문).
        `STYLE_DEFAULTS_UNAPPROVED` = **승인 스타일 설정·폰트 자산의 검증 실패** — 승인 기본값 누락, 폰트·번들 자산 파일이 없거나 해시·메타가 승인값과 다름.
        `RENDER_INPUT_INVALID` = **BE가 구성한 값의 오류** — 박스(섹션 밖·w·h ≤ 0)·배율(유한 양수 아님)·조정값 조합(원본·셀러·시스템 조정의 잘못된 조합, 배율 중복 적용)이 어긋남,
        그리고 렌더 입력이 서버에 없는 번들·폰트를 **가리키는 잘못된 참조**.
        번들·폰트의 분류 기준: 자산 **자체가 승인 검증을 통과하지 못하면** `STYLE_DEFAULTS_UNAPPROVED`, 입력이 **잘못된 자산을 참조하면** `RENDER_INPUT_INVALID`.
        정상 입력을 받은 뒤 브라우저 실행·측정·이미지 생성 중에 생긴 실패는 이 필드가 아니라 렌더 시도 실패(`render.attempt.status = failed`, 실행 오류 코드)다.
        현행 렌더 코드(`typeset`)는 앞의 두 코드로 미리보기 시도를 실패시킨다(AI A8 — 의미 확인).
      properties:
        code: { type: string }
        blockIds:
          type: array
          items: { type: integer, format: int64 }
          description: '입력을 만들 수 없는 블록(섹션 단위 자료 문제면 빈 배열)'
    PreviewRenderer:
      type: object
      description: >
        [PRD v3.5.10 · BE 계약안 · 구현 대기] 지금 서버가 미리보기를 그리는 렌더러. 식별자 둘은 용도가 다르며 서로 비교하지 않는다.
        둘 다 문자열 하나이고 FE는 파싱하지 않고 같은지만 본다. 번들을 반입·고정하는 방식은 FE·BE·AI 협의 중(후보: GitHub Release + SHA-256 잠금).
      required: [rendererId, bundleId]
      properties:
        rendererId:
          type: string
          description: >
            서버 렌더·측정 **실행 환경** 식별자 — 결과 비교(`render.result.rendererId`)에만 쓴다(AI A6 승인: 번들 호환과 서버 최신성 분리).
            브라우저 엔진·버전, 출력 배율 등 결과에 영향을 주는 서버 조건과 **측정 규칙 버전**(HTML/CSS 줄바꿈·DOM baseline·glyph ink 경계·경계 비교 구현)이 바뀌면 바뀐다.
            AI의 기존 `role-style-rule/1`(스타일 기본값·폰트 계산 규칙 버전)은 측정 규칙 버전과 다르다 — 스타일 기본값 자료는 지문에 따로 들어간다.
            섹션 입력 지문의 구성요소이며 섹션 입력을 대신하지 않는다. 문자열 생성·배포 방식은 BE·FE 확정 전.
        bundleId:
          type: [string, 'null']
          description: >
            [BE 계약안 · AI A6 승인 범위] 공통 렌더 번들(HTML/CSS·공통 계산·측정 코드와 사용 폰트 자산)의 식별자 — FE·서버 번들 호환 확인용. 그 자산·의미가 바뀔 때만 바뀐다.
            FE는 자기 번들 식별자와 같은지만 본다. 다르면 로컬 미리보기가 서버와 다를 수 있으니 넘침·최신 판정은 서버 값만 쓴다.
            서버가 공통 번들을 쓰지 않는 렌더러(현행 Pillow)면 null.
    PreviewRenderInput:
      type: object
      description: >
        [PRD v3.5.10 · BE 계약안 · 구현 대기] 공통 렌더 입력(섹션 단위). 서버가 만들고 FE는 그대로 공통 렌더 코드에 넘긴다 —
        스타일·기본값을 FE가 계산하지 않는다. 사용자 입력(번역문·박스·배율)을 저장 전에 미리 보여 줄 때만 FE가 그 값을 로컬에서 바꾼다.
        폰트 목록(파일 해시)은 번들 합의(R-FE-6) 뒤 추가한다.
      required: [section, blocks]
      properties:
        section:
          type: object
          required: [id, width, height, background]
          properties:
            id: { type: integer, format: int64 }
            width: { type: integer, description: '섹션 원본 px' }
            height: { type: integer, description: '섹션 원본 px' }
            background:
              type: object
              required: [url, source, sha256]
              description: '그리는 바탕. 완성 이미지(renderedUrl) 위에 다시 그리지 않는다.'
              properties:
                url: { type: string, format: uri, description: 'presigned(만료 5분). URL 재발급은 지문을 바꾸지 않는다' }
                source: { type: string, enum: [inpaint, original], description: 'inpaint = 글자를 지운 배경, original = 인페인트 실패·생략으로 원본 위에 그림' }
                sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: '배경 파일 내용 해시(SHA-256 16진수 소문자 64자). 서버가 해시를 모르면 null' }
        blocks:
          type: array
          description: >
            렌더 대상 블록만(라벨·로고·빈 원문·빈 번역문 제외 — 현행 대상 규칙). 0개면 빈 배열이며, 그 섹션의 렌더 결과는 배경만 그린 이미지다
            (현행 서버도 대상 0개 섹션을 배경만으로 그려 채택한다). 0개라는 것은 결과 이미지의 모양일 뿐 상태 판정의 예외가 아니다 —
            시도·결과는 다른 섹션과 같은 규칙으로 판정하고, 실패는 실패로 표시한다.
          items: { $ref: '#/components/schemas/PreviewRenderBlock' }
    PreviewRenderBlock:
      type: object
      description: '[PRD v3.5.10 · BE 계약안 · 구현 대기] 렌더 대상 블록 하나의 공통 렌더 입력(서버 저장값 기준)'
      required: [blockId, revision, text, box, style]
      properties:
        blockId: { type: integer, format: int64 }
        revision: { type: integer }
        text: { type: string, description: '서버에 저장된 번역문' }
        box:
          type: object
          required: [x, y, w, h]
          description: '적용 박스 = 셀러 박스가 있으면 그것, 없으면 원본 bbox. 섹션 로컬 원본 px, **소수 그대로**(AI 원칙 — 허용 오차 없음). 렌더러에 실제로 넘기는 값이며 이미 적용된 절대값이라 렌더 코드가 배율로 다시 키우지 않는다. [구현 대기] 현행 서버는 렌더 입력 박스를 정수로 자른다(`_render_inputs`) — 보완 대상'
          properties:
            x: { type: number }
            y: { type: number }
            w: { type: number }
            h: { type: number }
        style:
          type: object
          additionalProperties: true
          required: [fontFamily, fontWeight, fontSizePx, fontScale, fontColor, align, letterSpacingEm, lineHeightRatio]
          description: >
            [PRD v3.5.10 · BE 계약안 · AI 확인] 공통 렌더 코드에 넘기는 **최소 스타일**. 서버가 저장 상태(측정값·역할 기본값·셀러 조정)로 만들며 null을 쓰지 않는다 —
            값을 만들 수 없으면 기본값으로 숨기지 않고 그 섹션의 `renderInput`을 내지 않는다(섹션 `inputError`). 키가 늘어나면 추가로만 늘린다.
            **계산 책임**: 서버 = 저장 상태를 이 입력으로 구성(기준 글자 크기의 출처 선택·최종 정렬 결정까지) /
            공통 렌더 코드 = 최종 글자 크기·행간·자간 px 계산과 측정 /
            FE = 저장 전 편집값(번역문·박스·배율)만 이 입력에 바꿔 넣고 같은 공통 코드로 로컬 미리보기 — FE가 따로 계산 규칙을 두지 않는다.
            **배율 이중 적용 방지**: 최종 글자 크기 = `fontSizePx × fontScale`을 공통 렌더 코드에서 한 번만 계산한다. 서버는 최종 크기를 싣지 않고,
            `box`는 이미 적용된 절대값이라 배율로 다시 키우지 않는다. [+][−]의 박스 변화는 FE가 저장 전에 계산해 `box`에 넣는다(blockPatch 「블록 배치」).
            정렬 근거(alignBasis)는 ⑦ 측정 style 4키 밖에 보존하고 렌더 입력 지문에 연결하되 이 입력에는 싣지 않는다(렌더에는 최종 `align`만 필요). 저장 위치는 미확정(AI §4.3).
            AI A1 승인: 8키는 조판 최소값으로 적절하다. 단 승인 폰트 face(Regular·SemiBold)·파일·SHA-256·설정 버전을 공통 번들의 폰트 매니페스트에서 일의적으로 찾을 수 있어야 하며,
            블록마다 `fontFace`를 둘지는 미정이다(BE 권장: 두지 않고 fontFamily·fontWeight로 매니페스트에서 찾는다). 측정값·출처 메타는 렌더 입력 밖에 보존한다.
          properties:
            fontFamily: { type: string, description: '예 Pretendard. 폰트 파일·굵기 대응은 공통 번들이 가진다(대체 폰트 없음)' }
            fontWeight: { type: integer, minimum: 100, maximum: 900 }
            fontSizePx: { type: number, exclusiveMinimum: 0, description: '기준 글자 크기 — 셀러 배율 적용 전, 섹션 원본 px. 측정값 또는 역할 기본값(be-handoff 6.3)' }
            fontScale: { type: number, exclusiveMinimum: 0, description: '적용 배율 — 셀러 배율, 없으면 1.0(null 아님). 저장상의 null 정규화와는 별개다' }
            fontColor: { type: string, description: "글자색 — AI 현행 검증은 대문자 6자리 '#RRGGBB'(측정값 null은 승인 기본값으로 해소한 뒤 전달, AI A3). API 표기·정규화 책임은 BE·FE 확정 전" }
            align: { type: string, description: '최종 정렬 left | center | right(AI A3) — 원본 정렬 근거가 있으면 그 정렬, 없을 때만 left. 측정값 null은 승인 기본값으로 해소한 값' }
            letterSpacingEm: { type: number, description: '자간 — 글자 크기 대비 비율. px는 공통 렌더 코드가 최종 글자 크기로 계산' }
            lineHeightRatio: { type: number, exclusiveMinimum: 0, description: '행간 비율 — 승인값 1.2(AI 회신). 행간 px = 비율 × 최종 글자 크기' }
    PreviewRender:
      type: object
      description: >
        [PRD v3.5.10 · BE 계약안 · 구현 대기] **현재 시도**(attempt)와 **표시 결과**(result)를 나눈다.
        새 시도가 진행 중이거나 실패해도 이전 성공 결과를 result로 낼 수 있다.
        `isCurrent=true`면 result가 있고 `result.overflow`는 객체, false면 result가 null이거나 `result.overflow`가 null이다.
      required: [attempt, result, isCurrent]
      properties:
        attempt:
          oneOf: [ { $ref: '#/components/schemas/PreviewRenderAttempt' }, { type: 'null' } ]
          description: '이 섹션의 현재 미리보기 시도. null = 현재 시도 없음(포함 섹션의 정상 흐름에는 없다 — 판정은 reviewPreview 설명 g·e)'
        result:
          oneOf: [ { $ref: '#/components/schemas/PreviewRenderResult' }, { type: 'null' } ]
          description: '화면에 표시하는 마지막 성공 결과. null = 아직 성공 결과 없음(renderedUrl도 null)'
        isCurrent:
          type: boolean
          description: '서버 계산. `result != null && result.inputFingerprint == inputFingerprint`(같은 응답 안에서). 조회 시점 서버 입력 기준이며 FE의 미저장 편집과 같다는 뜻이 아니다.'
    PreviewRenderAttempt:
      type: object
      description: '[PRD v3.5.10 · BE 계약안 · 구현 대기] 섹션의 현재 미리보기 시도'
      required: [taskId, status, errorCode, retryable]
      properties:
        taskId: { type: integer, format: int64, description: '저장 응답의 rerenderTaskId와 같은 번호 체계 — 내 저장에 대한 시도인지 대조할 수 있다' }
        status: { $ref: '#/components/schemas/RenderStatus' }
        errorCode: { type: [string, 'null'], description: 'failed일 때 오류 코드(예: PREVIEW_FAILED)' }
        retryable: { type: boolean, description: 'failed이고 true면 POST /jobs/{jobId}/tasks/{taskId}/retry 로 다시 시도할 수 있다' }
    PreviewRenderResult:
      type: object
      description: '[PRD v3.5.10 · BE 계약안 · 구현 대기] 화면에 표시하는 마지막 성공 결과'
      required: [taskId, inputFingerprint, rendererId, overflow]
      properties:
        taskId: { type: integer, format: int64, description: '이 결과를 만든 시도' }
        inputFingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: '이 결과를 만든 입력의 지문(섹션 `inputFingerprint`와 같은 계산)' }
        rendererId: { type: string, description: '이 결과를 그린 렌더러' }
        overflow:
          type: [object, 'null']
          additionalProperties: { type: boolean }
          description: >
            블록 ID(문자열) → 넘침. **넘침 판정의 정본.** `isCurrent`가 true일 때만 값을 싣고, false면 서버가 null로 낸다 —
            이전 이미지가 남아 있어도 이전 측정값을 최신 넘침으로 쓰지 않는다. null = 현재 입력에 대한 측정 없음.
            렌더 대상 블록이 0개인 섹션의 현재 결과는 빈 객체 `{}`다.
    ConfirmRequest:
      type: object
      description: >
        acknowledgedWarnings는 개수가 아니라 식별자. 필수 확인 대상 = 포함(include) 섹션 블록의 translation_failed.
        서버는 받은 목록 중 필수 확인 대상만 골라 서버의 미해결 필수 경고 집합과 비교하고, 다르면 409 INVALID_STATE
        (error.details.warnings = 서버 집합). 그 밖의 코드(width_overflow 등)·제외 섹션 블록은 보내도 무시한다 —
        화면 신호 전부를 보내도 된다. 넘침 경고는 표시만 하고 확정을 막지 않는다(2026-10-14 결정).


        [PRD v3.5.10 · 구현 대기] **검사 연결 뒤 필수 확인 대상**(PRD F-CFM-09 조건·①~⑦ 기준) — `{blockId, code}`에 아래 확인 기준을 더해 보낸다:
        `translation_failed`(번역 처리 실패로 번역문이 빈 블록 — 현행) / `check_failed`(현재 입력 검사가 최종 실패, 후보 신호) /
        `prohibited_expression`(현재 입력 규칙 검사의 미해결 규제 경고 — 금지·조건부 매칭 모두. 화면 구분은 `ReviewSignal.regulationVerdict`).
        `mandatory_term_unapplied`는 확인 대상으로 세지 않는다 — **PRD F-CFM-09 I열 기준**("⑩ 원문 판정 행과 미적용 강제 용어는 세지 않는다", PM 재확인 11-04).
        확인 대상에서 빼는 것과 검사·근거·flag·신호 보존은 함께 한다 — 강제 용어 flag와 신호는 그대로 남고 화면에도 보인다. 원문 판정 행만 있는 작업은 확인 없이 확정된다(⑦).
        비교 대상은 서버가 계산한 **현재 입력**의 미해결 집합이다. `{blockId, code}`만으로는 셀러가 **어느 입력·어느 실패를 보고** 확인했는지 알 수 없으므로 코드마다 확인 기준을 받는다
        (검사 결과의 최신성과 확인한 내용의 최신성은 별개):

        - `check_failed`·`prohibited_expression` → `inputKey` — **확정(FE 구조 수용 11-03 · AI 키 기준 11-04)**. 화면이 보여 준 결과의 `TextBlock.check.inputKey`.
          현재 입력의 키와 다르면 409 INVALID_STATE(`details.reason: acknowledgement_outdated`, `details.warnings` = 서버 집합). FE는 이때 최신 검사 결과를 재조회하고 확인창을 갱신한다.

        - `translation_failed` → **미결 — BE 제안(FE 확인)**. 현행 서버 기준 발생·해소 조건(`app/flows/final.py` `block_signals`):
          발생 = 그 섹션의 현재 번역 시도가 failed이고(구조·호출 실패면 대상 전체, 부분 실패면 검증 결과의 실패 목록) 블록의 `trans_1`이 NULL이며 `block_status = machine`(셀러가 손대지 않음).
          해소 = 번역 재시도가 그 블록을 채우거나 셀러가 번역문을 저장하면(빈 문자열 저장 포함 — `edited`가 된다) 조건이 깨져 신호가 사라진다.
          그래서 이 코드는 **처리 실패**이고, 셀러가 일부러 비운 **빈 번역문**(빈 문자열 저장)과는 다르다 — PRD F-CFM-09 "번역 실패로 번역문이 빈 블록"과 같은 뜻이다.
          재시도가 다시 실패하면 같은 블록에 같은 코드가 새 실패로 다시 나온다 — 코드만으로는 과거 확인이 어느 실패에 대한 것인지 구분할 수 없다.
          BE 제안: 확인 항목에 실패 시도의 `taskId`(현행 신호 `ReviewSignal.taskId`에 이미 실림)를 보내고, 서버는 지금 그 블록을 실패시킨 현재 번역 시도와 다르면 409 `acknowledgement_outdated`.
          `inputKey`는 쓰지 않는다(검사 대상이 아니라 `check`가 null).

        확인한 목록은 감사 로그에 블록 ID·코드·확인 기준(`inputKey`·`taskId`)·revision으로 남긴다(PM C3). `prohibited_expression`을 필수로 바꾸는 것은 검사 연결 뒤에만 적용한다.
        블록 하나에 같은 코드의 경고가 여럿이어도 블록·코드 단위로 한 번 확인한다(경고별 식별자 warningKey는 #82).
        **차수**: 현행 `translation_failed` 확인은 유지된다. 검사 중 확정 거절·미저장 번역문 확인창은 PM 2차 확정이다(confirmReview). 차수를 확인할 것은
        `check_failed`·`prohibited_expression`의 필수 확인과 `acknowledgedSections`뿐이다(실행계획상 F-CFM-09는 3차). 조건부 칩 표시는 이 확인 절차와 별개다.


        **실행 실패 섹션 확인(PRD F-CFM-09 ③)** — `acknowledgedSections: [{sectionId, reason, taskId}]`는 FE가 **조건부 수용**했다(11-04). 블록 경고와 한 확인창에서 받는다.
        `reason`(BE 계약안) = `inpaint_failed`(인페인팅 실패) · `render_failed`(미리보기 렌더 최종 실패이고 표시할 성공 결과가 없는 섹션 — N4 렌더 실패. 이 사유를 성공 결과가 없는 섹션으로 한정한 것은 BE 해석 — PM 답이 N4 렌더 실패에 대한 것이라서). 12월 라벨·로고 판단 실패는 범위 밖.
        `taskId` = 화면이 본 실패 시도. 인페인팅은 `/tasks` 항목(`taskType=inpaint`·`unitType=section`·`unitId=섹션 ID` — 현행 서버는 진행 중 하류 실행의 현재 시도만 낸다, `app/flows/status.py`),
        렌더는 `/preview`의 `render.attempt.taskId`.
        서버 검증: 대상 = 포함 섹션 중 지금 실행 실패 상태인 섹션(N5에서 제외한 섹션은 대상 아님 — ④). 섹션마다 실패 종류(`reason`)와 현재 실패 시도(`taskId`)가 맞아야 한다.
        집합이 다르면 409 `acknowledgement_mismatch`(`details.sections`), 시도가 바뀌었으면 409 `acknowledgement_outdated`.
        **출력 정책(PM 확정 11-04 — 출처는 검토 채팅에 제공된 PM 원문)**: 인페인팅 실패 섹션 = 원본 위에 번역문. N4 렌더 실패 섹션 = N6에서 원본을 쓴다 — 최종 단계에서 다시 그리지 않고, 원본을 쓴 것을 새 렌더 실패로 세지 않는다.
        N6 결과는 셀러가 N5에서 확인한 모습과 같아야 한다.
        **확인 필요(FE)**: N4 렌더 실패 섹션을 N5에서 실제로 원본으로 보여 주는지(현행 `/preview`는 성공 결과가 없으면 `renderedUrl` null).
        **범위 밖(PM 별도 확인)**: 이전 성공 이미지가 있는 상태에서 N5 재렌더가 실패한 섹션 — 이 PM 답을 그 경우까지 넓히지 않는다(이전 성공 이미지를 버리고 원본을 쓴다는 뜻이 아니다).
      properties:
        acknowledgedWarnings:
          type: array
          items:
            type: object
            properties:
              blockId: { type: integer, format: int64 }
              code: { $ref: '#/components/schemas/SignalCode' }
              inputKey:
                type: string
                pattern: '^[0-9a-f]{64}$'
                description: '[PRD v3.5.10 · 계약 확정(FE·AI) · 구현 대기] 확인할 때 화면이 보여 준 결과의 블록 검사 입력 키(`TextBlock.check.inputKey`). check_failed·prohibited_expression에 보낸다. translation_failed에는 보내지 않는다'
              taskId:
                type: integer
                format: int64
                description: '[PRD v3.5.10 · BE 계약안 · FE 확인] translation_failed 확인의 기준 — 화면이 본 실패 번역 시도(`ReviewSignal.taskId`). 지금 그 블록을 실패시킨 현재 번역 시도와 다르면 409 acknowledgement_outdated'
        acknowledgedSections:
          type: array
