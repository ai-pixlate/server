# KubeSphere: Projects(estsoft33) > Application Workloads > Services > Create 로 만들어도 된다.
# nodePort 는 30000~32767 중 하나가 자동 배정된다. 배정된 번호는 서비스 상세의 External Access 에서 확인한다.
apiVersion: v1
kind: Service
metadata:
  name: pixlate-gpu-ssh
  namespace: estsoft33
  labels:
    app: pixlate-gpu
spec:
  type: NodePort
  selector:
    app: pixlate-gpu
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
