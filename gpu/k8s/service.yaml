# KubeSphere: Projects(virl) > Application Workloads > Services > Create > Edit YAML 에 붙여넣기
# nodePort를 비워 두면 30000~32767 중 하나가 자동 배정된다. 배정된 번호는 서비스 상세에서 확인한다.
apiVersion: v1
kind: Service
metadata:
  name: pixlate-gpu
  namespace: virl
  labels:
    app: pixlate-gpu
spec:
  type: NodePort
  selector:
    app: pixlate-gpu
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
